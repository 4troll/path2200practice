<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PATH2200 Test 1 Practice Exam</title>
  <style>
:root {
            --primary: #0f172a;
            --accent: #2563eb;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --correct-border: #16a34a;
            --correct-bg: #f0fdf4;
            --correct-text: #15803d;
            --wrong-border: #dc2626;
            --wrong-bg: #fef2f2;
            --wrong-text: #b91c1c;
            --partial-border: #d97706;
            --partial-bg: #fffbeb;
            --partial-text: #92400e;
            --border-color: #e2e8f0;
            --selected-border: #93c5fd;
            --selected-bg: #eff6ff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            line-height: 1.5;
            padding-bottom: 60px;
        }

        /* Sticky Header */
        header {
            position: -webkit-sticky;
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--primary);
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.1);
            padding: 12px 16px;
        }

        .header-content {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .header-title {
            min-width: 0;
        }

        .header-title h1 {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .header-title p {
            font-size: 0.75rem;
            color: #94a3b8;
        }

        .score-badge {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            white-space: nowrap;
            flex-shrink: 0;
        }

        /* Navigation / Filter Bar */
        .nav-bar {
            max-width: 800px;
            margin: 16px auto 0;
            padding: 0 16px;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .nav-bar::-webkit-scrollbar { display: none; }

        .filter-btn,
        .reset-btn {
            background: #ffffff;
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .filter-btn:hover,
        .reset-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .filter-btn.active {
            background: var(--accent);
            color: #ffffff;
            border-color: var(--accent);
        }

        /* Main Container */
        main {
            max-width: 800px;
            margin: 16px auto;
            padding: 0 16px;
        }

        /* Question Cards */
        .q-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }

        .q-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 8px;
        }

        .q-num {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .q-cat {
            font-size: 0.72rem;
            color: var(--text-muted);
            background: #f1f5f9;
            padding: 2px 8px;
            border-radius: 4px;
            white-space: nowrap;
        }

        .q-text {
            font-size: 0.98rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 16px;
            line-height: 1.45;
        }

        /* Options */
        .opt-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .opt-btn {
            display: flex;
            align-items: flex-start;
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid var(--border-color);
            border-radius: 10px;
            background: #ffffff;
            color: var(--text-main);
            font-size: 0.92rem;
            font-weight: 500;
            text-align: left;
            cursor: pointer;
            transition: border-color 0.15s ease, background-color 0.15s ease, opacity 0.15s ease;
        }

        .opt-btn:hover:not(:disabled) {
            border-color: #cbd5e1;
            background: #f8fafc;
        }

        .opt-btn:active:not(:disabled) { background-color: #f1f5f9; }

        .opt-prefix {
            font-weight: 700;
            margin-right: 8px;
            color: var(--text-muted);
            flex-shrink: 0;
        }

        .opt-btn.selected {
            border-color: var(--selected-border);
            background: var(--selected-bg);
            color: #1d4ed8;
        }

        .q-card.answered .opt-btn {
            cursor: default;
            pointer-events: none;
            opacity: 0.6;
        }

        .q-card.answered .opt-btn.user-correct,
        .q-card.answered .opt-btn.reveal-correct {
            background-color: var(--correct-bg) !important;
            border-color: var(--correct-border) !important;
            color: var(--correct-text) !important;
            opacity: 1 !important;
            font-weight: 600;
        }

        .q-card.answered .opt-btn.user-wrong {
            background-color: var(--wrong-bg) !important;
            border-color: var(--wrong-border) !important;
            color: var(--wrong-text) !important;
            opacity: 1 !important;
            font-weight: 600;
        }

        /* PATH2200 Submit */
        .submit-q-btn {
            margin-top: 14px;
            padding: 9px 14px;
            border: 1px solid var(--accent);
            border-radius: 8px;
            background: var(--accent);
            color: #ffffff;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.15s ease, transform 0.1s ease;
        }

        .submit-q-btn:hover:not(:disabled) { opacity: 0.92; }
        .submit-q-btn:active:not(:disabled) { transform: scale(0.98); }
        .submit-q-btn:disabled { opacity: 0.45; cursor: not-allowed; }

        .feedback-box {
            display: none;
            margin-top: 14px;
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 0.88rem;
            line-height: 1.45;
        }

        .feedback-box.correct {
            background-color: var(--correct-bg);
            border-left: 4px solid var(--correct-border);
            color: var(--correct-text);
        }

        .feedback-box.incorrect {
            background-color: var(--wrong-bg);
            border-left: 4px solid var(--wrong-border);
            color: var(--wrong-text);
        }

        .feedback-box.partial {
            background-color: var(--partial-bg);
            border-left: 4px solid var(--partial-border);
            color: var(--partial-text);
        }

        .feedback-title { font-weight: 700; margin-bottom: 4px; }
        .explanation { margin-top: 4px; color: inherit; }

        @media (max-width: 640px) {
            header { padding: 10px 12px; }
            .header-title h1 { font-size: 1rem; }
            .header-title p { font-size: 0.7rem; }
            .score-badge { padding: 5px 10px; font-size: 0.8rem; }
            .nav-bar { padding: 0 12px; margin-top: 12px; }
            main { margin-top: 12px; padding: 0 12px; }
            .q-card { padding: 16px; }
            .q-text { font-size: 0.95rem; }
            .opt-btn { font-size: 0.9rem; padding: 11px 12px; }
        }
    </style>
</head>

<body>

    <header>
        <div class="header-content">
            <div class="header-title">
                <h1>PATH2200 Test 1 Practice Exam</h1>
                <p id="header-subtitle">160 Questions • 5 Lectures</p>
            </div>
            <div class="score-badge" id="score-counter">
                Grade: 0%
            </div>
        </div>
    </header>

    <div class="nav-bar" id="navTabs">
        <button class="filter-btn active" data-lec="all" type="button">All (160)</button>
        <button class="filter-btn" data-lec="1" type="button">Lec 1: Intro &amp; Adaptation (30)</button>
        <button class="filter-btn" data-lec="2" type="button">Lec 2: Injury &amp; Cell Death (30)</button>
        <button class="filter-btn" data-lec="3" type="button">Lec 3: Inflammation (40)</button>
        <button class="filter-btn" data-lec="4" type="button">Lec 4: Immunity (30)</button>
        <button class="filter-btn" data-lec="5" type="button">Lec 5: Hypersensitivity &amp; HIV (30)</button>
        <button class="reset-btn" id="resetBtn" type="button">Reset</button>
    </div>

    <main id="questionsContainer"></main>

    <script>
    // QUESTION BANK DATA
    // ---------------------------------------------------------
    const questionBank = [
      // ==========================================
      // LECTURE 1: Altered Cell Biology & Adaptation (30 Qs)
      // ==========================================
      {
        lec: 1,
        type: "sata",
        text: "A 62-year-old male with long-standing uncontrolled hypertension shows left ventricular hypertrophy on echocardiogram. Which statements correctly describe the cellular adaptation occurring in his heart tissue? (SELECT ALL THAT APPLY)",
        options: [
          { text: "It involves an increase in individual cardiac cell size.", correct: true },
          { text: "It is driven by increased mechanical stretching and functional workload.", correct: true },
          { text: "It results in a functional increase in tissue mass rather than cellular edema.", correct: true },
          { text: "It is characterized by rapid cell division and increased cardiomyocyte numbers.", correct: false },
          { text: "It represents cellular metaplasia in cardiac tissue.", correct: false }
        ],
        explanation: "Hypertrophy is an increase in cell size (not cell number) due to increased functional demand or stretching, resulting in functional organ enlargement."
      },
      {
        lec: 1,
        type: "sata",
        text: "Which of the following are classified as subjective symptoms reported by a patient rather than objective clinical signs? (SELECT ALL THAT APPLY)",
        options: [
          { text: "Nausea", correct: true },
          { text: "Lower back pain", correct: true },
          { text: "Dizziness upon standing", correct: true },
          { text: "Body temperature of 38.8°C", correct: false },
          { text: "Elevated leukocyte count on blood work", correct: false }
        ],
        explanation: "Symptoms are subjective complaints reported by the person with the disease (pain, nausea, dizziness). Signs are objective complaints noted by an observer."
      },
      {
        lec: 1,
        type: "sata",
        text: "A bronchial biopsy of a chronic smoker shows replacement of normal ciliated columnar epithelial cells with stratified squamous epithelial cells. Which statements accurately describe this cellular adaptation? (SELECT ALL THAT APPLY)",
        options: [
          { text: "It is an example of metaplasia.", correct: true },
          { text: "It involves the reprogramming of undifferentiated stem cells in the tissue.", correct: true },
          { text: "The primary tissue type remains epithelial.", correct: true },
          { text: "The change is fully reversible if the irritating stimulus is removed.", correct: true },
          { text: "It is caused by mature differentiated cells directly mutating into another mature cell type.", correct: false }
        ],
        explanation: "Metaplasia is a reversible change in cell type caused by the reprogramming of undifferentiated stem cells due to cytokines/growth factors. Primary tissue type remains the same."
      },
      {
        lec: 1,
        type: "sata",
        text: "Which of the following conditions or stimuli cause cellular atrophy? (SELECT ALL THAT APPLY)",
        options: [
          { text: "Denervation following nerve injury", correct: true },
          { text: "Chronic ischemia to a tissue", correct: true },
          { text: "Nutrient starvation", correct: true },
          { text: "Loss of endocrine/hormonal stimulation", correct: true },
          { text: "Immobilization of a limb in a cast (disuse)", correct: true }
        ],
        explanation: "Atrophy is a decrease in cell size caused by disuse, denervation, ischemia, nutrient starvation, endocrine malfunction, aging, or pressure."
      },
      {
        lec: 1,
        type: "sata",
        text: "A 58-year-old male presents with urinary frequency and hesitancy. Diagnosis reveals Benign Prostatic Hyperplasia (BPH). Which features characterize this process? (SELECT ALL THAT APPLY)",
        options: [
          { text: "An increase in the total number of prostatic cells", correct: true },
          { text: "Driven by increased hormonal stimulation", correct: true },
          { text: "Compression of the prostatic urethra", correct: true },
          { text: "An increase in individual cell size without cell division", correct: false },
          { text: "Irreversible malignant conversion", correct: false }
        ],
        explanation: "Hyperplasia is an increase in cell number driven by increased demand or hormone stimulation. BPH compresses the urethra causing urinary symptoms."
      },
      {
        lec: 1,
        type: "sata",
        text: "Which of the following correctly align with the levels of disease prevention defined in pathophysiology? (SELECT ALL THAT APPLY)",
        options: [
          { text: "Primary prevention involves removing risk factors (e.g., immunizations)", correct: true },
          { text: "Secondary prevention involves early detection and screening (e.g., colonoscopies)", correct: true },
          { text: "Tertiary prevention involves reducing complications of established disease (e.g., antibiotic use)", correct: true },
          { text: "Primary prevention is aimed at surgical resection of symptomatic tumors", correct: false },
          { text: "Secondary prevention is palliative terminal care", correct: false }
        ],
        explanation: "Primary prevention removes risk factors (immunizations); Secondary detects disease early (colonoscopy); Tertiary reduces complications (antibiotics)."
      },
      {
        lec: 1,
        type: "sata",
        text: "Which microscopic features are characteristic of cervical dysplasia? (SELECT ALL THAT APPLY)",
        options: [
          { text: "Increased nuclear size and nuclear-to-cytoplasmic ratio", correct: true },
          { text: "Hyperchromatic (darker) nuclei", correct: true },
          { text: "Disorderly and disorganized arrangement of cells", correct: true },
          { text: "Increased rate of cell division", correct: true },
          { text: "Complete conversion of epithelial tissue into bone tissue", correct: false }
        ],
        explanation: "Dysplasia features enlarged dark (hyperchromatic) nuclei, reduced cytoplasm, disorganized arrangement, and increased cell division."
      },
      {
        lec: 1,
        type: "sata",
        text: "According to lecture material, Mesenchymal Stem Cells (MSCs) can differentiate into which of the following lineages? (SELECT ALL THAT APPLY)",
        options: [
          { text: "Osteoblasts / Osteocytes (Bone)", correct: true },
          { text: "Chondrocytes (Cartilage)", correct: true },
          { text: "Myoblasts (Muscle)", correct: true },
          { text: "Fibroblasts (Tendon / Ligament)", correct: true },
          { text: "Adipocytes (Fat)", correct: true }
        ],
        explanation: "MSCs proliferate and differentiate into osteoblasts, chondrocytes, myoblasts, stromal cells, fibroblasts, and adipocytes."
      },
      {
        lec: 1,
        type: "sata",
        text: "Which of the following accurately reflect diagnostic test outcome definitions? (SELECT ALL THAT APPLY)",
        options: [
          { text: "A true positive correctly identifies a person who has the disease.", correct: true },
          { text: "A false positive incorrectly indicates disease presence in a healthy person.", correct: true },
          { text: "A true negative correctly identifies a person without the disease.", correct: true },
          { text: "A false negative incorrectly indicates no disease in an infected person.", correct: true },
          { text: "A false positive means the test missed a disease that was present.", correct: false }
        ],
        explanation: "True Positive = disease present + test pos; False Positive = disease absent + test pos; True Negative = disease absent + test neg; False Negative = disease present + test neg."
      },
      {
        lec: 1,
        type: "sata",
        text: "Which of the following statements regarding dysplasia are true? (SELECT ALL THAT APPLY)",
        options: [
          { text: "Dysplasia is characterized by irregular, dysfunctional, and disorganized cell growth.", correct: true },
          { text: "Dysplasia frequently occurs in respiratory and digestive mucosa.", correct: true },
          { text: "Dysplasia is NOT considered a true adaptive process.", correct: true },
          { text: "Dysplastic changes are still reversible if chronic irritation is removed.", correct: true },
          { text: "Dysplasia is defined as an increase in cell size without nuclear changes.", correct: false }
        ],
        explanation: "Dysplasia is abnormal, disorganized cell growth in mucosal linings, non-adaptive, but still reversible."
      },
      {
        lec: 1,
        type: "mcq",
        text: "How does the World Health Organization (WHO) define health?",
        options: [
          { text: "A state of complete physical, mental, and social well-being and not merely the absence of disease and infirmity", correct: true },
          { text: "The absence of detectable clinical signs or structural organic lesions", correct: false },
          { text: "A static equilibrium maintained strictly by hormonal feedback loops", correct: false },
          { text: "The ability to perform daily physical activities without fatigue", correct: false },
          { text: "An uninterrupted state of cellular mitosis and tissue proliferation", correct: false }
        ],
        explanation: "WHO defines health as 'a state of complete physical, mental, and social well-being and not merely the absence of disease and infirmity'."
      },
      {
        lec: 1,
        type: "mcq",
        text: "Which term specifically describes the evolution or development of a disease from the initial etiological agent to its ultimate expression?",
        options: [
          { text: "Pathogenesis", correct: true },
          { text: "Etiology", correct: false },
          { text: "Morphology", correct: false },
          { text: "Prognosis", correct: false },
          { text: "Histology", correct: false }
        ],
        explanation: "Pathogenesis is the evolution of the disease from the etiological agent until ultimate expression."
      },
      {
        lec: 1,
        type: "mcq",
        text: "A 22-year-old worker develops thick calluses on his palms after weeks of manual farm labor. What cellular adaptation has occurred?",
        options: [
          { text: "Hyperplasia", correct: true },
          { text: "Atrophy", correct: false },
          { text: "Metaplasia", correct: false },
          { text: "Dysplasia", correct: false },
          { text: "Anaplasia", correct: false }
        ],
        explanation: "Skin calluses are an adaptive response involving epidermal cell multiplication (hyperplasia) due to friction/demand."
      },
      {
        lec: 1,
        type: "mcq",
        text: "The study of cell and tissue structure specifically using a microscope is referred to as:",
        options: [
          { text: "Histology", correct: true },
          { text: "Gross morphology", correct: false },
          { text: "Epidemiology", correct: false },
          { text: "Etiology", correct: false },
          { text: "Pathogenesis", correct: false }
        ],
        explanation: "Histology specifically deals with the cells and tissues of the body using a microscope."
      },
      {
        lec: 1,
        type: "mcq",
        text: "Which term refers to the prediction of the probable outcome and recovery course of a disease based on similar clinical cases?",
        options: [
          { text: "Prognosis", correct: true },
          { text: "Diagnosis", correct: false },
          { text: "Etiology", correct: false },
          { text: "Sequelae", correct: false },
          { text: "Syndrome", correct: false }
        ],
        explanation: "Prognosis is the prediction of the probable outcome of a disease based on the condition and usual course."
      },
      {
        lec: 1,
        type: "mcq",
        text: "A patient with gastroesophageal reflux disease (GERD) undergoes esophageal biopsy. Columnar gastric-type epithelium is found replacing normal squamous epithelium. What is this condition called?",
        options: [
          { text: "Metaplasia", correct: true },
          { text: "Hypertrophy", correct: false },
          { text: "Dysplasia", correct: false },
          { text: "Atrophy", correct: false },
          { text: "Anaplasia", correct: false }
        ],
        explanation: "GERD causes acid reflux leading to gastric glandular metaplasia (Barrett's esophagus) where squamous epithelium changes to columnar."
      },
      {
        lec: 1,
        type: "mcq",
        text: "Which principle describes the dynamic state of balance maintained by the body while adjusting to internal and external environmental changes?",
        options: [
          { text: "Homeostasis", correct: true },
          { text: "Pathogenesis", correct: false },
          { text: "Differentiation", correct: false },
          { text: "Allostasis", correct: false },
          { text: "Metaplasia", correct: false }
        ],
        explanation: "Homeostasis is the dynamic steady state maintained by the body while adjusting to changing conditions."
      },
      {
        lec: 1,
        type: "mcq",
        text: "What is the key difference between cellular differentiation and cellular growth?",
        options: [
          { text: "Differentiation involves specialized cell maturation/commitment, whereas growth refers to cell size/number increase", correct: true },
          { text: "Differentiation is always pathologic, whereas growth is always physiologic", correct: false },
          { text: "Differentiation decreases cell size, whereas growth increases cell size only", correct: false },
          { text: "Differentiation occurs only in stem cells after death, whereas growth occurs before birth", correct: false },
          { text: "There is no difference; both terms describe cell division", correct: false }
        ],
        explanation: "Growth refers to proliferation/size increase, whereas differentiation is the acquisition of specialized functions along cell lineages."
      },
      {
        lec: 1,
        type: "mcq",
        text: "An arm immobilized in a cast for 6 weeks shows reduced muscle circumference. What primary stimulus caused this muscular atrophy?",
        options: [
          { text: "Disuse", correct: true },
          { text: "Denervation", correct: false },
          { text: "Ischemia", correct: false },
          { text: "Endocrine failure", correct: false },
          { text: "Nutrient starvation", correct: false }
        ],
        explanation: "Skeletal muscle atrophy following cast immobilization is driven by disuse ('if you don't use it, you lose it')."
      },
      {
        lec: 1,
        type: "mcq",
        text: "Which level of prevention is demonstrated by routine childhood immunizations?",
        options: [
          { text: "Primary prevention", correct: true },
          { text: "Secondary prevention", correct: false },
          { text: "Tertiary prevention", correct: false },
          { text: "Quaternary prevention", correct: false },
          { text: "Empiric prevention", correct: false }
        ],
        explanation: "Primary prevention removes risk factors before disease occurs, such as immunizations."
      },
      {
        lec: 1,
        type: "mcq",
        text: "An objective physical observation made directly by an examining clinician is defined as a:",
        options: [
          { text: "Sign", correct: true },
          { text: "Symptom", correct: false },
          { text: "Sequela", correct: false },
          { text: "Syndrome", correct: false },
          { text: "Prognosis", correct: false }
        ],
        explanation: "A sign is an objective complaint or finding noted by an observer."
      },
      {
        lec: 1,
        type: "mcq",
        text: "What term describes a pathologic or traumatic discontinuity of a body organ or tissue?",
        options: [
          { text: "Lesion", correct: true },
          { text: "Etiology", correct: false },
          { text: "Syndrome", correct: false },
          { text: "Symptom", correct: false },
          { text: "Infarkt", correct: false }
        ],
        explanation: "A lesion is defined as a pathologic or traumatic discontinuity of a body organ or tissue."
      },
      {
        lec: 1,
        type: "mcq",
        text: "A patient reports feeling fatigued and mildly unwell shortly before distinct clinical manifestations of an infection appear. This stage is known as the:",
        options: [
          { text: "Prodromal period", correct: true },
          { text: "Latent period", correct: false },
          { text: "Acute onset", correct: false },
          { text: "Resolution phase", correct: false },
          { text: "Convalescent phase", correct: false }
        ],
        explanation: "The prodromal period is the early stage featuring vague, preliminary signs/symptoms before full disease manifestation."
      },
      {
        lec: 1,
        type: "mcq",
        text: "Cellular adaptation occurs in response to environmental stresses. What primary cellular mechanism allows cells to adapt?",
        options: [
          { text: "Altering gene expression", correct: true },
          { text: "Lysis of plasma membranes", correct: false },
          { text: "Permanent nuclear clumping", correct: false },
          { text: "Exporting all organelles", correct: false },
          { text: "Immediate apoptosis", correct: false }
        ],
        explanation: "Cells adapt to altered environmental stresses by altering their gene expression."
      },
      {
        lec: 1,
        type: "mcq",
        text: "Which cellular adaptation involves an increase in cell size driven by increased functional workload or hormone stimulation?",
        options: [
          { text: "Hypertrophy", correct: true },
          { text: "Hyperplasia", correct: false },
          { text: "Metaplasia", correct: false },
          { text: "Atrophy", correct: false },
          { text: "Dysplasia", correct: false }
        ],
        explanation: "Hypertrophy is defined as an increase in cell size due to increased workload, stretch, or hormones."
      },
      {
        lec: 1,
        type: "mcq",
        text: "The study of all factors that cause or contribute to the development of a disease is called:",
        options: [
          { text: "Etiology", correct: true },
          { text: "Pathogenesis", correct: false },
          { text: "Histology", correct: false },
          { text: "Epidemiology", correct: false },

          { text: "MHC Class I", correct: false },
          { text: "Fc receptor", correct: false },
          { text: "IgE receptor", correct: false }
        ],
        explanation: "HIV envelope gp120 binds to host CD4 receptors on helper T cells, macrophages, and glial cells."
      },
      {
        lec: 5,
        type: "mcq",
        text: "Which enzyme allows HIV to convert its single-stranded viral RNA genome into double-stranded viral DNA inside host cytoplasm?",
        options: [
          { text: "Reverse transcriptase", correct: true },
          { text: "Integrase", correct: false },
          { text: "Protease", correct: false },
          { text: "Phospholipase A2", correct: false },
          { text: "Cyclooxygenase", correct: false }
        ],
        explanation: "Reverse transcriptase converts HIV RNA into DNA inside the host cell."
      },
      {
        lec: 5,
        type: "mcq",
        text: "Which laboratory measurement is used as the primary diagnostic benchmark to monitor HIV progression and define AIDS?",
        options: [
          { text: "CD4+ T cell count", correct: true },
          { text: "Erythrocyte sedimentation rate", correct: false },
          { text: "Total serum IgE level", correct: false },
          { text: "Neutrophil count", correct: false },
          { text: "Platelet count", correct: false }
        ],
        explanation: "CD4+ T cell count decrease is the key diagnostic marker used to monitor HIV progression and define AIDS (<200 cells/uL)."
      },
      {
        lec: 5,
        type: "mcq",
        text: "The 'window period' in HIV infection refers to the initial timeframe during which the patient is:",
        options: [
          { text: "Infected and infectious, but tests serologically negative for anti-HIV antibodies", correct: true },
          { text: "Diagnosed with full-blown AIDS with opportunistic cancers", correct: false },
          { text: "Completely immune to viral replication", correct: false },
          { text: "Serologically positive with normal CD4 count above 1000", correct: false },
          { text: "Cured of viral infection", correct: false }
        ],
        explanation: "The window period (4-7 weeks) is when the patient is serologically negative for antibodies but infected and contagious."
      },
      {
        lec: 5,
        type: "mcq",
        text: "What is the leading cause of death worldwide among individuals living with HIV/AIDS?",
        options: [
          { text: "Mycobacterium tuberculosis (TB)", correct: true },
          { text: "Pneumocystis jiroveci pneumonia", correct: false },
          { text: "Kaposi sarcoma", correct: false },
          { text: "Candida thrush", correct: false },
          { text: "Cryptosporidium diarrhea", correct: false }
        ],
        explanation: "TB is the leading cause of death with HIV worldwide."
      },
      {
        lec: 5,
        type: "mcq",
        text: "An AIDS patient presents with chronic, severe watery diarrhea. Stool analysis reveals a common protozoal pathogen. Which organism is most likely?",
        options: [
          { text: "Cryptosporidium parvum", correct: true },
          { text: "Candida albicans", correct: false },
          { text: "Staphylococcus aureus", correct: false },
          { text: "Pneumocystis jiroveci", correct: false },
          { text: "Clostridium perfringens", correct: false }
        ],
        explanation: "Cryptosporidium parvum is a common protozoal GI infection causing severe gastroenteritis/diarrhea in AIDS."
      },
      {
        lec: 5,
        type: "mcq",
        text: "Kaposi sarcoma is a malignancy affecting which cell type in AIDS patients?",
        options: [
          { text: "Vascular endothelial cells", correct: true },
          { text: "CD4+ T lymphocytes", correct: false },
          { text: "Glial cells in the brain", correct: false },
          { text: "Alveolar pneumocytes", correct: false },
          { text: "Osteoblasts in long bones", correct: false }
        ],
        explanation: "Kaposi sarcoma is a malignancy of vascular endothelial cells (associated with HHV-8) highly prevalent in AIDS."
      },
      {
        lec: 5,
        type: "mcq",
        text: "What term describes the AIDS-related central nervous system condition characterized by cognitive impairment, motor dysfunction, and behavioral symptoms?",
        options: [
          { text: "AIDS Dementia / HAND (HIV-associated neurocognitive disorder)", correct: true },
          { text: "DiGeorge encephalopathy", correct: false },
          { text: "Raynaud syndrome", correct: false },
          { text: "Guillain-Barré crisis", correct: false },
          { text: "Systemic sclerosis", correct: false }
        ],
        explanation: "AIDS dementia (HAND - HIV-associated neurocognitive disorder) is a late CNS manifestation of cognitive/motor/behavioral impairment."
      }
    ];

    // ---------------------------------------------------------
    // TEST LOGIC: shuffled lecture sets, filters, Submit, SATA partial credit
    // ---------------------------------------------------------
    let currentLec = "all";
    let shuffledQuestions = [];
    let activeQuestions = [];
    // keyed by stable question id (the original position in questionBank)
    const userState = new Map();

    function shuffleArray(array) {
        const arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function buildShuffledQuestionSet() {
        // Shuffle each lecture independently so every lecture is randomized,
        // then shuffle the complete set so All mixes lectures and question types.
        const grouped = [];
        for (let lec = 1; lec <= 5; lec++) {
            const lectureQuestions = questionBank
                .map((q, index) => ({ ...q, qid: index }))
                .filter(q => q.lec === lec);
            grouped.push(...shuffleArray(lectureQuestions).map(q => ({
                ...q,
                options: shuffleArray(q.options)
            })));
        }
        shuffledQuestions = shuffleArray(grouped);
    }

    function setActiveQuestions(lec) {
        currentLec = lec;
        activeQuestions = lec === "all"
            ? [...shuffledQuestions]
            : shuffledQuestions.filter(q => q.lec === Number(lec));
    }

    function resetAttempt() {
        userState.clear();
        buildShuffledQuestionSet();
        setActiveQuestions(currentLec);
        renderQuestions();
        updateScore();
    }

    function filterQuestions(lec, button) {
        document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
        button.classList.add('active');
        setActiveQuestions(lec);
        renderQuestions();
        updateScore();
    }

    function updateScore() {
        let submittedCount = 0;
        let totalScore = 0;

        userState.forEach(state => {
            if (state.submitted) {
                submittedCount++;
                totalScore += state.score;
            }
        });

        const grade = submittedCount > 0
            ? Math.round((totalScore / submittedCount) * 100)
            : 0;

        const scoreElem = document.getElementById('score-counter');
        scoreElem.textContent = `Grade: ${grade}%`;
        scoreElem.title = `Answered ${submittedCount} / ${questionBank.length}`;
    }

    function renderQuestions() {
        const container = document.getElementById('questionsContainer');
        container.innerHTML = '';
        const letters = ['A', 'B', 'C', 'D', 'E'];

        activeQuestions.forEach((q, displayIndex) => {
            const state = userState.get(q.qid) || { submitted: false, selected: [], score: 0 };
            const card = document.createElement('div');
            card.className = 'q-card';
            card.id = `qcard-${q.qid}`;

            if (state.submitted) {
                card.classList.add('answered');
                if (state.score === 1) card.classList.add('is-correct');
                else if (state.score > 0) card.classList.add('is-partial');
                else card.classList.add('is-wrong');
            }

            let optionsHTML = '';
            q.options.forEach((opt, optIndex) => {
                let extraClass = '';
                if (state.submitted) {
                    if (opt.correct && state.score === 1) extraClass = 'user-correct';
                    else if (opt.correct) extraClass = 'reveal-correct';
                    else if (state.selected.includes(optIndex)) extraClass = 'user-wrong';
                } else if (state.selected.includes(optIndex)) {
                    extraClass = 'selected';
                }

                optionsHTML += `
                    <button type="button" class="opt-btn ${extraClass}"
                            ${state.submitted ? 'disabled' : ''}
                            onclick="handleOptionClick(${q.qid}, ${optIndex})">
                        <span class="opt-prefix">${letters[optIndex]}.</span>
                        <span>${escapeHTML(opt.text)}</span>
                    </button>
                `;
            });

            const badge = q.type === 'sata' ? 'SATA' : 'MCQ';
            const submitDisabled = state.submitted || state.selected.length === 0 ? 'disabled' : '';
            const buttonText = state.submitted ? 'Submitted' : 'Submit Answer';

            card.innerHTML = `
                <div class="q-header">
                    <span class="q-num">Question ${displayIndex + 1}</span>
                    <span class="q-cat">${badge}</span>
                </div>
                <div class="q-text">${escapeHTML(q.text)}</div>
                <div class="opt-list">${optionsHTML}</div>
                <button class="submit-q-btn" id="btn_${q.qid}" ${submitDisabled}
                        onclick="submitAnswer(${q.qid})">${buttonText}</button>
                <div class="feedback-box" id="feedback_${q.qid}"></div>
            `;

            container.appendChild(card);
            if (state.submitted) showFeedback(q.qid);
        });
    }

    function handleOptionClick(qid, optIndex) {
        const q = shuffledQuestions.find(item => item.qid === qid);
        if (!q) return;

        const existing = userState.get(qid) || { submitted: false, selected: [], score: 0 };
        if (existing.submitted) return;

        let selected;
        if (q.type === 'mcq') {
            selected = [optIndex];
        } else {
            selected = [...existing.selected];
            const index = selected.indexOf(optIndex);
            if (index >= 0) selected.splice(index, 1);
            else selected.push(optIndex);
        }

        userState.set(qid, { submitted: false, selected, score: 0 });
        renderQuestions();
    }

    function submitAnswer(qid) {
        const q = shuffledQuestions.find(item => item.qid === qid);
        const state = userState.get(qid);
        if (!q || !state || state.selected.length === 0 || state.submitted) return;

        state.submitted = true;

        if (q.type === 'mcq') {
            state.score = q.options[state.selected[0]]?.correct ? 1 : 0;
        } else {
            const totalCorrect = q.options.filter(option => option.correct).length;
            let correctSelected = 0;
            let incorrectSelected = 0;

            state.selected.forEach(index => {
                if (q.options[index]?.correct) correctSelected++;
                else incorrectSelected++;
            });

            // Partial-credit scoring requested for SATA questions:
            // +1/N for each correct selection, -1/N for each incorrect selection,
            // with a minimum of 0 and a maximum of 1.
            state.score = Math.min(1, Math.max(0, (correctSelected - incorrectSelected) / totalCorrect));
        }

        userState.set(qid, state);
        updateScore();
        renderQuestions();
    }

    function showFeedback(qid) {
        const q = shuffledQuestions.find(item => item.qid === qid);
        const state = userState.get(qid);
        const fbBox = document.getElementById(`feedback_${qid}`);
        if (!q || !state || !fbBox) return;

        let statusClass = 'incorrect';
        let titleText = '✗ Incorrect';

        if (state.score === 1) {
            statusClass = 'correct';
            titleText = '✓ Correct!';
        } else if (state.score > 0) {
            statusClass = 'partial';
            titleText = `Partial Credit (+${state.score.toFixed(2)})`;
        }

        fbBox.className = `feedback-box ${statusClass}`;
        fbBox.style.display = 'block';
        fbBox.innerHTML = `
            <div class="feedback-title">${titleText}</div>
            <div class="explanation">${escapeHTML(q.explanation)}</div>
        `;
    }

    function escapeHTML(value) {
        return String(value)
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#039;');
    }

    document.getElementById('navTabs').addEventListener('click', event => {
        const button = event.target.closest('.filter-btn');
        if (!button) return;
        filterQuestions(button.dataset.lec, button);
    });

    document.getElementById('resetBtn').addEventListener('click', resetAttempt);

    // Default state: All questions visible, shuffled on page load.
    buildShuffledQuestionSet();
    setActiveQuestions('all');
    renderQuestions();
    updateScore();

    </script>
</body>
</html>
