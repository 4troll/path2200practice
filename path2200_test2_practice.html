<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PATH2200 Pathophysiology Test 2 Practice</title>
  <style>
        :root {
            --primary: #0f172a;
            --accent: #2563eb;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --correct-border: #16a34a;
            --correct-bg: #f0fdf4;
            --correct-text: #15803d;
            --wrong-border: #dc2626;
            --wrong-bg: #fef2f2;
            --wrong-text: #b91c1c;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            line-height: 1.5;
            padding-bottom: 60px;
        }

        /* Sticky Header */
        header {
            position: -webkit-sticky;
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--primary);
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.1);
            padding: 12px 16px;
        }

        .header-content {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-title h1 {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        .header-title p {
            font-size: 0.75rem;
            color: #94a3b8;
        }

        .score-badge {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            white-space: nowrap;
        }

        /* Navigation / Filter Bar */
        .nav-bar {
            max-width: 800px;
            margin: 16px auto 0;
            padding: 0 16px;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .nav-bar::-webkit-scrollbar {
            display: none;
        }

        .filter-btn {
            background: #ffffff;
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .filter-btn.active {
            background: var(--accent);
            color: #ffffff;
            border-color: var(--accent);
        }

        /* Main Container */
        main {
            max-width: 800px;
            margin: 16px auto;
            padding: 0 16px;
        }

        /* Question Cards */
        .q-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }

        .q-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .q-num {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .q-cat {
            font-size: 0.72rem;
            color: var(--text-muted);
            background: #f1f5f9;
            padding: 2px 8px;
            border-radius: 4px;
        }

        .q-text {
            font-size: 0.98rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 16px;
            line-height: 1.45;
        }

        /* Options */
        .opt-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .opt-btn {
            display: flex;
            align-items: flex-start;
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid var(--border-color);
            border-radius: 10px;
            background: #ffffff;
            color: var(--text-main);
            font-size: 0.92rem;
            font-weight: 500;
            text-align: left;
            cursor: pointer;
            transition: border-color 0.15s ease, background-color 0.15s ease;
        }

        .opt-btn:active {
            background-color: #f1f5f9;
        }

        .opt-prefix {
            font-weight: 700;
            margin-right: 8px;
            color: var(--text-muted);
            flex-shrink: 0;
        }

        /* States after selecting */
        .q-card.answered .opt-btn {
            cursor: default;
            pointer-events: none;
            opacity: 0.6;
        }

        .q-card.answered .opt-btn.user-correct {
            background-color: var(--correct-bg) !important;
            border-color: var(--correct-border) !important;
            color: var(--correct-text) !important;
            opacity: 1 !important;
            font-weight: 600;
        }

        .q-card.answered .opt-btn.user-wrong {
            background-color: var(--wrong-bg) !important;
            border-color: var(--wrong-border) !important;
            color: var(--wrong-text) !important;
            opacity: 1 !important;
            font-weight: 600;
        }

        .q-card.answered .opt-btn.reveal-correct {
            background-color: var(--correct-bg) !important;
            border-color: var(--correct-border) !important;
            color: var(--correct-text) !important;
            opacity: 1 !important;
            font-weight: 600;
        }

        /* Explanations */
        .exp-box {
            display: none;
            margin-top: 14px;
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 0.88rem;
            line-height: 1.45;
        }

        .q-card.answered.is-correct .exp-correct {
            display: block;
            background-color: var(--correct-bg);
            border-left: 4px solid var(--correct-border);
            color: var(--correct-text);
        }

        .q-card.answered.is-wrong .exp-wrong {
            display: block;
            background-color: var(--wrong-bg);
            border-left: 4px solid var(--wrong-border);
            color: var(--wrong-text);
        }
    
        .opt-btn.selected {
            border-color: #93c5fd;
            background: #eff6ff;
            color: #1d4ed8;
        }
        .opt-btn:hover:not(:disabled) {
            border-color: #cbd5e1;
            background: #f8fafc;
        }
        .opt-btn:disabled { cursor: default; }
        .q-card.answered .opt-btn { cursor: default; pointer-events: none; opacity: 0.6; }
        .q-card.answered .opt-btn.user-correct,
        .q-card.answered .opt-btn.reveal-correct {
            background-color: var(--correct-bg) !important;
            border-color: var(--correct-border) !important;
            color: var(--correct-text) !important;
            opacity: 1 !important;
            font-weight: 600;
        }
        .q-card.answered .opt-btn.user-wrong {
            background-color: var(--wrong-bg) !important;
            border-color: var(--wrong-border) !important;
            color: var(--wrong-text) !important;
            opacity: 1 !important;
            font-weight: 600;
        }
        .submit-q-btn {
            margin-top: 14px;
            padding: 9px 14px;
            border: 1px solid var(--accent);
            border-radius: 8px;
            background: var(--accent);
            color: #fff;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
        }
        .submit-q-btn:hover:not(:disabled) { opacity: 0.92; }
        .submit-q-btn:active:not(:disabled) { transform: scale(0.98); }
        .submit-q-btn:disabled { opacity: 0.45; cursor: not-allowed; }
        .feedback-box {
            display: none;
            margin-top: 14px;
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 0.88rem;
            line-height: 1.45;
        }
        .feedback-box.correct { background: var(--correct-bg); border-left: 4px solid var(--correct-border); color: var(--correct-text); }
        .feedback-box.incorrect { background: var(--wrong-bg); border-left: 4px solid var(--wrong-border); color: var(--wrong-text); }
        .feedback-box.partial { background: #fffbeb; border-left: 4px solid #d97706; color: #92400e; }
        .feedback-title { font-weight: 700; margin-bottom: 4px; }
        .explanation { margin-top: 4px; }
        .nav-bar { align-items: center; }
        .reset-btn {
            background: #fff;
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            white-space: nowrap;
            cursor: pointer;
            flex-shrink: 0;
        }
        .reset-btn:hover { border-color: var(--accent); color: var(--accent); }
        .header-content { gap: 12px; }
        .header-title { min-width: 0; }
        .header-title h1 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .score-badge { flex-shrink: 0; }
        @media (max-width: 640px) {
            .header-title h1 { font-size: 1rem; }
            .score-badge { padding: 5px 10px; font-size: 0.8rem; }
            .q-card { padding: 16px; }
            .q-text { font-size: 0.95rem; }
            .opt-btn { font-size: 0.9rem; padding: 11px 12px; }
        }
</style>
</head>
<body>
  <header>
    <div class="header-content">
      <div class="header-title">
        <h1>PATH2200 Test 2 Practice</h1>
        <p>161 Questions • Cancer + Musculoskeletal + Readings</p>
      </div>
      <div class="score-badge" id="score-counter">Grade: 0%</div>
    </div>
  </header>

  <div class="nav-bar" id="navTabs">
    <button class="filter-btn active" data-filter="all" type="button">All (161)</button>
    <button class="filter-btn" data-filter="cancer" type="button">Cancer (81)</button>
    <button class="filter-btn" data-filter="msk" type="button">MSK (68)</button>
    <button class="filter-btn" data-filter="readings" type="button">Readings (12)</button>
    <button class="reset-btn" id="resetBtn" type="button">Reset</button>
  </div>

  <main id="questionsContainer"></main>

  <script>
    const questionBank = [{"id":"C01","area":"cancer","type":"mcq","prompt":"A biopsy identifies a new, uncontrolled cell growth. It is well circumscribed, remains localized, and has not invaded neighbouring tissue. Which conclusion is most accurate?","options":[{"text":"It is a neoplasm, but the findings do not establish that it is cancer","correct":true},{"text":"It is necessarily a malignant neoplasm because it is a new growth","correct":false},{"text":"It is metastatic because it is a mass","correct":false},{"text":"It is carcinoma in situ regardless of the tissue of origin","correct":false},{"text":"It is dysplasia rather than a neoplasm","correct":false}],"explanation":"Neoplasia means new uncontrolled growth and may be benign or malignant. Cancer refers specifically to malignant neoplasia.","thinking":false},{"id":"C02","area":"cancer","type":"mcq","prompt":"A cervical specimen contains malignant epithelial cells, but the basement membrane remains intact and the abnormal cells are confined to the epithelium. How should this lesion be described?","options":[{"text":"Carcinoma in situ","correct":true},{"text":"A stage IV metastatic carcinoma","correct":false},{"text":"A benign adenoma","correct":false},{"text":"A malignant mesenchymal sarcoma","correct":false},{"text":"A tumour that has already invaded the stroma","correct":false}],"explanation":"In situ means the abnormal epithelial growth has not penetrated the basement membrane; it remains in its original location.","thinking":false},{"id":"C03","area":"cancer","type":"mcq","prompt":"A benign tumour grows slowly in a confined intracranial space. Although it does not metastasize, it causes worsening neurological function. What best explains this effect?","options":[{"text":"Compression of adjacent vital tissue or blood vessels","correct":true},{"text":"Lymphatic spread to distant organs","correct":false},{"text":"Secretion of collagenase through the basement membrane","correct":false},{"text":"Hematologic dissemination to the lungs","correct":false},{"text":"Acquisition of organ tropism","correct":false}],"explanation":"Benign tumours can still be clinically dangerous when their location allows compression or obstruction of vital tissues or vessels.","thinking":false},{"id":"C04","area":"cancer","type":"mcq","prompt":"Tumour A is slow-growing, well differentiated, encapsulated, and localized. Tumour B is poorly differentiated, has ill-defined borders, invades nearby tissue, and has distant deposits. Which interpretation is correct?","options":[{"text":"X is benign; Y is malignant","correct":true},{"text":"X is malignant; Y is benign","correct":false},{"text":"Both are benign because both are neoplasms","correct":false},{"text":"Both are malignant because both have abnormal growth","correct":false},{"text":"X is carcinoma in situ; Y is dysplasia","correct":false}],"explanation":"Benign tumours are generally well differentiated, encapsulated, slow-growing, and localized. Malignant tumours may be poorly differentiated, invasive, and capable of metastasis.","thinking":true},{"id":"C05","area":"cancer","type":"mcq","prompt":"A rapidly growing malignant tumour develops central necrosis and bleeding. What best explains these changes?","options":[{"text":"Rapidly proliferating cells outgrow the blood supply reaching the tumour core","correct":true},{"text":"The tumour has become encapsulated and prevents all lymphatic drainage","correct":false},{"text":"The cells have stopped dividing through density-dependent inhibition","correct":false},{"text":"The tumour has increased differentiation and reduced metabolic demand","correct":false},{"text":"The tumour is producing excess normal tissue rather than new vessels","correct":false}],"explanation":"Rapidly growing malignant cells can outgrow their blood supply. The resulting lack of oxygen and nutrients can produce central necrosis and hemorrhage.","thinking":true},{"id":"C06","area":"cancer","type":"mcq","prompt":"A biopsy shows that tumour cells have lost the structural and functional resemblance to the tissue from which they arose. Which term describes this loss of differentiation?","options":[{"text":"Anaplasia","correct":true},{"text":"Dysplasia","correct":false},{"text":"Metaplasia","correct":false},{"text":"Hyperplasia","correct":false},{"text":"Hematoma","correct":false}],"explanation":"Anaplasia is loss of differentiation; malignant cells no longer resemble the normal cells of their tissue of origin.","thinking":false},{"id":"C07","area":"cancer","type":"mcq","prompt":"Normal epithelial cells stop dividing once they are tightly packed. A tumour continues proliferating in the same crowded conditions. Which cancer-cell characteristic has been lost?","options":[{"text":"Density-dependent inhibition","correct":true},{"text":"Telomerase activity","correct":false},{"text":"Angiogenesis","correct":false},{"text":"Apoptosis","correct":false},{"text":"Organ tropism","correct":false}],"explanation":"Loss of density-dependent inhibition allows cancer cells to keep dividing when crowded, unlike normal cells.","thinking":true},{"id":"C08","area":"cancer","type":"mcq","prompt":"A tumour-cell culture continues dividing even after external growth-factor signals are removed. Which acquired property best accounts for this observation?","options":[{"text":"Growth-factor independence","correct":true},{"text":"Loss of vascular supply","correct":false},{"text":"Increased contact inhibition","correct":false},{"text":"Reduced genetic instability","correct":false},{"text":"Increased cadherin expression","correct":false}],"explanation":"Cancer cells can become independent of external growth factors and ignore normal signals that regulate division.","thinking":true},{"id":"C09","area":"cancer","type":"mcq","prompt":"Malignant cells detach from neighbouring cells and migrate into adjacent tissue. Which molecular change most directly contributes to this behaviour?","options":[{"text":"Loss of cadherins","correct":true},{"text":"Increased telomerase","correct":false},{"text":"Increased VEGF","correct":false},{"text":"Increased p53 activity","correct":false},{"text":"Increased density-dependent inhibition","correct":false}],"explanation":"Cadherins normally act as cell-to-cell connections. Their loss reduces attachment to neighbours and contributes to cancer-cell autonomy and mobility.","thinking":true},{"id":"C10","area":"cancer","type":"mcq","prompt":"A cell detaches from the basement membrane and continues dividing rather than requiring attachment to its normal supporting surface. Which characteristic is being demonstrated?","options":[{"text":"Anchorage independence","correct":true},{"text":"Density-dependent inhibition","correct":false},{"text":"Differentiation","correct":false},{"text":"Apoptosis","correct":false},{"text":"Tumour encapsulation","correct":false}],"explanation":"Anchorage independence means cancer cells can detach from the basement membrane and neighbouring cells yet continue dividing.","thinking":false},{"id":"C11","area":"cancer","type":"mcq","prompt":"A malignant cell line continues dividing far beyond the usual limit for normal cells. Which mechanism best explains this?","options":[{"text":"Telomerase rebuilds telomere caps and supports limitless replication","correct":true},{"text":"VEGF replaces telomeres with new blood vessels","correct":false},{"text":"Collagenase prevents telomere shortening","correct":false},{"text":"Cadherins activate DNA repair after every division","correct":false},{"text":"AMF prevents chromosome replication","correct":false}],"explanation":"Cancer cells can reactivate telomerase, which replaces telomere material and supports limitless replicative potential.","thinking":true},{"id":"C12","area":"cancer","type":"mcq","prompt":"A cell has irreversible DNA damage but does not undergo programmed cell death. Which cancer-cell characteristic does this illustrate?","options":[{"text":"Avoidance of apoptosis","correct":true},{"text":"Angiogenesis","correct":false},{"text":"Density-dependent inhibition","correct":false},{"text":"Differentiation","correct":false},{"text":"Tumour encapsulation","correct":false}],"explanation":"Cancer cells can acquire mutations that let them ignore programmed cell-death signals, avoiding apoptosis.","thinking":false},{"id":"C13","area":"cancer","type":"mcq","prompt":"Several daughter cells within one tumour acquire different mutations over successive divisions. Which underlying characteristic makes this diversification more likely?","options":[{"text":"Genetic instability","correct":true},{"text":"Anchorage dependence","correct":false},{"text":"Normal differentiation","correct":false},{"text":"Reduced replication","correct":false},{"text":"Loss of angiogenesis","correct":false}],"explanation":"Genetic instability allows mutations to accumulate; daughter cells can diverge into different subclones, producing tumour heterogeneity.","thinking":true},{"id":"C14","area":"cancer","type":"mcq","prompt":"A tumour remains very small until it begins recruiting new blood vessels. Which tumour product is most directly associated with this process?","options":[{"text":"Vascular endothelial growth factor (VEGF)","correct":true},{"text":"Autocrine motility factor (AMF)","correct":false},{"text":"Collagenase","correct":false},{"text":"Cadherin","correct":false},{"text":"p53","correct":false}],"explanation":"VEGF promotes angiogenesis by recruiting new blood vessels to support tumour growth.","thinking":false},{"id":"C15","area":"cancer","type":"mcq","prompt":"A malignant cell must cross the collagen-rich extracellular matrix to invade adjacent tissue. Which tumour product is most directly suited to this task?","options":[{"text":"Collagenase","correct":true},{"text":"VEGF","correct":false},{"text":"Telomerase","correct":false},{"text":"Interferon","correct":false},{"text":"Cadherin","correct":false}],"explanation":"Collagenase is a lytic enzyme that digests collagen in the extracellular matrix, allowing direct invasion.","thinking":true},{"id":"C16","area":"cancer","type":"mcq","prompt":"A cancer cell changes its cytoskeleton and moves through surrounding tissue. Which factor is associated with this motility?","options":[{"text":"Autocrine Motility Factor (AMF)","correct":true},{"text":"Vascular endothelial growth factor (VEGF)","correct":false},{"text":"Tumour suppressor p53","correct":false},{"text":"Cadherin","correct":false},{"text":"Telomerase","correct":false}],"explanation":"AMF promotes cytoskeletal changes and physical motility. VEGF instead promotes blood-vessel growth.","thinking":true},{"id":"C17","area":"cancer","type":"mcq","prompt":"Which route is most commonly used for the initial spread of a solid tumour to distant sites?","options":[{"text":"Lymphatic spread","correct":true},{"text":"Seeding through a body cavity","correct":false},{"text":"Hematologic spread through veins","correct":false},{"text":"Direct extension only","correct":false},{"text":"Retrograde nerve conduction","correct":false}],"explanation":"Lymphatic spread is a common route for the initial spread of many solid tumours to distant sites.","thinking":false},{"id":"C18","area":"cancer","type":"mcq","prompt":"During staging surgery, the first lymph node receiving drainage from the primary tumour area is removed for assessment. What is this node called?","options":[{"text":"Sentinel node","correct":true},{"text":"Terminal node","correct":false},{"text":"Primary node","correct":false},{"text":"Metastatic bed","correct":false},{"text":"Hilar node","correct":false}],"explanation":"The sentinel node is the initial lymph node that drains the tumour area and is used to assess lymphatic spread.","thinking":false},{"id":"C19","area":"cancer","type":"mcq","prompt":"A primary tumour in the colon spreads to the liver. Which route explains why the liver is a common first site of metastasis from the gastrointestinal tract?","options":[{"text":"Venous drainage from the gastrointestinal tract reaches the liver through the portal circulation","correct":true},{"text":"Lymph from the colon drains directly into the pulmonary capillaries","correct":false},{"text":"The liver is always the nearest organ to the primary tumour","correct":false},{"text":"Cancer cells travel through a body cavity and seed the liver surface only","correct":false},{"text":"The liver has no immune cells to remove circulating tumour cells","correct":false}],"explanation":"Venous blood from much of the gastrointestinal tract reaches the liver first through the hepatic portal circulation.","thinking":true},{"id":"C20","area":"cancer","type":"mcq","prompt":"A malignant tumour in the leg enters systemic venous blood. Which capillary bed will the tumour cells most likely encounter first?","options":[{"text":"Lungs","correct":true},{"text":"Liver","correct":false},{"text":"Brain","correct":false},{"text":"Kidneys","correct":false},{"text":"Spleen","correct":false}],"explanation":"Tumour cells entering systemic venous blood pass through the right heart to the pulmonary circulation first.","thinking":true},{"id":"C21","area":"cancer","type":"mcq","prompt":"A tumour spreads across the peritoneal cavity, with detached cells moving in cavity fluid and forming secondary deposits on other surfaces. Which pathway is this?","options":[{"text":"Seeding","correct":true},{"text":"Lymphatic spread","correct":false},{"text":"Hematologic spread","correct":false},{"text":"Direct local invasion","correct":false},{"text":"Organ tropism","correct":false}],"explanation":"Seeding is spread through body-cavity fluids, such as the peritoneal cavity.","thinking":true},{"id":"C22","area":"cancer","type":"mcq","prompt":"What term describes the tendency of cancer cells to metastasize to particular organs?","options":[{"text":"Organ tropism","correct":true},{"text":"Anaplasia","correct":false},{"text":"Dysplasia","correct":false},{"text":"Anchorage independence","correct":false},{"text":"Pancytopenia","correct":false}],"explanation":"Organ tropism describes cancer cells preferentially metastasizing to particular organs with favourable environments.","thinking":false},{"id":"C23","area":"cancer","type":"mcq","prompt":"A normal growth-stimulating gene acquires a gain-of-function mutation and drives uncontrolled cell division. What is the mutated gene called?","options":[{"text":"Proto-oncogene","correct":true},{"text":"Tumour suppressor gene","correct":false},{"text":"DNA repair enzyme","correct":false},{"text":"Growth inhibitor","correct":false},{"text":"Oncolytic gene","correct":false}],"explanation":"A proto-oncogene is a normal growth-stimulating gene; its mutated, overactive form is an oncogene.","thinking":false},{"id":"C24","area":"cancer","type":"mcq","prompt":"A tumour contains a mutated Ras gene that continuously stimulates cell division without a growth-factor signal. How many copies of the growth-stimulating gene generally need a gain-of-function mutation for this effect to occur?","options":[{"text":"One","correct":true},{"text":"Two","correct":false},{"text":"Three","correct":false},{"text":"All copies in every cell","correct":false},{"text":"The mutation must occur in both tumour and germ cells","correct":false}],"explanation":"Oncogene activation is a gain-of-function event; a mutation in one copy can be sufficient to promote uncontrolled growth.","thinking":true},{"id":"C25","area":"cancer","type":"mcq","prompt":"A cell has one mutated copy of a tumour suppressor gene, but the other copy remains functional. Why can the cell still retain the gene's protective function?","options":[{"text":"The remaining functional copy can still provide the STOP signal","correct":true},{"text":"Tumour suppressor genes act only when both copies are normal and are immediately silenced by one mutation","correct":false},{"text":"The mutation automatically converts the gene into an oncogene","correct":false},{"text":"One mutation increases p53 production from the damaged copy","correct":false},{"text":"Tumour suppressors require only one active copy to cause uncontrolled growth","correct":false}],"explanation":"Tumour-suppressor genes generally require loss of both functional copies (the two-hit concept) before their protective function is lost.","thinking":true},{"id":"C26","area":"cancer","type":"mcq","prompt":"After DNA damage is detected, which sequence describes the normal protective actions of p53?","options":[{"text":"Stop the cell cycle, initiate DNA repair, and trigger apoptosis if damage is irreversible","correct":true},{"text":"Promote angiogenesis, activate telomerase, and stimulate motility","correct":false},{"text":"Increase growth-factor signalling, suppress repair, and prevent apoptosis","correct":false},{"text":"Digest collagen, detach from neighbours, and enter the lymphatic system","correct":false},{"text":"Promote cell division first, then reduce DNA repair","correct":false}],"explanation":"The p53 protein can halt the cell cycle, initiate DNA repair, and initiate apoptosis if the damage cannot be repaired.","thinking":true},{"id":"C27","area":"cancer","type":"mcq","prompt":"A person inherits one mutated copy of BRCA1, a tumour-suppressor gene associated with breast and ovarian cancer risk. Why does this not necessarily mean a tumour has already formed?","options":[{"text":"The remaining functional copy can still provide tumour-suppressor activity until it is also lost","correct":true},{"text":"BRCA1 is a proto-oncogene that requires three activating mutations","correct":false},{"text":"Inherited mutations cannot affect cancer risk","correct":false},{"text":"The mutation affects only mature red blood cells","correct":false},{"text":"The mutation automatically creates a benign tumour that cannot progress","correct":false}],"explanation":"BRCA1 is a tumour-suppressor gene. The remaining normal copy may continue to function until it is also inactivated.","thinking":true},{"id":"C28","area":"cancer","type":"mcq","prompt":"A tumour biopsy taken several months after the first biopsy shows several genetically distinct subclones. Which explanation best accounts for the difference?","options":[{"text":"Genetic instability has allowed daughter cells to acquire different mutations over time","correct":true},{"text":"All tumour cells must remain genetically identical after the first mutation","correct":false},{"text":"The tumour has become benign and regained differentiation","correct":false},{"text":"The cells have entered normal apoptosis and been replaced by stromal cells","correct":false},{"text":"The sentinel node has changed the tumour's original tissue type","correct":false}],"explanation":"Tumour heterogeneity develops as genetically unstable daughter cells acquire different mutations during repeated divisions.","thinking":true},{"id":"C29","area":"cancer","type":"mcq","prompt":"A malignant tumour arises from glandular epithelial tissue. Which name best follows the tissue-prefix and malignant epithelial-suffix rules?","options":[{"text":"Adenocarcinoma","correct":true},{"text":"Adenoma","correct":false},{"text":"Fibrosarcoma","correct":false},{"text":"Chondroma","correct":false},{"text":"Leiomyoma","correct":false}],"explanation":"Adeno- refers to glandular or ductal tissue, and -carcinoma denotes malignant epithelial tumours.","thinking":false},{"id":"C30","area":"cancer","type":"mcq","prompt":"A pathologist identifies a malignant tumour arising from adipose tissue. Which tissue prefix and suffix combination is appropriate?","options":[{"text":"Lipo- with -sarcoma","correct":true},{"text":"Adeno- with -carcinoma","correct":false},{"text":"Osteo- with -oma","correct":false},{"text":"Chondro- with -carcinoma","correct":false},{"text":"Leiomyo- with -oma","correct":false}],"explanation":"Lipo- refers to fat, and malignant mesenchymal/connective-tissue tumours use the -sarcoma suffix.","thinking":false},{"id":"C31","area":"cancer","type":"mcq","prompt":"A malignant tumour originates in cartilage. Which name correctly identifies both its tissue of origin and malignant behaviour?","options":[{"text":"Chondrosarcoma","correct":true},{"text":"Chondroma","correct":false},{"text":"Osteosarcoma","correct":false},{"text":"Fibroma","correct":false},{"text":"Adenocarcinoma","correct":false}],"explanation":"Chondro- means cartilage; -sarcoma indicates a malignant mesenchymal tumour.","thinking":false},{"id":"C32","area":"cancer","type":"mcq","prompt":"Which name is appropriate for a benign tumour arising from uterine smooth muscle?","options":[{"text":"Leiomyoma","correct":true},{"text":"Rhabdomyosarcoma","correct":false},{"text":"Leiomyosarcoma","correct":false},{"text":"Neuroblastoma","correct":false},{"text":"Adenoma","correct":false}],"explanation":"Leiomyo- refers to smooth muscle, and -oma usually indicates a benign tumour.","thinking":false},{"id":"C33","area":"cancer","type":"mcq","prompt":"A malignant tumour originates from skeletal muscle. Which name is correct?","options":[{"text":"Rhabdomyosarcoma","correct":true},{"text":"Leiomyoma","correct":false},{"text":"Rhabdomyoma","correct":false},{"text":"Fibrosarcoma","correct":false},{"text":"Meningioma","correct":false}],"explanation":"Rhabdomyo- refers to skeletal or cardiac muscle; -sarcoma identifies a malignant mesenchymal tumour.","thinking":false},{"id":"C34","area":"cancer","type":"mcq","prompt":"Melanoma is sometimes mistaken for a benign tumour because its name ends in “-oma.” Why is that interpretation incorrect?","options":[{"text":"Melanoma is a classic malignant exception to the usual -oma rule","correct":true},{"text":"All -oma tumours are benign without exception","correct":false},{"text":"Melanoma is a collection of blood rather than a neoplasm","correct":false},{"text":"Melanoma is a benign glandular tumour","correct":false},{"text":"Melanoma is a malignant epithelial tumour and must be called adenocarcinoma","correct":false}],"explanation":"Melanoma, lymphoma, and leukemia are named exceptions that are malignant despite ending in -oma.","thinking":false},{"id":"C35","area":"cancer","type":"mcq","prompt":"A mass is composed of blood collected outside the circulatory system after trauma. Which statement best distinguishes it from a neoplasm?","options":[{"text":"It is a hematoma, which is a blood collection and not a neoplasm","correct":true},{"text":"It is a lymphoma because it contains blood cells","correct":false},{"text":"It is a melanoma because it forms a mass","correct":false},{"text":"It is an adenoma because it is circumscribed","correct":false},{"text":"It is a sarcoma because it follows trauma","correct":false}],"explanation":"A hematoma is a collection of blood outside the circulatory system. It is not a neoplasm.","thinking":true},{"id":"C36","area":"cancer","type":"mcq","prompt":"Which naming pattern is used for a malignant neural tumour arising from immature precursor cells?","options":[{"text":"Neuroblastoma","correct":true},{"text":"Neuroma","correct":false},{"text":"Meningioma","correct":false},{"text":"Glioma","correct":false},{"text":"Neurilemmoma","correct":false}],"explanation":"The suffix “-blastoma” is used for malignant tumours arising from immature precursor cells; neuroblastoma is one example.","thinking":false},{"id":"C37","area":"cancer","type":"mcq","prompt":"What is the name of a benign tumour derived from Schwann cells of a peripheral nerve sheath?","options":[{"text":"Neurilemmoma","correct":true},{"text":"Neurilemmal sarcoma","correct":false},{"text":"Glioblastoma","correct":false},{"text":"Neuroblastoma","correct":false},{"text":"Meningeal sarcoma","correct":false}],"explanation":"Neurilemmoma is the benign peripheral nerve-sheath tumour derived from Schwann cells.","thinking":false},{"id":"C38","area":"cancer","type":"mcq","prompt":"What term describes a benign growth arising from squamous epithelial surfaces?","options":[{"text":"Squamous papilloma","correct":true},{"text":"Squamous cell carcinoma","correct":false},{"text":"Melanoma","correct":false},{"text":"Fibrosarcoma","correct":false},{"text":"Adenocarcinoma","correct":false}],"explanation":"A squamous papilloma is a benign squamous epithelial growth; squamous cell carcinoma is malignant.","thinking":false},{"id":"C39","area":"cancer","type":"mcq","prompt":"A histology report describes a malignant epithelial tumour that has not yet crossed the basement membrane. Which term is most precise?","options":[{"text":"Carcinoma in situ","correct":true},{"text":"Adenoma","correct":false},{"text":"Lipoma","correct":false},{"text":"Fibroma","correct":false},{"text":"Metastatic sarcoma","correct":false}],"explanation":"Carcinoma in situ is malignant epithelial growth that remains confined above an intact basement membrane.","thinking":false},{"id":"C40","area":"cancer","type":"mcq","prompt":"A tumour originates in bone and is malignant. Which name follows the tissue prefix and mesenchymal suffix rules?","options":[{"text":"Osteosarcoma","correct":true},{"text":"Osteoma","correct":false},{"text":"Chondrosarcoma","correct":false},{"text":"Adenocarcinoma","correct":false},{"text":"Leiomyoma","correct":false}],"explanation":"Osteo- refers to bone; -sarcoma is used for malignant mesenchymal tumours.","thinking":false},{"id":"C41","area":"cancer","type":"mcq","prompt":"A person has hundreds of colonic polyps and a strong inherited risk of colorectal cancer. Which gene-condition relationship best explains this finding?","options":[{"text":"An inherited APC tumour-suppressor mutation causing familial adenomatous polyposis (FAP)","correct":true},{"text":"A Ras proto-oncogene mutation causing a benign polyp syndrome","correct":false},{"text":"An HPV infection causing inherited colon polyps","correct":false},{"text":"A BRCA1 mutation causing isolated gastric mucus loss","correct":false},{"text":"An H. pylori infection causing a congenital tumour-suppressor defect","correct":false}],"explanation":"An inherited APC tumour-suppressor mutation causes FAP, characterized by hundreds of colon polyps that can become malignant.","thinking":true},{"id":"C42","area":"cancer","type":"mcq","prompt":"In familial adenomatous polyposis (FAP), approximately what proportion of affected people develop colon cancer by age 40 and by age 70?","options":[{"text":"About 50% develop colon cancer by age 40 and the guide notes 100% by age 70","correct":true},{"text":"About 10% develop cancer by age 70 and none before age 40","correct":false},{"text":"The risk falls to zero after age 40","correct":false},{"text":"All polyps are already malignant at birth","correct":false},{"text":"Cancer develops only after exposure to cigarette smoke","correct":false}],"explanation":"The stated FAP risk estimates are approximately 50% for colon cancer by age 40 and 100% by age 70.","thinking":false},{"id":"C43","area":"cancer","type":"mcq","prompt":"A population study finds that cancer rates among Japanese people who migrated to Brazil came to resemble the rates in which population?","options":[{"text":"Brazilians, supporting a strong environmental influence","correct":true},{"text":"Native Japanese, proving cancer rates are entirely inherited","correct":false},{"text":"Neither population, proving cancer is unrelated to environment","correct":false},{"text":"Only the immigrants' children, proving mutations are never inherited","correct":false},{"text":"The rate of a single virus-associated cancer only","correct":false}],"explanation":"The Japanese immigrant study note says first-generation immigrants in Brazil showed rates closer to Brazilians, supporting an important environmental effect.","thinking":true},{"id":"C44","area":"cancer","type":"mcq","prompt":"A chemical has no carcinogenic effect until enzymes in the body convert it into a toxic form. What type of carcinogen is it?","options":[{"text":"Indirect-reactive agent (procarcinogen)","correct":true},{"text":"Direct-reactive carcinogen","correct":false},{"text":"Tumour suppressor","correct":false},{"text":"Angiogenic factor","correct":false},{"text":"Oncogene inhibitor","correct":false}],"explanation":"Indirect-reactive agents, or procarcinogens, require metabolic conversion before becoming carcinogenic.","thinking":true},{"id":"C45","area":"cancer","type":"mcq","prompt":"Chemical carcinogenesis is often dose-dependent and delayed. What is the typical interval between exposure and the development of cancer?","options":[{"text":"Cancer may emerge after a delay of roughly 5-30 years","correct":true},{"text":"Cancer must appear within minutes of the first exposure","correct":false},{"text":"Cancer appears only if exposure occurs after age 70","correct":false},{"text":"Cancer cannot occur if the exposure is intermittent","correct":false},{"text":"Cancer appears only when the exposure causes an immediate burn","correct":false}],"explanation":"Chemical carcinogenesis is dose-dependent and often has a long latency period, commonly about 5–30 years after exposure.","thinking":false},{"id":"C46","area":"cancer","type":"mcq","prompt":"Which statement correctly compares the carcinogenic effects of cigarette smoke and ultraviolet (UV) radiation?","options":[{"text":"Cigarette smoke contains many procarcinogens, while UV exposure is superficial and particularly affects skin","correct":true},{"text":"Cigarette smoke is a direct benign tumour suppressor, while UV affects only bone marrow","correct":false},{"text":"UV penetrates deeply and primarily causes gastrointestinal cancers","correct":false},{"text":"Cigarette smoke only affects laryngeal tissue and has no other associations","correct":false},{"text":"Both exposures cause cancer immediately without DNA damage","correct":false}],"explanation":"Cigarette smoke contains multiple procarcinogens. UV radiation can produce free radicals and DNA damage, with effects most evident in exposed skin.","thinking":true},{"id":"C47","area":"cancer","type":"mcq","prompt":"How can a persistent infection increase cancer risk even when viral DNA does not directly insert into a cell-growth control gene?","options":[{"text":"Repeated tissue injury, cell death, and regeneration create more opportunities for mutations","correct":true},{"text":"The infection permanently stops all cell division in the affected tissue","correct":false},{"text":"Chronic infection eliminates every damaged cell before it can divide","correct":false},{"text":"The infection prevents free-radical formation","correct":false},{"text":"The infection causes all infected cells to become benign","correct":false}],"explanation":"Chronic infection can indirectly predispose to cancer by causing continual tissue damage and repair, increasing cell replication and opportunities for mistakes.","thinking":true},{"id":"C48","area":"cancer","type":"mcq","prompt":"Which cancer is strongly associated with chronic hepatitis B virus (HBV) infection?","options":[{"text":"HBV is associated with about 60% of primary liver cancers and can integrate into host DNA","correct":true},{"text":"HBV is associated with more than 90% of cervical cancers and is usually spread by contaminated food","correct":false},{"text":"HBV primarily causes skin papillomas and does not involve hepatocytes","correct":false},{"text":"HBV is a bacterial infection that causes gastric mucus loss","correct":false},{"text":"HBV causes bone sarcoma through urate deposition","correct":false}],"explanation":"HBV is associated with primary liver cancer. Transmission occurs through blood and bodily fluids, and chronic infection can contribute to liver injury and cancer development.","thinking":true},{"id":"C49","area":"cancer","type":"mcq","prompt":"Which cancers are associated with human papillomavirus (HPV) infection?","options":[{"text":"HPV is usually sexually transmitted and is linked to more than 90% of cervical and anal cancers","correct":true},{"text":"HPV is mainly spread by blood transfusion and causes most primary liver cancers","correct":false},{"text":"HPV is a bacterium that causes stomach cancer by disrupting mucus","correct":false},{"text":"HPV causes cancer only by producing a pleural effusion","correct":false},{"text":"HPV is unrelated to epithelial tissue","correct":false}],"explanation":"HPV is usually transmitted sexually and is associated with most cervical and anal cancers, as well as many vaginal, vulvar, and penile cancers.","thinking":false},{"id":"C50","area":"cancer","type":"mcq","prompt":"How can chronic Helicobacter pylori infection increase the risk of gastric cancer?","options":[{"text":"Disruption of protective gastric mucus can promote autodigestion and chronic tissue injury/regeneration","correct":true},{"text":"Integration into hepatocyte DNA directly causes primary liver cancer","correct":false},{"text":"It increases estrogen receptors in breast tissue","correct":false},{"text":"It causes urate crystals to form in the synovial membrane","correct":false},{"text":"It suppresses all gastric cell turnover","correct":false}],"explanation":"H. pylori can disrupt gastric mucus, weakening protection from stomach acid; chronic infection and repeated repair increase gastric cancer risk.","thinking":true},{"id":"C51","area":"cancer","type":"mcq","prompt":"What is the approximate proportion of human cancers linked to viral causes?","options":[{"text":"15%","correct":true},{"text":"2%","correct":false},{"text":"5%","correct":false},{"text":"40%","correct":false},{"text":"85%","correct":false}],"explanation":"Viruses are linked to approximately 15% of human cancers.","thinking":false},{"id":"C52","area":"cancer","type":"mcq","prompt":"Why can early-stage cancer remain asymptomatic?","options":[{"text":"The tumour may not yet have produced a significant functional impact despite containing more cells than normal","correct":true},{"text":"Early cancers are always completely harmless and cannot progress","correct":false},{"text":"Pain must be absent because cancer cells cannot invade tissue","correct":false},{"text":"Symptoms occur only after chemotherapy begins","correct":false},{"text":"The absence of symptoms proves the tumour is benign","correct":false}],"explanation":"Early cancer may remain asymptomatic because the increased number of cells has not yet caused a noticeable effect on the function of the affected tissue or organ.","thinking":true},{"id":"C53","area":"cancer","type":"mcq","prompt":"Which cancer-related symptom is characterized by profound tiredness that is not relieved by rest?","options":[{"text":"Cancer-related fatigue","correct":true},{"text":"Cachexia alone","correct":false},{"text":"Pleural effusion","correct":false},{"text":"Leukocytosis","correct":false},{"text":"Tumour heterogeneity","correct":false}],"explanation":"Fatigue is identified as the most common cancer symptom and differs from ordinary tiredness because sleep does not reliably relieve it.","thinking":false},{"id":"C54","area":"cancer","type":"mcq","prompt":"Progressive loss of muscle and fat, weakness, anorexia, and early satiety in a person with cancer are characteristic of which condition?","options":[{"text":"Cachexia can occur despite normal or increased intake because protein synthesis and metabolism are altered","correct":true},{"text":"The findings exclude cachexia because food intake has not fallen","correct":false},{"text":"The patient has isolated thrombocytopenia","correct":false},{"text":"The findings demonstrate a benign tumour capsule","correct":false},{"text":"The patient has only a local tumour effect with no systemic consequences","correct":false}],"explanation":"Cachexia is severe wasting. Altered metabolism and reduced protein synthesis can cause loss of muscle and fat even when food intake is unchanged or increased.","thinking":true},{"id":"C55","area":"cancer","type":"mcq","prompt":"A breast tumour near the pleura is associated with fluid accumulating in the pleural space. Which local cancer effect does this represent?","options":[{"text":"A tumour-associated effusion","correct":true},{"text":"A paraneoplastic syndrome caused by PTH","correct":false},{"text":"Cachexia","correct":false},{"text":"A sentinel-node reaction","correct":false},{"text":"A chemotherapy-induced pancytopenia","correct":false}],"explanation":"Tumours near serous membranes can cause symptomatic effusions; lung and breast cancers are noted causes of pleural effusions.","thinking":true},{"id":"C56","area":"cancer","type":"mcq","prompt":"A reduction in red blood cells, white blood cells, and platelets after cytotoxic treatment is called what?","options":[{"text":"Pancytopenia","correct":true},{"text":"Leukocytosis","correct":false},{"text":"Polycythemia","correct":false},{"text":"Thrombocytosis","correct":false},{"text":"Rouleaux formation","correct":false}],"explanation":"Pancytopenia is a reduction in red blood cells, white blood cells, and platelets. Cytotoxic chemotherapy can suppress bone marrow and cause this combined deficit.","thinking":false},{"id":"C57","area":"cancer","type":"mcq","prompt":"A tumour produces an abnormal hormone-like product that causes a systemic manifestation unrelated to direct compression by the tumour mass. Which category best describes this?","options":[{"text":"Paraneoplastic syndrome","correct":true},{"text":"Direct local invasion","correct":false},{"text":"Pleural effusion","correct":false},{"text":"Cachexia","correct":false},{"text":"In situ neoplasia","correct":false}],"explanation":"Paraneoplastic syndromes result when tumour cells produce hormones or other products not normally produced by that tissue.","thinking":true},{"id":"C58","area":"cancer","type":"mcq","prompt":"A lung tumour produces antidiuretic hormone (ADH). Which paraneoplastic syndrome can result?","options":[{"text":"ADH leading to SIADH","correct":true},{"text":"ACTH leading to hypercalcemia","correct":false},{"text":"PTH leading to Cushing syndrome","correct":false},{"text":"Procoagulants leading to cachexia","correct":false},{"text":"VEGF leading to thrombocytopenia","correct":false}],"explanation":"Tumour-derived ADH can cause syndrome of inappropriate antidiuretic hormone secretion (SIADH).","thinking":false},{"id":"C59","area":"cancer","type":"mcq","prompt":"A tumour produces adrenocorticotropic hormone (ACTH). Which paraneoplastic syndrome can result?","options":[{"text":"Cushing syndrome","correct":true},{"text":"SIADH","correct":false},{"text":"Hypercalcemia","correct":false},{"text":"Venous thrombosis","correct":false},{"text":"Pleural effusion","correct":false}],"explanation":"Ectopic ACTH production can cause Cushing syndrome.","thinking":false},{"id":"C60","area":"cancer","type":"mcq","prompt":"A tumour causes hypercalcemia without directly destroying bone. Which hormone-like product can explain this effect?","options":[{"text":"PTH","correct":true},{"text":"ADH","correct":false},{"text":"ACTH","correct":false},{"text":"VEGF","correct":false},{"text":"AMF","correct":false}],"explanation":"Tumour-derived parathyroid hormone-related activity can produce hypercalcemia without direct bone destruction.","thinking":false},{"id":"C61","area":"cancer","type":"mcq","prompt":"A person with cancer develops an unexplained venous thrombosis. Which tumour product can contribute to this complication?","options":[{"text":"Procoagulants","correct":true},{"text":"Interferons","correct":false},{"text":"Cadherins","correct":false},{"text":"Telomerase","correct":false},{"text":"Collagenase","correct":false}],"explanation":"Tumour-produced procoagulants can promote venous thrombosis as a paraneoplastic manifestation.","thinking":false},{"id":"C62","area":"cancer","type":"mcq","prompt":"Screening an asymptomatic person to detect cancer before symptoms develop is which level of prevention?","options":[{"text":"Secondary prevention","correct":true},{"text":"Primary prevention","correct":false},{"text":"Tertiary prevention","correct":false},{"text":"Palliative treatment","correct":false},{"text":"Rehabilitation","correct":false}],"explanation":"Secondary prevention aims to identify cancer in people who do not yet have symptoms through screening.","thinking":false},{"id":"C63","area":"cancer","type":"mcq","prompt":"Why can an elevated tumour-marker result not establish a cancer diagnosis on its own?","options":[{"text":"Tumour markers may be elevated for non-cancerous reasons and there is no universal marker","correct":true},{"text":"Every tumour marker is specific to every cancer","correct":false},{"text":"Tumour markers are always elevated before any cancer develops","correct":false},{"text":"A normal marker proves there is no cancer","correct":false},{"text":"Tumour markers directly reveal the tumour's histological grade","correct":false}],"explanation":"Tumour markers can be raised in non-cancerous conditions, may be absent in cancer, and are usually specific to only one or a few cancers.","thinking":false},{"id":"C64","area":"cancer","type":"mcq","prompt":"Imaging and laboratory tests suggest a tumour, but a definitive diagnosis is needed. Which procedure provides tissue for confirmation?","options":[{"text":"Retrieve cells or tissue by biopsy and examine them microscopically","correct":true},{"text":"Rely on a single tumour-marker result","correct":false},{"text":"Assign a grade from the tumour's size alone","correct":false},{"text":"Use the TNM stage as a substitute for tissue diagnosis","correct":false},{"text":"Begin chemotherapy before obtaining any cells","correct":false}],"explanation":"The definitive approach described is biopsy/retrieval of cells or tissue followed by microscopic identification.","thinking":false},{"id":"C65","area":"cancer","type":"mcq","prompt":"Exfoliated cells collected from cervical secretions, nipple drainage, or pleural fluid are examined under a microscope. Which diagnostic method is being used?","options":[{"text":"Papanicolaou (Pap) test","correct":true},{"text":"Immunohistochemistry","correct":false},{"text":"Bone mineral density testing","correct":false},{"text":"Sentinel-node mapping","correct":false},{"text":"Linear-accelerator imaging","correct":false}],"explanation":"The Pap test is a cytologic examination of exfoliated cells. Cytology can also be performed on cells collected from other body secretions and fluids.","thinking":false},{"id":"C66","area":"cancer","type":"mcq","prompt":"A lung mass contains malignant cells, but routine microscopy cannot determine whether they originated in the lung or metastasized from another organ. Which method can help identify the primary site?","options":[{"text":"Immunohistochemistry using antibodies to cell products or surface markers","correct":true},{"text":"A tumour-marker blood test alone","correct":false},{"text":"A Pap test of unrelated cervical secretions","correct":false},{"text":"A bone mineral density measurement","correct":false},{"text":"A simple measurement of tumour diameter","correct":false}],"explanation":"Immunohistochemistry uses antibodies to identify products or surface markers and can help determine the origin of malignant cells.","thinking":false},{"id":"C67","area":"cancer","type":"mcq","prompt":"A breast tumour shows abundant HER2 expression. Which targeted treatment is associated with this finding?","options":[{"text":"Trastuzumab","correct":true},{"text":"Zoladex","correct":false},{"text":"Erythropoietin","correct":false},{"text":"A bisphosphonate","correct":false},{"text":"A hematopoietic growth factor","correct":false}],"explanation":"Trastuzumab is described as a HER2 inhibitor and is relevant only when the tumour over-expresses HER2.","thinking":false},{"id":"C68","area":"cancer","type":"mcq","prompt":"A tumour is assessed by its primary size or local extent, regional lymph-node involvement, and distant metastasis. Which staging framework is being used?","options":[{"text":"TNM staging","correct":true},{"text":"Histological grading","correct":false},{"text":"The two-hit hypothesis","correct":false},{"text":"The cell-cycle growth fraction","correct":false},{"text":"The therapeutic index","correct":false}],"explanation":"TNM records tumour size/local extent (T), nodes (N), and distant metastases (M).","thinking":false},{"id":"C69","area":"cancer","type":"mcq","prompt":"A tumour remains present in its primary organ and has spread to distant sites. Which stage category best fits?","options":[{"text":"Stage IV","correct":true},{"text":"Stage 0","correct":false},{"text":"Stage I","correct":false},{"text":"Stage II","correct":false},{"text":"Stage III","correct":false}],"explanation":"Stage IV indicates spread through blood or lymphatic systems to a distant site.","thinking":false},{"id":"C70","area":"cancer","type":"mcq","prompt":"Why is cancer stage often more predictive of survival than histological grade?","options":[{"text":"Stage describes how far cancer has spread; grade describes how abnormal/aggressive the cells look","correct":true},{"text":"Stage describes cell appearance; grade describes distant metastasis","correct":false},{"text":"Both describe only the tumour's diameter","correct":false},{"text":"Grade uses TNM; stage uses only the number of mitoses","correct":false},{"text":"Stage and grade are interchangeable terms","correct":false}],"explanation":"Stage measures spread and is identified as the biggest predictor of survival; grade reflects differentiation and mitotic activity.","thinking":false},{"id":"C71","area":"cancer","type":"mcq","prompt":"A tumour contains highly pleomorphic cells with poor differentiation and numerous proliferating cells. Which histological grade pattern is most consistent?","options":[{"text":"High grade, more aggressive disease","correct":true},{"text":"Low grade, highly differentiated disease","correct":false},{"text":"Stage 0 in situ by definition","correct":false},{"text":"Benign encapsulated growth","correct":false},{"text":"A non-neoplastic hematoma","correct":false}],"explanation":"High-grade tumours are poorly differentiated/anaplastic, pleomorphic and more aggressive; grades range from 1 to 4.","thinking":false},{"id":"C72","area":"cancer","type":"mcq","prompt":"Approximately how many cancer cells must be present before a tumour is generally detectable by clinical methods?","options":[{"text":"1 billion cells (10^9)","correct":true},{"text":"100 cells","correct":false},{"text":"10,000 cells","correct":false},{"text":"1 million cells","correct":false},{"text":"1 trillion cells","correct":false}],"explanation":"A tumour is generally detectable clinically at approximately 1 billion cells; a burden of about 1 trillion cells is generally lethal.","thinking":false},{"id":"C73","area":"cancer","type":"mcq","prompt":"Under what conditions can surgery alone potentially cure a solid tumour?","options":[{"text":"The tumour is locally contained, has not metastasized, and can be removed with a large margin","correct":true},{"text":"The tumour has distant metastases but produces no pain","correct":false},{"text":"The tumour is high grade and cannot be completely removed","correct":false},{"text":"The tumour is detectable only by a tumour marker","correct":false},{"text":"The patient has completed one chemotherapy course","correct":false}],"explanation":"Surgery can be curative for solid cancers when the tumour is locally contained, has not metastasized, and a large margin is removed.","thinking":false},{"id":"C74","area":"cancer","type":"mcq","prompt":"A bulky tumour is surgically reduced to improve the effectiveness of other treatments. What is this surgical purpose called?","options":[{"text":"De-bulking surgery","correct":true},{"text":"Palliative surgery for symptom relief only","correct":false},{"text":"Preventive surgery","correct":false},{"text":"Reconstructive surgery","correct":false},{"text":"Emergency surgery for perforation","correct":false}],"explanation":"De-bulking removes as much tumour as possible to increase the likelihood that alternate therapies will work; palliation is for symptom relief.","thinking":false},{"id":"C75","area":"cancer","type":"mcq","prompt":"Why are combinations of cytotoxic drugs often used in cancer treatment, and what is a major limitation of chemotherapy?","options":[{"text":"Chemotherapy is systemic; combining agents can reduce resistance and permit smaller doses, but the therapeutic index is fairly low","correct":true},{"text":"Chemotherapy is local only and selectively kills cells that are not dividing","correct":false},{"text":"Combination treatment guarantees eradication after one dose and has no effect on normal tissue","correct":false},{"text":"Chemotherapy works only by blocking estrogen receptors","correct":false},{"text":"Chemotherapy prevents all later mutations by increasing tumour differentiation","correct":false}],"explanation":"Chemotherapy is systemic and often combined to reduce resistance and allow smaller doses. Its therapeutic index is relatively low because normal cells are also harmed.","thinking":false},{"id":"M01","area":"msk","type":"mcq","prompt":"What is the name of the shaft of a long bone?","options":[{"text":"Diaphysis","correct":true},{"text":"Epiphysis","correct":false},{"text":"Medullary cavity","correct":false},{"text":"Periosteum","correct":false},{"text":"Nutrient foramen","correct":false}],"explanation":"The shaft of a long bone is the diaphysis; the expanded ends are the epiphyses.","thinking":false},{"id":"M02","area":"msk","type":"mcq","prompt":"What structure covers the joint surface at the end of a long bone?","options":[{"text":"Articular cartilage","correct":true},{"text":"Periosteum","correct":false},{"text":"Endosteum","correct":false},{"text":"Compact bone","correct":false},{"text":"Nutrient foramen","correct":false}],"explanation":"The long-bone diagram labels articular cartilage at the ends of the bone where joint surfaces are formed.","thinking":false},{"id":"M04","area":"msk","type":"mcq","prompt":"Which type of bone tissue forms the dense outer component of a long bone?","options":[{"text":"Compact bone","correct":true},{"text":"Articular cartilage","correct":false},{"text":"Synovial membrane","correct":false},{"text":"Fibrocartilaginous callus","correct":false},{"text":"Periosteal exudate","correct":false}],"explanation":"Compact bone is the dense outer bone tissue.","thinking":false},{"id":"M05","area":"msk","type":"mcq","prompt":"What is the process called in which old bone is resorbed and new bone is formed?","options":[{"text":"Ongoing removal and replacement of bone tissue","correct":true},{"text":"Conversion of cartilage directly into synovial fluid","correct":false},{"text":"Replacement of all bone with fibrous tissue after every injury","correct":false},{"text":"Formation of blood cells within articular cartilage","correct":false},{"text":"Loss of all bone turnover after skeletal maturity","correct":false}],"explanation":"Bone remodeling is the continuous process of removing old bone through resorption and forming new bone.","thinking":false},{"id":"M06","area":"msk","type":"mcq","prompt":"Blunt trauma causes bleeding beneath intact skin, producing localized discoloration. Which soft-tissue injury is this?","options":[{"text":"Contusion","correct":true},{"text":"Laceration","correct":false},{"text":"Sprain","correct":false},{"text":"Dislocation","correct":false},{"text":"Subluxation","correct":false}],"explanation":"A contusion is blunt-force trauma in which the overlying skin remains intact while hemorrhage occurs below the surface.","thinking":false},{"id":"M07","area":"msk","type":"mcq","prompt":"A localized collection of blood forms within the tissue after an injury. What is this collection called?","options":[{"text":"Hematoma","correct":true},{"text":"Laceration","correct":false},{"text":"Strain","correct":false},{"text":"Subluxation","correct":false},{"text":"Torus fracture","correct":false}],"explanation":"A hematoma is a collection of blood at a contusion site due to a larger local hemorrhage.","thinking":true},{"id":"M08","area":"msk","type":"mcq","prompt":"Which soft-tissue injury involves a tear in the skin?","options":[{"text":"Laceration","correct":true},{"text":"Contusion","correct":false},{"text":"Hematoma","correct":false},{"text":"Strain","correct":false},{"text":"Sprain","correct":false}],"explanation":"A laceration is a soft-tissue injury in which the skin is torn.","thinking":false},{"id":"M09","area":"msk","type":"mcq","prompt":"An unusual muscle contraction causes pain and stiffness from stretching or tearing of a muscle or tendon. Which injury is most likely?","options":[{"text":"Strain","correct":true},{"text":"Sprain","correct":false},{"text":"Dislocation","correct":false},{"text":"Subluxation","correct":false},{"text":"Contusion","correct":false}],"explanation":"A strain involves stretching of a muscle or tendon, often from unusual contraction or forcible stretching; symptoms may be milder than a sprain.","thinking":true},{"id":"M10","area":"msk","type":"mcq","prompt":"A twisting injury stretches or tears an ankle ligament, causing pain and swelling. Which injury is present?","options":[{"text":"Sprain","correct":true},{"text":"Strain","correct":false},{"text":"Contusion","correct":false},{"text":"Laceration","correct":false},{"text":"Hematoma","correct":false}],"explanation":"A sprain is a stretching injury of a ligament; pain and swelling can take longer to subside than with a strain.","thinking":true},{"id":"M13","area":"msk","type":"mcq","prompt":"After substantial trauma, the articulating surfaces of a joint lose contact completely. What is this injury called?","options":[{"text":"Dislocation","correct":true},{"text":"Subluxation","correct":false},{"text":"Sprain","correct":false},{"text":"Strain","correct":false},{"text":"Contusion","correct":false}],"explanation":"A dislocation is loss of articulation between two bones, with the bone surfaces losing contact entirely.","thinking":true},{"id":"M14","area":"msk","type":"mcq","prompt":"A joint has a partial loss of contact between its articulating surfaces. What is this injury called?","options":[{"text":"Subluxation","correct":true},{"text":"Dislocation","correct":false},{"text":"Sprain","correct":false},{"text":"Strain","correct":false},{"text":"Laceration","correct":false}],"explanation":"A subluxation is a partial loss of contact between joint surfaces, described as a mild or partial dislocation.","thinking":true},{"id":"M15","area":"msk","type":"mcq","prompt":"A break or discontinuity in bone caused by a force that exceeds the bone’s strength is called what?","options":[{"text":"Fracture","correct":true},{"text":"Sprain","correct":false},{"text":"Strain","correct":false},{"text":"Contusion","correct":false},{"text":"Subluxation","correct":false}],"explanation":"A fracture is a break or discontinuity in bone caused by a force that exceeds the bone’s strength.","thinking":false},{"id":"M16","area":"msk","type":"mcq","prompt":"A fracture passes through the shaft and produces exactly two principal fragments without intermediate pieces. Which severity classification best fits?","options":[{"text":"Simple (non-comminuted)","correct":true},{"text":"Comminuted","correct":false},{"text":"Impacted","correct":false},{"text":"Depressed","correct":false},{"text":"Avulsion","correct":false}],"explanation":"A simple fracture is a single linear disruption that delimits two fragments; comminuted fractures have several intermediate fragments.","thinking":true},{"id":"M18","area":"msk","type":"mcq","prompt":"A fracture communicates with an open wound through the skin. How is this fracture classified?","options":[{"text":"Open (compound/communicating)","correct":true},{"text":"Closed (noncommunicating)","correct":false},{"text":"Stable","correct":false},{"text":"Impacted","correct":false},{"text":"Linear","correct":false}],"explanation":"An open fracture has disrupted skin and communicates with the external environment; a closed fracture has intact skin.","thinking":true},{"id":"M19","area":"msk","type":"mcq","prompt":"A fracture line runs at a right angle to the bone's longitudinal axis. Which orientation is present?","options":[{"text":"Transverse","correct":true},{"text":"Oblique","correct":false},{"text":"Linear","correct":false},{"text":"Spiral","correct":false},{"text":"Depressed","correct":false}],"explanation":"A transverse fracture runs perpendicular to the longitudinal axis of the bone.","thinking":false},{"id":"M20","area":"msk","type":"mcq","prompt":"A fracture line crosses the bone diagonally at an angle to its long axis. Which orientation is most accurate?","options":[{"text":"Oblique","correct":true},{"text":"Transverse","correct":false},{"text":"Linear","correct":false},{"text":"Spiral","correct":false},{"text":"Impacted","correct":false}],"explanation":"An oblique fracture runs at an angle to the bone's longitudinal axis.","thinking":false},{"id":"M21","area":"msk","type":"mcq","prompt":"A fracture line follows the length of the bone rather than crossing it. Which orientation does this represent?","options":[{"text":"Linear (longitudinal)","correct":true},{"text":"Transverse","correct":false},{"text":"Oblique","correct":false},{"text":"Spiral","correct":false},{"text":"Depressed","correct":false}],"explanation":"A linear or longitudinal fracture runs along the length of the bone.","thinking":false},{"id":"M22","area":"msk","type":"mcq","prompt":"A twisting force produces a fracture line that winds around the fibula. Which fracture pattern is present?","options":[{"text":"Spiral","correct":true},{"text":"Linear","correct":false},{"text":"Transverse","correct":false},{"text":"Depressed","correct":false},{"text":"Torus","correct":false}],"explanation":"A spiral fracture follows a spiral course around the bone, typically after a twisting force.","thinking":true},{"id":"M25","area":"msk","type":"mcq","prompt":"A radiograph shows two broken bone fragments driven into one another. Which fracture type is present?","options":[{"text":"Impacted","correct":true},{"text":"Depressed","correct":false},{"text":"Displaced","correct":false},{"text":"Greenstick","correct":false},{"text":"Bowing","correct":false}],"explanation":"An impacted fracture is one in which the fragments are driven into each other.","thinking":false},{"id":"M26","area":"msk","type":"mcq","prompt":"A skull fracture has bone fragments pushed inward toward the cranial cavity. Which classification is most precise?","options":[{"text":"Depressed fracture","correct":true},{"text":"Impacted fracture","correct":false},{"text":"Spiral fracture","correct":false},{"text":"Torus fracture","correct":false},{"text":"Avulsion fracture","correct":false}],"explanation":"A depressed fracture has bone fragments driven inward and is commonly associated with the skull.","thinking":false},{"id":"M27","area":"msk","type":"mcq","prompt":"A child sustains a fall and the distal radius cortex buckles at the injury site without a complete break. Which incomplete fracture pattern is most likely?","options":[{"text":"Torus (buckle)","correct":true},{"text":"Greenstick","correct":false},{"text":"Bowing","correct":false},{"text":"Avulsion","correct":false},{"text":"Pott's","correct":false}],"explanation":"A torus fracture is a buckle fracture in which the bone buckles at the fracture site.","thinking":true},{"id":"M28","area":"msk","type":"mcq","prompt":"A child's forearm bone bends after trauma and has associated microfractures, but no complete break is seen. Which incomplete pattern is described?","options":[{"text":"Bowing fracture","correct":true},{"text":"Torus fracture","correct":false},{"text":"Displaced fracture","correct":false},{"text":"Comminuted fracture","correct":false},{"text":"Colles' fracture","correct":false}],"explanation":"A bowing fracture is a bend in the bone with associated microfractures.","thinking":false},{"id":"M29","area":"msk","type":"mcq","prompt":"A child's radiograph shows a crack through one side of the cortex with splintering of the spongy bone. Which pattern is most likely?","options":[{"text":"Greenstick fracture","correct":true},{"text":"Torus fracture","correct":false},{"text":"Bowing fracture","correct":false},{"text":"Impacted fracture","correct":false},{"text":"Depressed fracture","correct":false}],"explanation":"A greenstick fracture is incomplete: one side of the cortex is cracked and spongy bone is splintered; it is common in children.","thinking":true},{"id":"M30","area":"msk","type":"mcq","prompt":"A tendon or ligament is torn away from its attachment and pulls a fragment of bone with it. Which fracture type is this?","options":[{"text":"Avulsion","correct":true},{"text":"Torus","correct":false},{"text":"Bowing","correct":false},{"text":"Simple","correct":false},{"text":"Depressed","correct":false}],"explanation":"An avulsion fracture involves separation of a bone fragment where a tendon or ligament is attached.","thinking":true},{"id":"M31","area":"msk","type":"mcq","prompt":"A post-trauma radiograph shows that the bone fragments are no longer anatomically aligned. Which term should be used?","options":[{"text":"Displaced","correct":true},{"text":"Stable","correct":false},{"text":"Impacted","correct":false},{"text":"Linear","correct":false},{"text":"Incomplete","correct":false}],"explanation":"A displaced fracture has fragments that are not anatomically aligned.","thinking":false},{"id":"M32","area":"msk","type":"mcq","prompt":"A runner develops localized tenderness and swelling after repeated low-impact activity, without one sufficient traumatic event. Symptoms improve when activity stops. Which fracture category best fits?","options":[{"text":"Stress fracture","correct":true},{"text":"Pathologic fracture","correct":false},{"text":"Depressed fracture","correct":false},{"text":"Open fracture","correct":false},{"text":"Dislocation","correct":false}],"explanation":"Stress fractures are usually microfractures from repeated low-impact stress and are painful with localized tenderness/swelling that improves when activity ceases.","thinking":true},{"id":"M33","area":"msk","type":"mcq","prompt":"A recruit starts an unusually intense repetitive training program. Muscle mass and force increase before bone strength adapts, and microfractures develop in otherwise normal bone. Which subtype is this?","options":[{"text":"Fatigue fracture","correct":true},{"text":"Insufficiency fracture","correct":false},{"text":"Pathologic fracture","correct":false},{"text":"Avulsion fracture","correct":false},{"text":"Impacted fracture","correct":false}],"explanation":"A fatigue fracture results from abnormal or repetitive activity acting on otherwise normal bone.","thinking":true},{"id":"M34","area":"msk","type":"mcq","prompt":"A fragility fracture occurs during ordinary activity because the bone has lost strength and remodeling capacity. Which fracture subtype is most consistent?","options":[{"text":"Insufficiency fracture","correct":true},{"text":"Fatigue fracture","correct":false},{"text":"Spiral fracture","correct":false},{"text":"Avulsion fracture","correct":false},{"text":"Torus fracture","correct":false}],"explanation":"An insufficiency fracture occurs when normal activity acts on abnormal, weakened bone.","thinking":true},{"id":"M35","area":"msk","type":"mcq","prompt":"A fracture passes through a pre-existing bone tumour after minimal trauma. What type of fracture is this?","options":[{"text":"Pathologic fracture","correct":true},{"text":"Fatigue fracture","correct":false},{"text":"Simple fracture","correct":false},{"text":"Torus fracture","correct":false},{"text":"Transverse fracture","correct":false}],"explanation":"A pathologic fracture occurs through bone weakened by a pre-existing abnormality or disease, including a tumour.","thinking":true},{"id":"M36","area":"msk","type":"mcq","prompt":"A person falls onto an outstretched hand and sustains a fracture of the distal radius, with possible associated distal ulna involvement. Which named fracture is this?","options":[{"text":"Colles' fracture","correct":true},{"text":"Pott's fracture","correct":false},{"text":"Greenstick fracture","correct":false},{"text":"Avulsion fracture","correct":false},{"text":"Depressed fracture","correct":false}],"explanation":"Colle's fracture involves the distal radius, often with the ulna, classically after a fall onto an outstretched hand.","thinking":false},{"id":"M37","area":"msk","type":"mcq","prompt":"A forceful landing causes fractures of the distal fibula and tibia at the ankle. Which named fracture is most likely?","options":[{"text":"Pott's fracture","correct":true},{"text":"Colles' fracture","correct":false},{"text":"Bowing fracture","correct":false},{"text":"Torus fracture","correct":false},{"text":"Greenstick fracture","correct":false}],"explanation":"Pott's fracture involves the lower fibula and often tibia after excessive force at the ankle.","thinking":false},{"id":"M41","area":"msk","type":"mcq","prompt":"Immediately after a fracture, blood from bone and surrounding soft tissue collects at the site. Which healing stage is occurring?","options":[{"text":"Hematoma formation (procallus)","correct":true},{"text":"Fibrocartilaginous callus formation","correct":false},{"text":"Bony callus formation","correct":false},{"text":"Remodeling","correct":false},{"text":"Union","correct":false}],"explanation":"The first stage is hematoma formation during approximately the first week; the organized granulation tissue becomes the procallus.","thinking":false},{"id":"M42","area":"msk","type":"mcq","prompt":"Two weeks after a fracture, fibroblasts, cartilage, and woven bone bridge the broken fragments. Which healing stage is occurring?","options":[{"text":"Fibrocartilaginous callus formation","correct":true},{"text":"Hematoma formation","correct":false},{"text":"Bony callus formation","correct":false},{"text":"Remodeling","correct":false},{"text":"Malunion","correct":false}],"explanation":"The fibrocartilaginous callus forms during approximately weeks 1-3 and connects fragments, but it is not yet strong enough to bear weight.","thinking":true},{"id":"M43","area":"msk","type":"mcq","prompt":"Several weeks after a fracture, the fibrocartilaginous tissue begins to ossify and forms a bony sheath that eventually becomes spongy bone. Which stage is occurring?","options":[{"text":"Bony callus formation","correct":true},{"text":"Hematoma formation","correct":false},{"text":"Fibrocartilaginous callus formation","correct":false},{"text":"Remodeling","correct":false},{"text":"Nonunion","correct":false}],"explanation":"Bony callus formation begins around week 3+ as fibrocartilaginous tissue ossifies and becomes spongy bone.","thinking":false},{"id":"M44","area":"msk","type":"mcq","prompt":"Months after a fracture, the temporary spongy bone is being replaced by compact bone and excess material is removed. Which healing phase is underway?","options":[{"text":"Remodeling","correct":true},{"text":"Hematoma formation","correct":false},{"text":"Fibrocartilaginous callus formation","correct":false},{"text":"Bony callus formation","correct":false},{"text":"Delayed union","correct":false}],"explanation":"During remodeling, compact bone replaces spongy bone and excess material is removed; this can continue for months to years.","thinking":false},{"id":"M45","area":"msk","type":"mcq","prompt":"A displaced fracture is treated so the bone ends are realigned, then held still with a cast. Which two treatment principles are being used?","options":[{"text":"Reduction and immobilization","correct":true},{"text":"Traction and seeding","correct":false},{"text":"Debulking and palliation","correct":false},{"text":"Opsonization and phagocytosis","correct":false},{"text":"Osteolysis and ankylosis","correct":false}],"explanation":"Reduction realigns the bone fragments. Immobilization maintains that alignment with a splint, cast, traction, or fixation.","thinking":true},{"id":"M46","area":"msk","type":"mcq","prompt":"A fracture is difficult to maintain in alignme
