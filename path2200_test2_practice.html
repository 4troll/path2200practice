nt because surrounding tissues exert tension. A pulling force is applied to counteract that tension and maintain alignment while reducing muscle spasm. Which method is being used?","options":[{"text":"Traction","correct":true},{"text":"Kyphoplasty","correct":false},{"text":"Arthrocentesis","correct":false},{"text":"Palliation","correct":false},{"text":"Bone graft resorption","correct":false}],"explanation":"Traction applies a pulling force to counteract tissue tension, maintain alignment, reduce joint pressure and muscle spasm, and immobilize.","thinking":true},{"id":"M47","area":"msk","type":"mcq","prompt":"A surgeon inserts a device directly into the body to stabilize and align a fractured bone. Which fixation method is described?","options":[{"text":"Internal fixation","correct":true},{"text":"External fixation","correct":false},{"text":"Traction only","correct":false},{"text":"Casting only","correct":false},{"text":"Reduction without fixation","correct":false}],"explanation":"Internal fixation devices are inserted surgically to stabilize and maintain bone alignment.","thinking":false},{"id":"M49","area":"msk","type":"mcq","prompt":"Severe blood loss from a major fracture compromises circulating blood volume. Which complication can result?","options":[{"text":"Hypovolemic shock","correct":true},{"text":"Pannus formation","correct":false},{"text":"Hypercalcemia","correct":false},{"text":"Joint effusion","correct":false},{"text":"Cachexia","correct":false}],"explanation":"Severe hemorrhage from a fracture can cause hypovolemic shock.","thinking":true},{"id":"M50","area":"msk","type":"mcq","prompt":"Months after a fracture, the bone ends have failed to grow together and the gap has filled with dense fibrous or cartilaginous tissue. What is this complication?","options":[{"text":"Nonunion","correct":true},{"text":"Delayed union","correct":false},{"text":"Malunion","correct":false},{"text":"Normal remodeling","correct":false},{"text":"Impacted fracture","correct":false}],"explanation":"Nonunion is failure of the bone ends to grow together; the gap may fill with dense fibrous or cartilaginous tissue.","thinking":false},{"id":"M53","area":"msk","type":"mcq","prompt":"An older adult sustains a hip fracture after minimal trauma. Imaging shows reduced bone mineral density and structural integrity. Which disorder best explains the fragility?","options":[{"text":"Osteoporosis","correct":true},{"text":"Osteomalacia","correct":false},{"text":"Paget disease","correct":false},{"text":"Osteomyelitis","correct":false},{"text":"Osteoarthritis","correct":false}],"explanation":"Osteoporosis is a metabolic bone disease with reduced bone density and structural integrity, predisposing to fractures with minimal trauma.","thinking":false},{"id":"M54","area":"msk","type":"mcq","prompt":"In osteoporosis, bone resorption increases while bone formation decreases. How does this imbalance affect bone density?","options":[{"text":"Resorption exceeds formation","correct":true},{"text":"Formation exceeds resorption","correct":false},{"text":"Mineralization is delayed but total bone mass rises","correct":false},{"text":"Cartilage is replaced by synovial fluid","correct":false},{"text":"Bone turnover stops completely","correct":false}],"explanation":"Osteoporosis involves increased bone resorption and reduced bone formation, resulting in net loss of bone density.","thinking":false},{"id":"M55","area":"msk","type":"mcq","prompt":"Why is osteoporosis more common in women, particularly after menopause?","options":[{"text":"Declining estrogen after menopause, lower starting bone density, and often less weight-bearing exercise contribute","correct":true},{"text":"Women have more testosterone and therefore more bone resorption","correct":false},{"text":"Men lose all bone density after puberty","correct":false},{"text":"Osteoporosis is caused only by bacterial infection","correct":false},{"text":"The condition is caused by excess uric acid","correct":false}],"explanation":"Contributors include hormonal changes after menopause, lower starting bone density, and differences in weight-bearing activity.","thinking":false},{"id":"M56","area":"msk","type":"mcq","prompt":"Osteoporosis is often not recognized until vertebral compression fractures cause height loss, kyphosis, or pain. What does this indicate about the timing of its manifestations?","options":[{"text":"Manifestations may only become evident late in the disease, often after fracture","correct":true},{"text":"Symptoms are always severe at the beginning of bone loss","correct":false},{"text":"Osteoporosis always causes fever before fractures","correct":false},{"text":"The first sign is a purulent discharge from bone","correct":false},{"text":"The disease is limited to the synovial membrane","correct":false}],"explanation":"Osteoporosis may remain unnoticed until fractures occur. Vertebral compression fractures can lead to kyphosis, height loss, and pain.","thinking":false},{"id":"M57","area":"msk","type":"mcq","prompt":"Diffuse skeletal tenderness, hip and back discomfort, muscle weakness, a waddling gait, and poorly mineralized osteoid are characteristic of which disorder?","options":[{"text":"Osteomalacia","correct":true},{"text":"Osteoporosis","correct":false},{"text":"Paget disease","correct":false},{"text":"Osteomyelitis","correct":false},{"text":"Rheumatoid arthritis","correct":false}],"explanation":"Osteomalacia is inadequate or delayed mineralization of osteoid, often linked to vitamin D deficiency and producing skeletal tenderness and muscle weakness.","thinking":false},{"id":"M58","area":"msk","type":"mcq","prompt":"What is the name of the childhood disorder caused by inadequate or delayed mineralization of developing bone and cartilage?","options":[{"text":"Rickets","correct":true},{"text":"Paget disease","correct":false},{"text":"Osteoporosis","correct":false},{"text":"Osteomyelitis","correct":false},{"text":"Gout","correct":false}],"explanation":"Rickets is the childhood form of defective mineralization associated with vitamin D deficiency or inadequate/delayed mineralization.","thinking":false},{"id":"M59","area":"msk","type":"mcq","prompt":"Which treatments are used for osteomalacia caused by vitamin D deficiency, in addition to addressing any underlying cause?","options":[{"text":"Calcium and vitamin D","correct":true},{"text":"Low-purine diet and urate-lowering drugs","correct":false},{"text":"Only immobilization and traction","correct":false},{"text":"Estrogen suppression and trastuzumab","correct":false},{"text":"Antibiotics for six weeks in every case","correct":false}],"explanation":"Treatment includes calcium and vitamin D replacement and management of contributing causes such as malabsorption or renal tubular disorders.","thinking":false},{"id":"M60","area":"msk","type":"mcq","prompt":"A bone disorder causes localized areas of excessive resorption followed by disorganized osteoid formation. The affected bone expands, becomes more vascular and fragile, and may bow. Which disorder is most likely?","options":[{"text":"Paget disease of bone","correct":true},{"text":"Osteoporosis","correct":false},{"text":"Osteomalacia","correct":false},{"text":"Osteoarthritis","correct":false},{"text":"Osteomyelitis","correct":false}],"explanation":"Paget disease involves focal excessive resorption and disorganized bone formation, producing enlarged, softer, more vascular and fragile bone.","thinking":false},{"id":"M61","area":"msk","type":"mcq","prompt":"Paget disease can cause skull thickening and frontal bossing. Which blood test finding is commonly associated with increased osteoblastic activity?","options":[{"text":"Elevated alkaline phosphatase","correct":true},{"text":"Decreased rheumatoid factor","correct":false},{"text":"Elevated serum uric acid only","correct":false},{"text":"Low HER2 expression","correct":false},{"text":"Reduced tumour markers","correct":false}],"explanation":"Alkaline phosphatase is commonly elevated because of increased osteoblastic activity.","thinking":false},{"id":"M62","area":"msk","type":"mcq","prompt":"Which serious bone complication is a possible long-term consequence of Paget disease?","options":[{"text":"Increased likelihood of osteosarcoma","correct":true},{"text":"HPV-associated cervical cancer","correct":false},{"text":"Pancytopenia from chemotherapy","correct":false},{"text":"Systemic lupus erythematosus","correct":false},{"text":"Hematoma formation outside the circulation","correct":false}],"explanation":"Paget disease is associated with an increased risk of osteosarcoma.","thinking":false},{"id":"M63","area":"msk","type":"mcq","prompt":"Fever, fatigue, anorexia, and localized bone tenderness develop after bacteria spread from an infection elsewhere in the body. Which disorder is most likely?","options":[{"text":"Osteomyelitis","correct":true},{"text":"Osteoporosis","correct":false},{"text":"Osteomalacia","correct":false},{"text":"Paget disease","correct":false},{"text":"Osteoarthritis","correct":false}],"explanation":"Osteomyelitis is a severe bacterial infection of bone; endogenous infection can spread from another site through the blood.","thinking":false},{"id":"CS01","area":"cancer","type":"sata","prompt":"A tumour specimen and family history are being reviewed. Which statements are consistent with the cancer genetics and classification material (SELECT ALL THAT APPLY)","options":[{"text":"A proto-oncogene normally stimulates cell growth and can become an overactive oncogene","correct":true},{"text":"A gain-of-function oncogene mutation generally requires only one mutated copy","correct":true},{"text":"A tumour suppressor generally requires both copies to be lost before its STOP function fails","correct":true},{"text":"Inherited BRCA1 mutations can increase breast and ovarian cancer risk","correct":true},{"text":"A somatic mutation in an ordinary body cell is automatically passed to offspring","correct":false}],"explanation":"Proto-oncogenes are normal GO genes; one gain-of-function mutation can activate them. Tumour suppressors require loss of both copies. Germinal, not somatic, mutations are inherited.","thinking":true},{"id":"CS02","area":"cancer","type":"sata","prompt":"Which statements about chemical carcinogens and infection-associated cancer risks are correct (SELECT ALL THAT APPLY)","options":[{"text":"Procarcinogens require metabolic conversion before they become carcinogenic","correct":true},{"text":"Chemical carcinogenesis is commonly dose dependent and may be delayed for years","correct":true},{"text":"HBV is associated with primary liver cancer and spreads through blood and bodily fluids","correct":true},{"text":"HPV is typically spread through sexual contact and is strongly linked to cervical and anal cancers","correct":true},{"text":"H. pylori is a virus that is mainly transmitted through blood transfusion","correct":false}],"explanation":"Direct-reactive carcinogens can act without metabolic activation, whereas procarcinogens require conversion by enzymes. Chemical effects may be dose-dependent and delayed. HBV, HPV, and H. pylori are associated with specific cancer risks.","thinking":true},{"id":"CS03","area":"cancer","type":"sata","prompt":"Which statements about systemic manifestations of advanced cancer and abnormal blood counts are correct (SELECT ALL THAT APPLY)","options":[{"text":"Fatigue is the most common symptom and may not improve with sleep","correct":true},{"text":"Cachexia can involve muscle and fat loss even when food intake is unchanged or increased","correct":true},{"text":"Low red blood cells are described as anemia","correct":true},{"text":"Low white blood cells increase infection risk","correct":true},{"text":"Tumour-derived ADH is associated with Cushing syndrome","correct":false}],"explanation":"Advanced cancer can cause fatigue, cachexia, anemia, and leukopenia. Tumour-derived ADH is associated with SIADH, whereas tumour-derived ACTH is associated with Cushing syndrome.","thinking":true},{"id":"MS01","area":"msk","type":"sata","prompt":"Which statements correctly describe fracture terminology (SELECT ALL THAT APPLY)","options":[{"text":"An open fracture has disrupted skin and communicates with the outside","correct":true},{"text":"A comminuted fracture contains several intermediate fragments","correct":true},{"text":"An impacted fracture has fragments driven into each other","correct":true},{"text":"A displaced fracture has fragments that are no longer anatomically aligned","correct":true},{"text":"A transverse fracture runs along the length of the bone","correct":false}],"explanation":"Open/closed describes skin integrity; comminuted describes multiple fragments; impacted describes fragments driven together; displaced describes loss of anatomical alignment. Transverse is perpendicular to the long axis.","thinking":true},{"id":"MS02","area":"msk","type":"sata","prompt":"Which statements correctly describe the stages of fracture healing (SELECT ALL THAT APPLY)","options":[{"text":"Hematoma/procallus formation occurs during approximately the first week","correct":true},{"text":"Fibrocartilaginous callus bridges fragments during approximately weeks 1-3","correct":true},{"text":"The fibrocartilaginous callus is initially strong enough for unrestricted weight-bearing","correct":false},{"text":"Bony callus forms as the fibrocartilaginous tissue ossifies","correct":true},{"text":"Remodeling replaces spongy bone with compact bone and removes excess material","correct":true}],"explanation":"The sequence is hematoma/procallus, fibrocartilaginous callus, bony callus, and remodeling. The fibrocartilaginous callus is not yet strong enough to bear weight.","thinking":true},{"id":"MS03","area":"msk","type":"sata","prompt":"Which statements correctly distinguish osteoarthritis, rheumatoid arthritis, and gout (SELECT ALL THAT APPLY)","options":[{"text":"Osteoarthritis is characterized primarily by loss and breakdown of articular cartilage","correct":true},{"text":"Rheumatoid arthritis begins with autoimmune inflammation of the synovial membrane","correct":true},{"text":"Pannus in rheumatoid arthritis can extend onto cartilage and underlying bone and destroy them","correct":true},{"text":"Gout involves urate crystals that attract white blood cells and can trigger inflammatory damage","correct":true},{"text":"Osteoarthritis is defined by systemic autoimmune inflammation and rheumatoid factor","correct":false}],"explanation":"Osteoarthritis involves cartilage breakdown; rheumatoid arthritis involves autoimmune synovitis and pannus; gout involves inflammation triggered by urate crystals.","thinking":true},{"id":"CS04","area":"cancer","type":"sata","prompt":"A diagnostic work-up is underway for a suspected primary cancer. Which statements are accurate (SELECT ALL THAT APPLY)","options":[{"text":"Screening aims to identify cancer in an otherwise asymptomatic person","correct":true},{"text":"Biopsy with microscopic identification is the definitive diagnostic approach described","correct":true},{"text":"Immunohistochemistry uses antibodies to help identify cellular origin or markers","correct":true},{"text":"TNM staging describes tumour extent, lymph nodes, and distant metastasis","correct":true},{"text":"A tumour marker is a universal test that definitively diagnoses every cancer","correct":false}],"explanation":"Screening is secondary prevention; biopsy and microscopy provide definitive diagnosis; IHC helps identify origin; TNM records T, N and M. No universal tumour marker exists.","thinking":true},{"id":"CS05","area":"cancer","type":"sata","prompt":"Which statements about surgery and radiation treatment for solid tumours are correct (SELECT ALL THAT APPLY)","options":[{"text":"Surgery may be curative when the tumour is contained, has not metastasized, and a large margin can be removed","correct":true},{"text":"De-bulking removes as much tumour as possible to support other therapies","correct":true},{"text":"Palliative surgery is intended to relieve symptoms such as pain or obstruction rather than cure","correct":true},{"text":"Radiation damages molecules and DNA through ionization and free-radical formation","correct":true},{"text":"Radiation can distinguish malignant cells from all rapidly dividing healthy cells","correct":false}],"explanation":"Surgery may be curative, used to debulk a tumour, or used for palliation. Radiation damages DNA through ionization and free-radical formation, but can also affect rapidly dividing healthy cells in the treated area.","thinking":true},{"id":"CS06","area":"cancer","type":"sata","prompt":"Which statements about chemotherapy, hormone therapy, and biotherapy are correct (SELECT ALL THAT APPLY)","options":[{"text":"Chemotherapy is systemic and is used for widespread or high-risk microscopic disease","correct":true},{"text":"Combination chemotherapy can reduce resistance and allow smaller doses","correct":true},{"text":"Exponential killing means each course kills the same percentage rather than the same absolute number of cells","correct":true},{"text":"Hormone therapy may slow hormone-responsive breast or endometrial tumour growth by altering the hormonal environment","correct":true},{"text":"Interferons are described as anti-angiogenic and pro-apoptotic","correct":true}],"explanation":"Combination chemotherapy is systemic and can reduce the chance of drug resistance; its effects include damage to normal rapidly dividing cells. Hormone therapy is used for responsive tumours, and interferons can have anti-angiogenic and pro-apoptotic effects.","thinking":true},{"id":"MS04","area":"msk","type":"sata","prompt":"Which statements correctly distinguish osteoporosis, osteomalacia, and Paget disease (SELECT ALL THAT APPLY)","options":[{"text":"Osteoporosis involves reduced bone density and structural integrity and predisposes to fractures with minimal trauma","correct":true},{"text":"Osteomalacia involves inadequate or delayed mineralization of osteoid and is commonly linked to vitamin D deficiency","correct":true},{"text":"Paget disease involves focal excessive resorption followed by disorganized bone formation","correct":true},{"text":"Paget disease can produce softer, more vascular, fragile and enlarged bone","correct":true},{"text":"Osteoporosis is primarily a bacterial infection that fills bone canaliculi with purulent exudate","correct":false}],"explanation":"Osteoporosis reduces bone density and strength; osteomalacia involves inadequate mineralization of osteoid; Paget disease involves focal, disorganized bone remodeling.","thinking":true},{"id":"MS05","area":"msk","type":"sata","prompt":"Which statements about the causes, progression, and treatment of osteomyelitis are correct (SELECT ALL THAT APPLY)","options":[{"text":"Staphylococcus aureus is identified as a common cause","correct":true},{"text":"Endogenous infection can spread to bone through blood from another site","correct":true},{"text":"Exogenous infection can enter through an open wound, compound fracture, bite, or surgery","correct":true},{"text":"Purulent exudate can compromise blood supply and lead to bone necrosis","correct":true},{"text":"Because bone expands easily, the infection usually causes no pressure beneath the periosteum","correct":false}],"explanation":"Staphylococcus aureus is a common cause. Infection may reach bone through the bloodstream (endogenous) or from an external source (exogenous). Exudate can extend beneath the periosteum and compromise cortical blood supply.","thinking":true},{"id":"M64","area":"msk","type":"mcq","prompt":"Several days after a ligament sprain, which sequence best describes the soft-tissue repair process?","options":[{"text":"Fibroblasts supported by neovascularization repair the injury; collagen is deposited after about 4-5 days, with healing taking about 4-5 weeks","correct":true},{"text":"Osteoclasts form a bony callus during the first 24 hours, followed by compact bone within 48 hours","correct":false},{"text":"Synovial fluid replaces the torn ligament immediately, so immobilization is unnecessary","correct":false},{"text":"The entire ligament regenerates within hours, although strong pulling is recommended for the next day","correct":false},{"text":"Cartilage is deposited first and the tissue is fully healed only after several years","correct":false}],"explanation":"Fibroblasts and new blood vessels support repair. Collagen deposition begins after about 4–5 days, and healing commonly takes about 4–5 weeks; strong pulling forces should be avoided for 6–8 weeks.","thinking":true},{"id":"M65","area":"msk","type":"mcq","prompt":"How can purulent exudate within bone lead to cortical necrosis during osteomyelitis?","options":[{"text":"Exudate fills small canals, tracks beneath the periosteum, disrupts the blood supply, and leads to necrosis of underlying bone","correct":true},{"text":"Exudate expands freely within the marrow cavity without affecting vessels and strengthens the cortex","correct":false},{"text":"The infection increases osteoblast blood flow, causing excessive mineralization of every osteon","correct":false},{"text":"The synovial membrane releases urate crystals that dissolve the periosteum","correct":false},{"text":"Cartilage becomes hyperplastic and forms a protective pannus around the bone","correct":false}],"explanation":"Because bone has little room to expand, purulent exudate can extend beneath the periosteum and shear or obstruct vessels supplying the cortex. Reduced blood flow can cause bone necrosis.","thinking":false},{"id":"M66","area":"msk","type":"mcq","prompt":"A section of devitalized bone is surrounded by thick new bone in chronic osteomyelitis. What are these two structures called, respectively?","options":[{"text":"The devitalized fragment is a sequestrum; the new bone around it is an involucrum","correct":true},{"text":"The devitalized fragment is an involucrum; the new bone around it is a sequestrum","correct":false},{" rtilage involvement","correct":false}],"explanation":"Osteoarthritis is characterized by loss of articular cartilage; increased synovial fluid (joint effusion) can cause swelling, pain, stiffness after use, and reduced range of motion.","thinking":false},{"id":"M69","area":"msk","type":"mcq","prompt":"Which radiographic findings are characteristic of osteoarthritis?","options":[{"text":"Joint-space narrowing, osteophytes, and subchondral sclerosis","correct":true},{"text":"Pannus, rheumatoid nodules, and symmetric erosions only","correct":false},{"text":"Sequestrum, involucrum, and periosteal lifting","correct":false},{"text":"Urate crystals, tophi, and soft-tissue abscesses","correct":false},{"text":"A widened joint space, increased cartilage thickness, and no bony change","correct":false}],"explanation":"Characteristic findings include joint-space narrowing, osteophytes, and subchondral sclerosis.","thinking":false},{"id":"M70","area":"msk","type":"mcq","prompt":"In rheumatoid arthritis, which immune mechanism contributes to joint damage?","options":[{"text":"Autoantibody-containing immune complexes embed in synovium, activate complement and leukocytes, and attract cells that release tissue-degrading enzymes","correct":true},{"text":"Loss of articular cartilage from age-related proteoglycan depletion occurs without immune activation","correct":false},{"text":"Urate crystals form because synovial fluid is cooler and less soluble than plasma","correct":false},{"text":"Bacteria fill osteonic canals and cause a sequestrum","correct":false},{"text":"A tendon stretches excessively after unusual muscle contraction","correct":false}],"explanation":"Rheumatoid factor and other autoantibodies can form immune complexes in synovium, activate complement and WBCs, and attract PMNs/macrophages that release enzymes damaging synovium and cartilage.","thinking":false},{"id":"M71","area":"msk","type":"mcq","prompt":"In rheumatoid arthritis, which inflammatory tissue migrates over articular surfaces and releases destructive enzymes, contributing to cartilage and bone loss?","options":[{"text":"Pannus","correct":true},{"text":"Osteophyte","correct":false},{"text":"Sequestrum","correct":false},{"text":"Tophus","correct":false},{"text":"Fibrocartilaginous callus","correct":false}],"explanation":"Pannus is proliferative inflammatory tissue that grows over articular surfaces and destroys cartilage and underlying bone through enzymes and mediators.","thinking":false},{"id":"M72","area":"msk","type":"mcq","prompt":"Which findings are characteristic of rheumatoid arthritis?","options":[{"text":"Rheumatoid arthritis","correct":true},{"text":"Osteoarthritis","correct":false},{"text":"Gout","correct":false},{"text":"Osteomalacia","correct":false},{"text":"Osteomyelitis","correct":false}],"explanation":"Findings may include prolonged morning stiffness, involvement of multiple joint areas and the hands, symmetric arthritis, rheumatoid nodules, rheumatoid factor, and characteristic X-ray changes.","thinking":false},{"id":"M73","area":"msk","type":"mcq","prompt":"Why does an elevated serum uric acid level alone not establish a diagnosis of gout?","options":[{"text":"Hyperuricemia alone does not mean gout; urate crystals must deposit in joints or tissues and trigger inflammation","correct":true},{"text":"Every person with hyperuricemia automatically has gout","correct":false},{"text":"Gout is caused by deficient vitamin D mineralization of osteoid","correct":false},{"text":"Gout is a bacterial infection that spreads from the blood into bone","correct":false},{"text":"High uric acid prevents crystal formation in cooler peripheral joints","correct":false}],"explanation":"Hyperuricemia alone does not establish gout. Gout develops when monosodium urate crystals deposit in joints or tissues and trigger inflammation.","thinking":false},{"id":"M74","area":"msk","type":"mcq","prompt":"During an acute gout attack, urate crystals are present in a painful, swollen joint. Which cellular sequence best explains the inflammatory damage?","options":[{"text":"Crystals attract WBCs and activate complement; PMNs ingest crystals, rupture, and release digestive enzymes that damage the joint","correct":true},{"text":"Crystals inhibit all leukocyte movement and prevent inflammation","correct":false},{"text":"Osteoblasts ingest the crystals and produce a protective bony callus","correct":false},{"text":"Synovial fluid dissolves the crystals and prevents cartilage injury","correct":false},{"text":"Fibroblasts form a stable ligament around the joint within minutes","correct":false}],"explanation":"Urate crystals are chemotactic to WBCs and activate complement. PMNs ingest crystals, rupture, and release digestive enzymes that damage cartilage and subchondral bone.","thinking":false},{"id":"M75","area":"msk","type":"mcq","prompt":"Which long-term changes can occur with recurrent gout, and what measures are used to manage the condition?","options":[{"text":"Crystals may form permanent tophi and damage cartilage/bone; reduce urate and inflammation, use ice, limit weight-bearing during attacks, and follow a low-purine diet","correct":true},{"text":"The attacks permanently resolve after one episode; treatment is weight-bearing exercise only","correct":false},{"text":"The main long-term complication is pannus; treat with antibiotics and internal fixation","correct":false},{"text":"Tophi are caused by vitamin D deficiency; treat with calcium and kyphoplasty","correct":false},{"text":"The disease is a strain of a tendon; treat with elevation and compression only","correct":false}],"explanation":"Recurrent gout can lead to increasingly frequent attacks, tophi, and cartilage or bone damage. Management may include urate-lowering and anti-inflammatory medication, ice, limiting weight-bearing during attacks, and a low-purine diet.","thinking":false},{"id":"R01","area":"readings","type":"mcq","prompt":"What defines occult breast cancer?","options":[{"text":"Axi e receptor (PR), and GCDFP-15. HER2 was 1+, and CK7, CK20, and TTF-1 were negative.","thinking":true},{"id":"R04","area":"readings","type":"mcq","prompt":"The male occult breast cancer case had no detectable primary breast mass but extensive axillary and infraclavicular nodal involvement. Which TNM stage was assigned?","options":[{"text":"T0N3aM0, Stage IIIC","correct":true},{"text":"T1N0M0, Stage I","correct":false},{"text":"T2N1M0, Stage IIA","correct":false},{"text":"T0N1M1, Stage IV","correct":false},{"text":"T3N2M0, Stage IIIA","correct":false}],"explanation":"The reported classification was T0N3aM0, Stage IIIC: no detectable primary tumour (T0), extensive regional nodal disease including infraclavicular nodes (N3a), and no distant metastasis (M0).","thinking":true},{"id":"R05","area":"readings","type":"mcq","prompt":"Which statement best explains why mastectomy was not performed in the reported male occult breast cancer case?","options":[{"text":"No primary breast lesion was identified, and axillary/infraclavicular nodal surgery was performed instead","correct":true},{"text":"Mastectomy is contraindicated in all cases of male breast cancer","correct":false},{"text":"The tumour was benign and did not require breast surgery","correct":false},{"text":"Imaging showed that the cancer was confined to the nipple","correct":false},{"text":"The patient had distant metastases, so all surgery was avoided","correct":false}],"explanation":"No primary lesion was detected in either breast. The patient underwent axillary and infraclavicular lymph-node dissection without mastectomy; the article discusses evidence that mastectomy may not be necessary in occult breast cancer when breast imaging is negative.","thinking":true},{"id":"R06","area":"readings","type":"mcq","prompt":"Which combination of adjuvant treatments followed surgery in the reported male occult breast cancer case?","options":[{"text":"Chemotherapy, regional radiotherapy, and tamoxifen","correct":true},{"text":"Radiotherapy alone, followed by long-term corticosteroids","correct":false},{"text":"Antibiotics, colchicine, and methotrexate","correct":false},{"text":"Hormone therapy alone, with no additional treatment","correct":false},{"text":"Immunotherapy and total mastectomy only","correct":false}],"explanation":"After lymph-node dissection, the patient received chemotherapy, radiotherapy, and tamoxifen. Follow-up reported no recurrence for more than four years.","thinking":false},{"id":"R07","area":"readings","type":"mcq","prompt":"Which finding provided definitive evidence of gout in the case of rheumatoid arthritis with persistent knee symptoms?","options":[{"text":"Birefringent, needle-shaped urate crystals in synovial fluid under polarized microscopy","correct":true},{"text":"A positive rheumatoid factor by itself","correct":false},{"text":"Joint-space narrowing on a hand radiograph","correct":false},{"text":"A normal serum uric acid level","correct":false},{"text":"A raised erythrocyte sedimentation rate alone","correct":false}],"explanation":"Synovial fluid aspiration showed birefringent, needle-like crystals under polarized-light microscopy, confirming urate crystal deposition.","thinking":false},{"id":"R08","area":"readings","type":"mcq","prompt":"What does the case demonstrate about serum uric acid levels when evaluating possible gout in a person with rheumatoid arthritis?","options":[{"text":"A normal level does not rule out gout; crystal identification in synovial fluid can confirm the diagnosis","correct":true},{"text":"A normal level definitively excludes gout","correct":false},{"text":"Serum uric acid must be markedly elevated before gout can occur","correct":false},{"text":"Serum uric acid is more definitive than synovial-fluid crystal analysis","correct":false},{"text":"Serum uric acid is not affected by medications or hormonal factors","correct":false}],"explanation":"The reported patient initially had a normal serum uric acid level. Gout was later confirmed by finding urate crystals in synovial fluid, showing that a normal serum value does not exclude the condition.","thinking":true},{"id":"R09","area":"readings","type":"mcq","prompt":"In a person with established rheumatoid arthritis, persistent inflammation in only a few joints despite treat-to-target therapy should prompt investigation for which additional condition?","options":[{"text":"Coexisting gout","correct":true},{"text":"Osteomalacia","correct":false},{"text":"Osteomyelitis in every affected joint","correct":false},{"text":"A primary bone malignancy","correct":false},{"text":"Osteoporosis","correct":false}],"explanation":"The case highlights that persistent oligoarthritis that does not respond as expected to rheumatoid arthritis treatment may reflect coexisting gout.","thinking":true},{"id":"R10","area":"readings","type":"mcq","prompt":"Which ultrasonographic finding was associated with gout in the affected knee?","options":[{"text":"The double-track sign, with joint effusion and synovial thickening","correct":true},{"text":"A complete absence of joint fluid and synovial tissue","correct":false},{"text":"A sequestrum surrounded by involucrum","correct":false},{"text":"A displaced fracture of the tibial plateau","correct":false},{"text":"A malignant mass replacing the articular cartilage","correct":false}],"explanation":"Ultrasonography showed effusion, synovial thickening, and a double-track sign at the articular cartilage, findings that supported gout.","thinking":false},{"id":"R11","area":"readings","type":"mcq","prompt":"How can long-term treatment for rheumatoid arthritis make coexisting gout more difficult to recognize?","options":[{"text":"Glucocorticoids, NSAIDs, and biologic agents can suppress acute inflammatory flares, while some RA medications may lower uric acid","correct":true},{"text":"RA medications cause every urate crystal to dissolve immediately","correct":false},{"text":"RA medications make synovial fluid crystal analysis impossible","correct":false},{"text":"RA medications consistently increase serum uric acid to diagnostic levels","correct":false},{"text":"RA medications cause gout to affect only the small joints of the hands","correct":false}],"explanation":"The article discusses how glucocorticoids, NSAIDs, and biologic agents may suppress acute gout symptoms. It also proposes that methotrexate and leflunomide may reduce uric acid levels, potentially masking the condition.","thinking":true},{"id":"R12","area":"readings","type":"mcq","prompt":"Which treatment combination was associated with resolution of knee pain and swelling in the rheumatoid arthritis–gout case?","options":[{"text":"Colchicine, febuxostat, and a TNF-α receptor antagonist","correct":true},{"text":"Tamoxifen, paclitaxel, and radiotherapy","correct":false},{"text":"Calcium, vitamin D, and bisphosphonates","correct":false},{"text":"Antibiotics, surgical debridement, and immobilization","correct":false},{"text":"Allopurinol alone, with no other medication","correct":false}],"explanation":"Colchicine and febuxostat were added alongside a TNF-α receptor antagonist. At approximately three-year follow-up, the knee symptoms had resolved and had not recurred.","thinking":false}];

    let currentFilter = 'all';
    let shuffledQuestions = [];
    let activeQuestions = [];
    const userState = new Map();

    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function buildShuffledQuestionSet() {
      shuffledQuestions = shuffleArray(questionBank.map(q => ({
        ...q,
        options: shuffleArray(q.options.map(o => ({...o})))
      })));
    }

    function setActiveQuestions(filter) {
      currentFilter = filter;
      activeQuestions = filter === 'all'
        ? [...shuffledQuestions]
        : shuffledQuestions.filter(q => q.area === filter);
    }

    function updateScore() {
      let submittedCount = 0;
      let totalScore = 0;
      userState.forEach(state => {
        if (state.submitted) { submittedCount++; totalScore += state.score; }
      });
      const grade = submittedCount ? Math.round((totalScore / submittedCount) * 100) : 0;
      const scoreElem = document.getElementById('score-counter');
      scoreElem.textContent = `Grade: ${grade}%`;
      scoreElem.title = `Submitted ${submittedCount} / ${questionBank.length} questions`;
    }

    function filterQuestions(filter, button) {
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      button.classList.add('active');
      setActiveQuestions(filter);
      renderQuestions();
      updateScore();
    }

    function resetAttempt() {
      userState.clear();
      buildShuffledQuestionSet();
      setActiveQuestions(currentFilter);
      renderQuestions();
      updateScore();
    }

    function escapeHTML(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function renderQuestions() {
      const container = document.getElementById('questionsContainer');
      container.innerHTML = '';
      const letters = ['A', 'B', 'C', 'D', 'E'];

      activeQuestions.forEach((q, displayIndex) => {
        const state = userState.get(q.id) || { submitted: false, selected: [], score: 0 };
        const card = document.createElement('div');
        card.className = 'q-card';
        card.id = `qcard-${q.id}`;

        if (state.submitted) {
          card.classList.add('answered');
          if (state.score === 1) card.classList.add('is-correct');
          else if (state.score > 0) card.classList.add('is-partial');
          else card.classList.add('is-wrong');
        }

        let optionsHTML = '';
        q.options.forEach((option, index) => {
          let extraClass = '';
          if (state.submitted) {
            if (option.correct && state.score === 1) extraClass = 'user-correct';
            else if (option.correct) extraClass = 'reveal-correct';
            else if (state.selected.includes(index)) extraClass = 'user-wrong';
          } else if (state.selected.includes(index)) {
            extraClass = 'selected';
          }

          optionsHTML += `
            <button type="button" class="opt-btn ${extraClass}" ${state.submitted ? 'disabled' : ''}
                    onclick="handleOptionClick('${q.id}', ${index})">
              <span class="opt-prefix">${letters[index]}.</span>
              <span>${escapeHTML(option.text)}</span>
            </button>
          `;
        });

        const badge = q.type === 'sata' ? 'SATA' : 'MCQ';
        const submitDisabled = state.submitted || state.selected.length === 0 ? 'disabled' : '';
        const buttonText = state.submitted ? 'Submitted' : 'Submit Answer';

        card.innerHTML = `
          <div class="q-header">
            <span class="q-num">Question ${displayIndex + 1}</span>
            <span class="q-cat">${badge}</span>
          </div>
          <div class="q-text">${escapeHTML(q.prompt)}</div>
          <div class="opt-list">${optionsHTML}</div>
          <button class="submit-q-btn" id="btn_${q.id}" ${submitDisabled}
                  onclick="submitAnswer('${q.id}')">${buttonText}</button>
          <div class="feedback-box" id="feedback_${q.id}"></div>
        `;

        container.appendChild(card);
        if (state.submitted) showFeedback(q.id);
      });
    }

    function handleOptionClick(qid, optionIndex) {
      const q = shuffledQuestions.find(item => item.id === qid);
      if (!q) return;
      const previous = userState.get(qid) || { submitted: false, selected: [], score: 0 };
      if (previous.submitted) return;

      let selected;
      if (q.type === 'mcq') {
        selected = [optionIndex];
      } else {
        selected = [...previous.selected];
        const at = selected.indexOf(optionIndex);
        if (at >= 0) selected.splice(at, 1);
        else selected.push(optionIndex);
      }
      userState.set(qid, { submitted: false, selected, score: 0 });
      renderQuestions();
    }

    function submitAnswer(qid) {
      const q = shuffledQuestions.find(item => item.id === qid);
      const state = userState.get(qid);
      if (!q || !state || state.submitted || state.selected.length === 0) return;

      state.submitted = true;
      if (q.type === 'mcq') {
        state.score = q.options[state.selected[0]]?.correct ? 1 : 0;
      } else {
        const totalCorrect = q.options.filter(option => option.correct).length;
        let correctSelected = 0;
        let incorrectSelected = 0;
        state.selected.forEach(index => {
          if (q.options[index]?.correct) correctSelected++;
          else incorrectSelected++;
        });
        // SATA credit: +1/N for each correct selection, -1/N for each incorrect selection, min 0, max 1.
        state.score = Math.min(1, Math.max(0, (correctSelected - incorrectSelected) / totalCorrect));
      }

      userState.set(qid, state);
      updateScore();
      renderQuestions();
    }

    function showFeedback(qid) {
      const q = shuffledQuestions.find(item => item.id === qid);
      const state = userState.get(qid);
      const box = document.getElementById(`feedback_${qid}`);
      if (!q || !state || !box) return;

      let klass = 'incorrect';
      let title = '✗ Incorrect';
      if (state.score === 1) { klass = 'correct'; title = '✓ Correct!'; }
      else if (state.score > 0) { klass = 'partial'; title = `Partial Credit (+${state.score.toFixed(2)})`; }
      box.className = `feedback-box ${klass}`;
      box.style.display = 'block';
      box.innerHTML = `<div class="feedback-title">${title}</div><div class="explanation">${escapeHTML(q.explanation)}</div>`;
    }

    document.getElementById('navTabs').addEventListener('click', event => {
      const button = event.target.closest('.filter-btn');
      if (!button) return;
      filterQuestions(button.dataset.filter, button);
    });
    document.getElementById('resetBtn').addEventListener('click', resetAttempt);

    // The All filter is the default; question order and every option list are shuffled at launch.
    buildShuffledQuestionSet();
    setActiveQuestions('all');
    renderQuestions();
    updateScore();
  </script>
</body>
</html>
