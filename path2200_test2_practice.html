<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PATH2200 Pathophysiology Test 2 Practice</title>
  <style>
        :root {
            --primary: #0f172a;
            --accent: #2563eb;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --correct-border: #16a34a;
            --correct-bg: #f0fdf4;
            --correct-text: #15803d;
            --wrong-border: #dc2626;
            --wrong-bg: #fef2f2;
            --wrong-text: #b91c1c;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            line-height: 1.5;
            padding-bottom: 60px;
        }

        /* Sticky Header */
        header {
            position: -webkit-sticky;
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--primary);
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.1);
            padding: 12px 16px;
        }

        .header-content {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-title h1 {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        .header-title p {
            font-size: 0.75rem;
            color: #94a3b8;
        }

        .score-badge {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            white-space: nowrap;
        }

        /* Navigation / Filter Bar */
        .nav-bar {
            max-width: 800px;
            margin: 16px auto 0;
            padding: 0 16px;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .nav-bar::-webkit-scrollbar {
            display: none;
        }

        .filter-btn {
            background: #ffffff;
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .filter-btn.active {
            background: var(--accent);
            color: #ffffff;
            border-color: var(--accent);
        }

        /* Main Container */
        main {
            max-width: 800px;
            margin: 16px auto;
            padding: 0 16px;
        }

        /* Question Cards */
        .q-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }

        .q-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .q-num {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .q-cat {
            font-size: 0.72rem;
            color: var(--text-muted);
            background: #f1f5f9;
            padding: 2px 8px;
            border-radius: 4px;
        }

        .q-text {
            font-size: 0.98rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 16px;
            line-height: 1.45;
        }

        /* Options */
        .opt-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .opt-btn {
            display: flex;
            align-items: flex-start;
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid var(--border-color);
            border-radius: 10px;
            background: #ffffff;
            color: var(--text-main);
            font-size: 0.92rem;
            font-weight: 500;
            text-align: left;
            cursor: pointer;
            transition: border-color 0.15s ease, background-color 0.15s ease;
        }

        .opt-btn:active {
            background-color: #f1f5f9;
        }

        .opt-prefix {
            font-weight: 700;
            margin-right: 8px;
            color: var(--text-muted);
            flex-shrink: 0;
        }

        /* States after selecting */
        .q-card.answered .opt-btn {
            cursor: default;
            pointer-events: none;
            opacity: 0.6;
        }

        .q-card.answered .opt-btn.user-correct {
            background-color: var(--correct-bg) !important;
            border-color: var(--correct-border) !important;
            color: var(--correct-text) !important;
            opacity: 1 !important;
            font-weight: 600;
        }

        .q-card.answered .opt-btn.user-wrong {
            background-color: var(--wrong-bg) !important;
            border-color: var(--wrong-border) !important;
            color: var(--wrong-text) !important;
            opacity: 1 !important;
            font-weight: 600;
        }

        .q-card.answered .opt-btn.reveal-correct {
            background-color: var(--correct-bg) !important;
            border-color: var(--correct-border) !important;
            color: var(--correct-text) !important;
            opacity: 1 !important;
            font-weight: 600;
        }

        /* Explanations */
        .exp-box {
            display: none;
            margin-top: 14px;
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 0.88rem;
            line-height: 1.45;
        }

        .q-card.answered.is-correct .exp-correct {
            display: block;
            background-color: var(--correct-bg);
            border-left: 4px solid var(--correct-border);
            color: var(--correct-text);
        }

        .q-card.answered.is-wrong .exp-wrong {
            display: block;
            background-color: var(--wrong-bg);
            border-left: 4px solid var(--wrong-border);
            color: var(--wrong-text);
        }
    
        .opt-btn.selected {
            border-color: #93c5fd;
            background: #eff6ff;
            color: #1d4ed8;
        }
        .opt-btn:hover:not(:disabled) {
            border-color: #cbd5e1;
            background: #f8fafc;
        }
        .opt-btn:disabled { cursor: default; }
        .q-card.answered .opt-btn { cursor: default; pointer-events: none; opacity: 0.6; }
        .q-card.answered .opt-btn.user-correct,
        .q-card.answered .opt-btn.reveal-correct {
            background-color: var(--correct-bg) !important;
            border-color: var(--correct-border) !important;
            color: var(--correct-text) !important;
            opacity: 1 !important;
            font-weight: 600;
        }
        .q-card.answered .opt-btn.user-wrong {
            background-color: var(--wrong-bg) !important;
            border-color: var(--wrong-border) !important;
            color: var(--wrong-text) !important;
            opacity: 1 !important;
            font-weight: 600;
        }
        .submit-q-btn {
            margin-top: 14px;
            padding: 9px 14px;
            border: 1px solid var(--accent);
            border-radius: 8px;
            background: var(--accent);
            color: #fff;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
        }
        .submit-q-btn:hover:not(:disabled) { opacity: 0.92; }
        .submit-q-btn:active:not(:disabled) { transform: scale(0.98); }
        .submit-q-btn:disabled { opacity: 0.45; cursor: not-allowed; }
        .feedback-box {
            display: none;
            margin-top: 14px;
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 0.88rem;
            line-height: 1.45;
        }
        .feedback-box.correct { background: var(--correct-bg); border-left: 4px solid var(--correct-border); color: var(--correct-text); }
        .feedback-box.incorrect { background: var(--wrong-bg); border-left: 4px solid var(--wrong-border); color: var(--wrong-text); }
        .feedback-box.partial { background: #fffbeb; border-left: 4px solid #d97706; color: #92400e; }
        .feedback-title { font-weight: 700; margin-bottom: 4px; }
        .explanation { margin-top: 4px; }
        .nav-bar { align-items: center; }
        .reset-btn {
            background: #fff;
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            white-space: nowrap;
            cursor: pointer;
            flex-shrink: 0;
        }
        .reset-btn:hover { border-color: var(--accent); color: var(--accent); }
        .header-content { gap: 12px; }
        .header-title { min-width: 0; }
        .header-title h1 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .score-badge { flex-shrink: 0; }
        @media (max-width: 640px) {
            .header-title h1 { font-size: 1rem; }
            .score-badge { padding: 5px 10px; font-size: 0.8rem; }
            .q-card { padding: 16px; }
            .q-text { font-size: 0.95rem; }
            .opt-btn { font-size: 0.9rem; padding: 11px 12px; }
        }
</style>
</head>

  <header>
    <div class="header-content">
      <div class="header-title">
        <h1>PATH2200 Test 2 Practice</h1>
        <p>149 Questions • Cancer + Musculoskeletal</p>
      </div>
      <div class="score-badge" id="score-counter">Grade: 0%</div>
    </div>
  </header>

  <div class="nav-bar" id="navTabs">
    <button class="filter-btn active" data-filter="all" type="button">All (149)</button>
    <button class="filter-btn" data-filter="cancer" type="button">Cancer (81)</button>
    <button class="filter-btn" data-filter="msk" type="button">MSK (68)</button>
    <button class="reset-btn" id="resetBtn" type="button">Reset</button>
  </div>

  <main id="questionsContainer"></main>

  <script>

organs", "correct": false}, {"text": "Secretion of collagenase through the basement membrane", "correct": false}, {"text": "Hematologic dissemination to the lungs", "correct": false}, {"text": "Acquisition of organ tropism", "correct": false}], "explanation": "Benign tumours can still be clinically dangerous when their location allows compression or obstruction of vital tissues or vessels.", "thinking": false}, {"id": "C04", "area": "cancer", "type": "mcq", "prompt": "A pathologist compares two tumours. Tumour X is slow-growing, well differentiated, encapsulated, and localized. Tumour Y is poorly differentiated, has ill-defined borders, invades locally, and has distant deposits. Which interpretation is most consistent with the guides?", "options": [{"text": "X is benign; Y is malignant", "correct": true}, {"text": "X is malignant; Y is benign", "correct": false}, {"text": "Both are benign because both are neoplasms", "correct": false}, {"text": "Both are malignant because both have abnormal growth", "correct": false}, {"text": "X is carcinoma in situ; Y is dysplasia", "correct": false}], "explanation": "The guides contrast benign tumours as well differentiated, encapsulated and localized with malignant tumours as anaplastic, invasive and capable of metastasis.", "thinking": true}, {"id": "C05", "area": "cancer", "type": "mcq", "prompt": "A rapidly enlarging malignant tumour develops central areas of necrosis and bleeding. Which explanation best fits the relationship between growth and its blood supply?", "options": [{"text": "Rapidly proliferating cells outgrow the blood supply reaching the tumour core", "correct": true}, {"text": "The tumour has become encapsulated and prevents all lymphatic drainage", "correct": false}, {"text": "The cells have stopped dividing through density-dependent inhibition", "correct": false}, {"text": "The tumour has increased differentiation and reduced metabolic demand", "correct": false}, {"text": "The tumour is producing excess normal tissue rather than new vessels", "correct": false}], "explanation": "The Cancer guide notes that rapidly growing malignant cells may outgrow their blood supply, producing necrotic and hemorrhagic areas.", "thinking": true}, {"id": "C06", "area": "cancer", "type": "mcq", "prompt": "A biopsy shows that tumour cells have lost the structural and functional resemblance to the tissue from which they arose. Which term describes this loss of differentiation?", "options": [{"text": "Anaplasia", "correct": true}, {"text": "Dysplasia", "correct": false}, {"text": "Metaplasia", "correct": false}, {"text": "Hyperplasia", "correct": false}, {"text": "Hematoma", "correct": false}], "explanation": "Anaplasia is loss of differentiation; malignant cells no longer resemble the normal cells of their tissue of origin.", "thinking": false}, {"id": "C07", "area": "cancer", "type": "mcq", "prompt": "Normal epithelial cells stop dividing once they are tightly packed. A tumour continues proliferating in the same crowded conditions. Which cancer-cell characteristic has been lost?", "options": [{"text": "Density-dependent inhibition", "correct": true}, {"text": "Telomerase activity", "correct": false}, {"text": "Angiogenesis", "correct": false}, {"text": "Apoptosis", "correct": false}, {"text": "Organ tropism", "correct": false}], "explanation": "Loss of density-dependent inhibition allows cancer cells to keep dividing when crowded, unlike normal cells.", "thinking": true}, {"id": "C08", "area": "cancer", "type": "mcq", "prompt": "A tumour-cell culture continues dividing even after external growth-factor signals are removed. Which acquired property best accounts for this observation?", "options": [{"text": "Growth-factor independence", "correct": true}, {"text": "Loss of vascular supply", "correct": false}, {"text": "Increased contact inhibition", "correct": false}, {"text": "Reduced genetic instability", "correct": false}, {"text": "Increased cadherin expression", "correct": false}], "explanation": "Cancer cells can become independent of external growth factors and ignore normal signals that regulate division.", "thinking": true}, {"id": "C09", "area": "cancer", "type": "mcq", "prompt": "Cells from a malignant tumour detach readily from neighbouring cells and migrate into adjacent tissue. Which molecular change described in the guide most directly supports this autonomy?", "options": [{"text": "Loss of cadherins", "correct": true}, {"text": "Increased telomerase", "correct": false}, {"text": "Increased VEGF", "correct": false}, {"text": "Increased p53 activity", "correct": false}, {"text": "Increased density-dependent inhibition", "correct": false}], "explanation": "Cadherins normally act as cell-to-cell connections. Their loss reduces attachment to neighbours and contributes to cancer-cell autonomy and mobility.", "thinking": true}, {"id": "C10", "area": "cancer", "type": "mcq", "prompt": "A cell detaches from the basement membrane and continues dividing rather than requiring attachment to its normal supporting surface. Which characteristic is being demonstrated?", "options": [{"text": "Anchorage independence", "correct": true}, {"text": "Density-dependent inhibition", "correct": false}, {"text": "Differentiation", "correct": false}, {"text": "Apoptosis", "correct": false}, {"text": "Tumour encapsulation", "correct": false}], "explanation": "Anchorage independence means cancer cells can detach from the basement membrane and neighbouring cells yet continue dividing.", "thinking": false}, {"id": "C11", "area": "cancer", "type": "mcq", "prompt": "A malignant cell line continues replicating far beyond the usual division limit of normal cells. Which mechanism in the guide best explains this?", "options": [{"text": "Telomerase rebuilds telomere caps and supports limitless replication", "correct": true}, {"text": "VEGF replaces telomeres with new blood vessels", "correct": false}, {"text": "Collagenase prevents telomere shortening", "correct": false}, {"text": "Cadherins activate DNA repair after every division", "correct": false}, {"text": "AMF prevents chromosome replication", "correct": false}], "explanation": "Cancer cells can reactivate telomerase, which replaces telomere material and supports limitless replicative potential.", "thinking": true}, {"id": "C12", "area": "cancer", "type": "mcq", "prompt": "A cell has irreversible DNA damage but does not undergo programmed cell death. Which cancer-cell characteristic does this illustrate?", "options": [{"text": "Avoidance of apoptosis", "correct": true}, {"text": "Angiogenesis", "correct": false}, {"text": "Density-dependent inhibition", "correct": false}, {"text": "Differentiation", "correct": false}, {"text": "Tumour encapsulation", "correct": false}], "explanation": "Cancer cells can acquire mutations that let them ignore programmed cell-death signals, avoiding apoptosis.", "thinking": false}, {"id": "C13", "area": "cancer", "type": "mcq", "prompt": "Several daughter cells within one tumour acquire different mutations over successive divisions. Which underlying characteristic makes this diversification more likely?", "options": [{"text": "Genetic instability", "correct": true}, {"text": "Anchorage dependence", "correct": false}, {"text": "Normal differentiation", "correct": false}, {"text": "Reduced replication", "correct": false}, {"text": "Loss of angiogenesis", "correct": false}], "explanation": "Genetic instability allows mutations to accumulate; daughter cells can diverge into different subclones, producing tumour heterogeneity.", "thinking": true}, {"id": "C14", "area": "cancer", "type": "mcq", "prompt": "A tumour remains very small until it begins recruiting new blood vessels. Which tumour product is most directly associated with this process?", "options": [{"text": "Vascular endothelial growth factor (VEGF)", "correct": true}, {"text": "Autocrine motility factor (AMF)", "correct": false}, {"text": "Collagenase", "correct": false}, {"text": "Cadherin", "corr n body secretions and fluids, not only cervical samples.", "thinking": false}, {"id": "C66", "area": "cancer", "type": "mcq", "prompt": "A lung mass contains malignant cells, but routine microscopy cannot determine whether the cells originated in the lung or represent metastasis from another organ. Which method can help identify the primary origin?", "options": [{"text": "Immunohistochemistry using antibodies to cell products or surface markers", "correct": true}, {"text": "A tumour-marker blood test alone", "correct": false}, {"text": "A Pap test of unrelated cervical secretions", "correct": false}, {"text": "A bone mineral density measurement", "correct": false}, {"text": "A simple measurement of tumour diameter", "correct": false}], "explanation": "Immunohistochemistry uses antibodies to identify products or surface markers and can help determine the origin of malignant cells.", "thinking": false}, {"id": "C67", "area": "cancer", "type": "mcq", "prompt": "A breast tumour demonstrates abundant HER2 expression. Which treatment is specifically linked in the guide to this finding?", "options": [{"text": "Trastuzumab", "correct": true}, {"text": "Zoladex", "correct": false}, {"text": "Erythropoietin", "correct": false}, {"text": "A bisphosphonate", "correct": false}, {"text": "A hematopoietic growth factor", "correct": false}], "explanation": "Trastuzumab is described as a HER2 inhibitor and is relevant only when the tumour over-expresses HER2.", "thinking": false}, {"id": "C68", "area": "cancer", "type": "mcq", "prompt": "A clinician records a tumour's primary size/local extent, nearby lymph-node involvement, and distant metastasis. Which framework is being applied?", "options": [{"text": "TNM staging", "correct": true}, {"text": "Histological grading", "correct": false}, {"text": "The two-hit hypothesis", "correct": false}, {"text": "The cell-cycle growth fraction", "correct": false}, {"text": "The therapeutic index", "correct": false}], "explanation": "TNM records tumour size/local extent (T), nodes (N), and distant metastases (M).", "thinking": false}, {"id": "C69", "area": "cancer", "type": "mcq", "prompt": "A patient is found to have a tumour in the primary organ and demonstrable distant metastases. Which stage category best matches the guide?", "options": [{"text": "Stage IV", "correct": true}, {"text": "Stage 0", "correct": false}, {"text": "Stage I", "correct": false}, {"text": "Stage II", "correct": false}, {"text": "Stage III", "correct": false}], "explanation": "Stage IV indicates spread through blood or lymphatic systems to a distant site.", "thinking": false}, {"id": "C70", "area": "cancer", "type": "mcq", "prompt": "A family asks why stage is often more predictive of survival than histological grade. Which distinction is correct?", "options": [{"text": "Stage describes how far cancer has spread; grade describes how abnormal/aggressive the cells look", "correct": true}, {"text": "Stage describes cell appearance; grade describes distant metastasis", "correct": false}, {"text": "Both describe only the tumour's diameter", "correct": false}, {"text": "Grade uses TNM; stage uses only the number of mitoses", "correct": false}, {"text": "Stage and grade are interchangeable terms", "correct": false}], "explanation": "Stage measures spread and is identified as the biggest predictor of survival; grade reflects differentiation and mitotic activity.", "thinking": false}, {"id": "C71", "area": "cancer", "type": "mcq", "prompt": "A tumour contains highly pleomorphic cells with poor differentiation and numerous proliferating cells. Which histological grade pattern is most consistent?", "options": [{"text": "High grade, more aggressive disease", "correct": true}, {"text": "Low grade, highly differentiated disease", "correct": false}, {"text": "Stage 0 in situ by definition", "correct": false}, {"text": "Benign encapsulated growth", "correct": false}, {"text": "A non-neoplastic hematoma", "correct": false}], "explanation": "High-grade tumours are poorly differentiated/anaplastic, pleomorphic and more aggressive; grades range from 1 to 4.", "thinking": false}, {"id": "C72", "area": "cancer", "type": "mcq", "prompt": "A tumour is not visible on imaging until it reaches a very large number of cells. Which approximate clinical detection threshold is given in Lecture 7?", "options": [{"text": "1 billion cells (10^9)", "correct": true}, {"text": "100 cells", "correct": false}, {"text": "10,000 cells", "correct": false}, {"text": "1 million cells", "correct": false}, {"text": "1 trillion cells", "correct": false}], "explanation": "The guide lists approximately 1 billion cells as the clinical detection limit and 1 trillion cells as a generally lethal tumour burden.", "thinking": false}, {"id": "C73", "area": "cancer", "type": "mcq", "prompt": "A surgeon is considering whether surgery alone can cure a solid tumour. Which set of conditions is required in the Lecture 7 guide?", "options": [{"text": "The tumour is locally contained, has not metastasized, and can be removed with a large margin", "correct": true}, {"text": "The tumour has distant metastases but produces no pain", "correct": false}, {"text": "The tumour is high grade and cannot be completely removed", "correct": false}, {"text": "The tumour is detectable only by a tumour marker", "correct": false}, {"text": "The patient has completed one chemotherapy course", "correct": false}], "explanation": "Surgery can be curative for solid cancers when the tumour is locally contained, has not metastasized, and a large margin is removed.", "thinking": false}, {"id": "C74", "area": "cancer", "type": "mcq", "prompt": "A patient with a bulky tumour undergoes surgery to remove as much tumour mass as possible so that other treatments have a better chance of success. Which surgical purpose is this?", "options": [{"text": "De-bulking surgery", "correct": true}, {"text": "Palliative surgery for symptom relief only", "correct": false}, {"text": "Preventive surgery", "correct": false}, {"text": "Reconstructive surgery", "correct": false}, {"text": "Emergency surgery for perforation", "correct": false}], "explanation": "De-bulking removes as much tumour as possible to increase the likelihood that alternate therapies will work; palliation is for symptom relief.", "thinking": false}, {"id": "C75", "area": "cancer", "type": "mcq", "prompt": "A patient with widespread cancer is offered a combination of cytotoxic drugs. Which explanation best captures the rationale and treatment limitation described in the guides?", "options": [{"text": "Chemotherapy is systemic; combining agents can reduce resistance and permit smaller doses, but the therapeutic index is fairly low", "correct": true}, {"text": "Chemotherapy is local only and selectively kills cells that are not dividing", "correct": false}, {"text": "Combination treatment guarantees eradication after one dose and has no effect on normal tissue", "correct": false}, {"text": "Chemotherapy works only by blocking estrogen receptors", "correct": false}, {"text": "Chemotherapy prevents all later mutations by increasing tumour differentiation", "correct": false}], "explanation": "Chemotherapy is systemic and often combined to reduce resistance and allow smaller doses. Its therapeutic index is relatively low because normal cells are also harmed.", "thinking": false}, {"id": "M01", "area": "msk", "type": "mcq", "prompt": "A long-bone diagram labels the shaft between the two expanded ends. Which anatomical region is the shaft?", "options": [{"text": "Diaphysis", "correct": true}, {"text": "Epiphysis", "correct": false}, {"text": "Medullary cavity", "correct": false}, {"text": "Periosteum", "correct": false}, {"text": "Nutrient foramen", "correct": false}], "explanation": "The long-bone slide labels the shaft as the diaphysis and the expanded ends as epiphyses.", "thinking": false}, {"id": "M02", "area": "msk", "type": "mcq", "prompt": "A joint surface is described as being covered by a smooth layer at the end of a long bone. Which structure is identified in the long-bone diagram?", "options": [{"text": "Articular cartilage", "correct": true}, {"text": "Periosteum", "correct": false}, {"text": "Endosteum", "correct": false}, {"text": "Compact bone", "correct": false}, {"text": "Nutrient foramen", "correct": false}], "explanation": "The long-bone diagram labels articular cartilage at the ends of the bone where joint surfaces are formed.", "thinking": false}, {"id": "M04", "area": "msk", "type": "mcq", "prompt": "A bone specimen is being examined histologically. Which tissue is identified as the dense outer component of the long-bone diagram and shown in the compact-bone slides?", "options": [{"text": "Compact bone", "correct": true}, {"text": "Articular cartilage", "correct": false}, {"text": "Synovial membrane", "correct": false}, {"text": "Fibrocartilaginous callus", "correct": false}, {"text": "Periosteal exudate", "correct": false}], "explanation": "The lecture identifies compact bone as the dense bony tissue and shows its microscopic organization in the compact-bone slides.", "thinking": false}, {"id": "M05", "area": "msk", "type": "mcq", "prompt": "A patient is being assessed for a condition that changes the balance between bone resorption and formation. Which general process is the lecture's bone-remodelling slides illustrating?", "options": [{"text": "Ongoing removal and replacement of bone tissue", "correct": true}, {"text": "Conversion of cartilage directly into synovial fluid", "correct": false}, {"text": "Replacement of all bone with fibrous tissue after every injury", "correct": false}, {"text": "Formation of blood cells within articular cartilage", "correct": false}, {"text": "Loss of all bone turnover after skeletal maturity", "correct": false}], "explanation": "The slides identify bone remodelling and show microscopic examples of bone being resorbed and new bone being formed.", "thinking": false}, {"id": "M06", "area": "msk", "type": "mcq", "prompt": "A runner collides with a hard object. The skin remains intact, but bleeding and discoloration develop beneath it. Which injury is most likely?", "options": [{"text": "Contusion", "correct": true}, {"text": "Laceration", "correct": false}, {"text": "Sprain", "correct": false}, {"text": "Dislocation", "correct": false}, {"text": "Subluxation", "correct": false}], "explanation": "A contusion is blunt-force trauma in which the overlying skin remains intact while hemorrhage occurs below the surface.", "thinking": false}, {"id": "M07", "area": "msk", "type": "mcq", "prompt": "Several hours after a contusion, a patient develops a larger localized collection of blood at the injury site. Which term best describes this finding?", "options": [{"text": "Hematoma", "correct": true}, {"text": "Laceration", "correct": false}, {"text": "Strain", "correct": false}, {"text": "Subluxation", "correct": false}, {"text": "Torus fracture", "correct": false}], "explanation": "A hematoma is a collection of blood at a contusion site due to a larger local hemorrhage.", "thinking": true}, {"id": "M08", "area": "msk", "type": "mcq", "prompt": "A patient sustains a wound in which the skin itself is torn rather than remaining intact over an area of bleeding. Which soft-tissue injury is present?", "options": [{"text": "Laceration", "correct": true}, {"text": "Contusion", "correct": false}, {"text": "Hematoma", "correct": false}, {"text": "Strain", "correct": false}, {"text": "Sprain", "correct": false}], "explanation": "The lecture defines a laceration as an injury in which the skin is torn.", "thinking": false}, {"id": "M09", "area": "msk", "type": "mcq", "prompt": "A patient develops pain and stiffness after an unusual muscle contraction. Examination suggests a stretching injury involving muscle or tendon, with relatively limited swelling. Which injury is most likely?", "options": [{"text": "Strain", "correct": true}, {"text": "Sprain", "correct": false}, {"text": "Dislocation", "correct": false}, {"text": "Subluxation", "correct": false}, {"text": "Contusion", "correct": false}], "explanation": "A strain involves stretching of a muscle or tendon, often from unusual contraction or forcible stretching; symptoms may be milder than a sprain.", "thinking": true}, {"id": "M10", "area": "msk", "type": "mcq", "prompt": "A patient twists an ankle and later has persistent pain and swelling. The injured support structure is a ligament rather than a muscle or tendon. Which diagnosis fits?", "options": [{"text": "Sprain", "correct": true}, {"text": "Strain", "correct": false}, {"text": "Contusion", "correct": false}, {"text": "Laceration", "correct": false}, {"text": "Hematoma", "correct": false}], "explanation": "A sprain is a stretching injury of a ligament; pain and swelling can take longer to subside than with a strain.", "thinking": true}, {"id": "M13", "area": "msk", "type": "mcq", "prompt": "A patient has pain, deformity, and severely limited movement after substantial trauma. Imaging shows the two bone surfaces in the joint have lost contact entirely. What is the injury?", "options": [{"text": "Dislocation", "correct": true}, {"text": "Subluxation", "correct": false}, {"text": "Sprain", "correct": false}, {"text": "Strain", "correct": false}, {"text": "Contusion", "correct": false}], "explanation": "A dislocation is loss of articulation between two bones, with the bone surfaces losing contact entirely.", "thinking": true}, {"id": "M14", "area": "msk", "type": "mcq", "prompt": "A vertebral joint is described as having partial loss of contact between articulating surfaces rather than complete separation. Which term applies?", "options": [{"text": "Subluxation", "correct": true}, {"text": "Dislocation", "correct": false}, {"text": "Sprain", "correct": false}, {"text": "Strain", "correct": false}, {"text": "Laceration", "correct": false}], "explanation": "A subluxation is a partial loss of contact between joint surfaces, described as a mild or partial dislocation.", "thinking": true}, {"id": "M15", "area": "msk", "type": "mcq", "prompt": "A radiograph shows a discontinuity in bone after an applied force exceeded the bone's compressive strength. Which general injury category is this?", "options": [{"text": "Fracture", "correct": true}, {"text": "Sprain", "correct": false}, {"text": "Strain", "correct": false}, {"text": "Contusion", "correct": false}, {"text": "Subluxation", "correct": false}], "explanation": "The lecture defines a fracture as any discontinuity or break in bone caused by force exceeding its compressive strength.", "thinking": false}, {"id": "M16", "area": "msk", "type": "mcq", "prompt": "A fracture passes through the shaft and produces exactly two principal fragments without intermediate pieces. Which severity classification best fits?", "options": [{"text": "Simple (non-comminuted)", "correct": true}, {"text": "Comminuted", "correct": false}, {"text": "Impacted", "correct": false}, {"text": "Depressed", "correct": false}, {"text": "Avulsion", "correct": false}], "explanation": "A simple fracture is a single linear disruption that delimits two fragments; comminuted fractures have several intermediate fragments.", "thinking": true}, {"id": "M18", "area": "msk", "type": "mcq", "prompt": "An open wound communicates with a fractured bone after a fall. Which classification describes the skin status?", "options": [{"text": "Open (compound/communicating)", "correct": true}, {"text": "Closed (noncommunicating)", "correct": false}, {"text": "Stable", "correct": false}, {"text": "Impacted", "correct": false}, {"text": "Linear", "correct": false}], "explanation": "An open fracture has disrupted skin and communicates with the external environment; a closed fracture has intact skin.", "thinking": true}, {"id": "M19", "area": "msk", "type": "mcq", "prompt": "A fracture line runs at a right angle to the bone's longitudinal axis. Which orientation is present?", "options": [{"text": "Transverse", "correct": true}, {"text": "Oblique", "correct": false}, {"text": "Linear", "correct": false}, {"text": "Spiral", "correct": false}, {"text": "Depressed", "correct": false}], "explanation": "A transverse fracture runs perpendicular to the longitudinal axis of the bone.", "thinking": false}, {"id": "M20", "area": "msk", "type": "mcq", "prompt": "A fracture line crosses the bone diagonally at an angle to its long axis. Which orientation is most accurate?", "options": [{"text": "Oblique", "correct": true}, {"text": "Transverse", "correct": false}, {"text": "Linear", "correct": false}, {"text": "Spiral", "correct": false}, {"text": "Impacted", "correct": false}], "explanation": "An oblique fracture runs at an angle to the bone's longitudinal axis.", "thinking": false}, {"id": "M21", "area": "msk", "type": "mcq", "prompt": "A fracture line follows the length of the bone rather than crossing it. Which orientation does this represent?", "options": [{"text": "Linear (longitudinal)", "correct": true}, {"text": "Transverse", "correct": false}, {"text": "Oblique", "correct": false}, {"text": "Spiral", "correct": false}, {"text": "Depressed", "correct": false}], "explanation": "A linear or longitudinal fracture runs along the length of the bone.", "thinking": false}, {"id": "M22", "area": "msk", "type": "mcq", "prompt": "A twisting injury produces a fracture line that winds around the fibula. Which pattern is most likely?", "options": [{"text": "Spiral", "correct": true}, {"text": "Linear", "correct": false}, {"text": "Transverse", "correct": false}, {"text": "Depressed", "correct": false}, {"text": "Torus", "correct": false}], "explanation": "A spiral fracture follows a spiral course around the bone; the slide identifies a spiral fibular fracture.", "thinking": true}, {"id": "M25", "area": "msk", "type": "mcq", "prompt": "A radiograph shows two broken bone fragments driven into one another. Which fracture type is present?", "options": [{"text": "Impacted", "correct": true}, {"text": "Depressed", "correct": false}, {"text": "Displaced", "correct": false}, {"text": "Greenstick", "correct": false}, {"text": "Bowing", "correct": false}], "explanation": "An impacted fracture is one in which the fragments are driven into each other.", "thinking": false}, {"id": "M26", "area": "msk", "type": "mcq", "prompt": "A patient sustains a skull injury. Imaging shows bone fragments pushed inward toward the cranial cavity. Which classification is most precise?", "options": [{"text": "Depressed fracture", "correct": true}, {"text": "Impacted fracture", "correct": false}, {"text": "Spiral fracture", "correct": false}, {"text": "Torus fracture", "correct": false}, {"text": "Avulsion fracture", "correct": false}], "explanation": "A depressed fracture has bone fragments driven inward and is commonly associated with the skull.", "thinking": false}, {"id": "M27", "area": "msk", "type": "mcq", "prompt": "A child sustains a fall and the distal radius cortex buckles at the injury site without a complete break. Which incomplete fracture pattern is most likely?", "options": [{"text": "Torus (buckle)", "correct": true}, {"text": "Greenstick", "correct": false}, {"text": "Bowing", "correct": false}, {"text": "Avulsion", "correct": false}, {"text": "Pott's", "correct": false}], "explanation": "A torus fracture is a buckle fracture in which the bone buckles at the fracture site.", "thinking": true}, {"id": "M28", "area": "msk", "type": "mcq", "prompt": "A child's forearm bone bends after trauma and has associated microfractures, but no complete break is seen. Which incomplete pattern is described?", "options": [{"text": "Bowing fracture", "correct": true}, {"text": "Torus fracture", "correct": false}, {"text": "Displaced fracture", "correct": false}, {"text": "Comminuted fracture", "correct": false}, {"text": "Colle's fracture", "correct": false}], "explanation": "A bowing fracture is a bend in the bone with associated microfractures.", "thinking": false}, {"id": "M29", "area": "msk", "type": "mcq", "prompt": "A child's radiograph shows a crack through one side of the cortex with splintering of the spongy bone. Which pattern is most likely?", "options": [{"text": "Greenstick fracture", "correct": true}, {"text": "Torus fracture", "correct": false}, {"text": "Bowing fracture", "correct": false}, {"text": "Impacted fracture", "correct": false}, {"text": "Depressed fracture", "correct": false}], "explanation": "A greenstick fracture is incomplete: one side of the cortex is cracked and spongy bone is splintered; it is common in children.", "thinking": true}, {"id": "M30", "area": "msk", "type": "mcq", "prompt": "A tendon or ligament is torn away from its attachment and pulls a fragment of bone with it. Which fracture type is this?", "options": [{"text": "Avulsion", "correct": true}, {"text": "Torus", "correct": false}, {"text": "Bowing", "correct": false}, {"text": "Simple", "correct": false}, {"text": "Depressed", "correct": false}], "explanation": "An avulsion fracture involves separation of a bone fragment where a tendon or ligament is attached.", "thinking": true}, {"id": "M31", "area": "msk", "type": "mcq", "prompt": "A post-trauma radiograph shows that the bone fragments are no longer anatomically aligned. Which term should be used?", "options": [{"text": "Displaced", "correct": true}, {"text": "Stable", "correct": false}, {"text": "Impacted", "correct": false}, {"text": "Linear", "correct": false}, {"text": "Incomplete", "correct": false}], "explanation": "A displaced fracture has fragments that are not anatomically aligned.", "thinking": false}, {"id": "M32", "area": "msk", "type": "mcq", "prompt": "A runner develops localized tenderness and swelling after repeated low-impact activity, without one sufficient traumatic event. Symptoms improve when activity stops. Which fracture category best fits?", "options": [{"text": "Stress fracture", "correct": true}, {"text": "Pathologic fracture", "correct": false}, {"text": "Depressed fracture", "correct": false}, {"text": "Open fracture", "correct": false}, {"text": "Dislocation", "correct": false}], "explanation": "Stress fractures are usually microfractures from repeated low-impact stress and are painful with localized tenderness/swelling that improves when activity ceases.", "thinking": true}, {"id": "M33", "area": "msk", "type": "mcq", "prompt": "A recruit starts an unusually intense repetitive training program. Muscle mass and force increase before bone strength adapts, and microfractures develop in otherwise normal bone. Which subtype is this?", "options": [{"text": "Fatigue fracture", "correct": true}, {"text": "Insufficiency fracture", "correct": false}, {"text": "Pathologic fracture", "correct": false}, {"text": "Avulsion fracture", "correct": false}, {"text": "Impacted fracture", "correct": false}], "explanation": "A fatigue fracture results from abnormal or repetitive activity acting on otherwise normal bone.", "thinking": true}, {"id": "M34", "area": "msk", "type": "mcq", "prompt": "An older patient develops a fracture during ordinary activity because the bone has lost strength and remodeling capacity. Which subtype is most consistent?", "options": [{"text": "Insufficiency fracture", "correct": true}, {"text": "Fatigue fracture", "correct": false}, {"text": "Spiral fracture", "correct": false}, {"text": "Avulsion fracture", "correct": false}, {"text": "Torus fracture", "correct": false}], "explanation": "An insufficiency fracture occurs when normal activity acts on abnormal, weakened bone.", "thinking": true}, {"id": "M35", "area": "msk", "type": "mcq", "prompt": "A patient with a pre-existing bone tumour sustains a fracture through the weakened area after minimal trauma. Which fracture category applies?", "options": [{"text": "Pathologic fracture", "correct": true}, {"text": "Fatigue fracture", "correct": false}, {"text": "Simple fracture", "correct": false}, {"text": "Torus fracture", "correct": false}, {"text": "Transverse fracture", "correct": false}], "explanation": "A pathologic fracture occurs through bone weakened by a pre-existing abnormality or disease, including a tumour.", "thinking": true}, {"id": "M36", "area": "msk", "type": "mcq", "prompt": "A person falls onto an outstretched hand and sustains a fracture of the distal radius, with possible associated distal ulna involvement. Which named fracture is this?", "options": [{"text": "Colle's fracture", "correct": true}, {"text": "Pott's fracture", "correct": false}, {"text": "Greenstick fracture", "correct": false}, {"text": "Avulsion fracture", "correct": false}, {"text": "Depressed fracture", "correct": false}], "explanation": "Colle's fracture involves the distal radius, often with the ulna, classically after a fall onto an outstretched hand.", "thinking": false}, {"id": "M37", "area": "msk", "type": "mcq", "prompt": "A patient steps down forcefully and sustains a fracture involving the lower fibula and tibia at the ankle. Which named fracture is most likely?", "options": [{"text": "Pott's fracture", "correct": true}, {"text": "Colle's fracture", "correct": false}, {"text": "Bowing fracture", "correct": false}, {"text": "Torus fracture", "correct": false}, {"text": "Greenstick fracture", "correct": false}], "explanation": "Pott's fracture involves the lower fibula and often tibia after excessive force at the ankle.", "thinking": false}, {"id": "M41", "area": "msk", "type": "mcq", "prompt": "Immediately after a fracture, blood from bone and surrounding soft tissue collects at the site. Which healing stage is occurring?", "options": [{"text": "Hematoma formation (procallus)", "correct": true}, {"text": "Fibrocartilaginous callus formation", "correct": false}, {"text": "Bony callus formation", "correct": false}, {"text": "Remodeling", "correct": false}, {"text": "Union", "correct": false}], "explanation": "The first stage is hematoma formation during approximately the first week; the organized granulation tissue becomes the procallus.", "thinking": false}, {"id": "M42", "area": "msk", "type": "mcq", "prompt": "Two weeks after a fracture, fibroblasts, cartilage, and woven bone bridge the broken fragments. The patient is told the area is not yet strong enough to bear weight. Which stage is this?", "options": [{"text": "Fibrocartilaginous callus formation", "correct": true}, {"text": "Hematoma formation", "correct": false}, {"text": "Bony callus formation", "correct": false}, {"text": "Remodeling", "correct": false}, {"text": "Malunion", "correct": false}], "explanation": "The fibrocartilaginous callus forms during approximately weeks 1-3 and connects fragments, but it is not yet strong enough to bear weight.", "thinking": true}, {"id": "M43", "area": "msk", "type": "mcq", "prompt": "Several weeks after a fracture, the fibrocartilaginous tissue begins to ossify and forms a bony sheath that eventually becomes spongy bone. Which stage is occurring?", "options": [{"text": "Bony callus formation", "correct": true}, {"text": "Hematoma formation", "correct": false}, {"text": "Fibrocartilaginous callus formation", "correct": false}, {"text": "Remodeling", "correct": false}, {"text": "Nonunion", "correct": false}], "explanation": "Bony callus formation begins around week 3+ as fibrocartilaginous tissue ossifies and becomes spongy bone.", "thinking": false}, {"id": "M44", "area": "msk", "type": "mcq", "prompt": "Months after a fracture, the temporary spongy bone is being replaced by compact bone and excess material is removed. Which healing phase is underway?", "options": [{"text": "Remodeling", "correct": true}, {"text": "Hematoma formation", "correct": false}, {"text": "Fibrocartilaginous callus formation", "correct": false}, {"text": "Bony callus formation", "correct": false}, {"text": "Delayed union", "correct": false}], "explanation": "During remodeling, compact bone replaces spongy bone and excess material is removed; this can continue for months to years.", "thinking": false}, {"id": "M45", "area": "msk", "type": "mcq", "prompt": "A displaced fracture is treated so the bone ends are realigned, then held still with a cast. Which two treatment principles are being used?", "options": [{"text": "Reduction and immobilization", "correct": true}, {"text": "Traction and seeding", "correct": false}, {"text": "Debulking and palliation", "correct": false}, {"text": "Opsonization and phagocytosis", "correct": false}, {"text": "Osteolysis and ankylosis", "correct": false}], "explanation": "The slides describe reduction (realigning) and immobilization using a splint, cast, traction, or fixation.", "thinking": true}, {"id": "M46", "area": "msk", "type": "mcq", "prompt": "A fracture is difficult to maintain in alignment because surrounding tissues exert tension. A pulling force is applied to counteract that tension and maintain alignment while reducing muscle spasm. Which method is being used?", "options": [{"text": "Traction", "correct": true}, {"text": "Kyphoplasty", "correct": false}, {"text": "Arthrocentesis", "correct": false}, {"text": "Palliation", "correct": false}, {"text": "Bone graft resorption", "correct": false}], "explanation": "Traction applies a pulling force to counteract tissue tension, maintain alignment, reduce joint pressure and muscle spasm, and immobilize.", "thinking": true}, {"id": "M47", "area": "msk", "type": "mcq", "prompt": "A surgeon inserts a device directly into the body to stabilize and align a fractured bone. Which fixation method is described?", "options": [{"text": "Internal fixation", "correct": true}, {"text": "External fixation", "correct": false}, {"text": "Traction only", "correct": false}, {"text": "Casting only", "correct": false}, {"text": "Reduction without fixation", "correct": false}], "explanation": "Internal fixation devices are inserted surgically to stabilize and maintain bone alignment.", "thinking": false}, {"id": "M49", "area": "msk", "type": "mcq", "prompt": "A patient has ongoing bleeding from a major fracture. Blood loss becomes severe enough to compromise circulating volume. Which complication is emphasized in the lecture?", "options": [{"text": "Hypovolemic shock", "correct": true}, {"text": "Pannus formation", "correct": false}, {"text": "Hypercalcemia", "correct": false}, {"text": "Joint effusion", "correct": false}, {"text": "Cachexia", "correct": false}], "explanation": "The fracture-complications slide lists hemorrhage leading to hypovolemic shock.", "thinking": true}, {"id": "M50", "area": "msk", "type": "mcq", "prompt": "Months after a fracture, the bone ends have failed to grow together and the gap has filled with dense fibrous or cartilaginous tissue. What is this complication?", "options": [{"text": "Nonunion", "correct": true}, {"text": "Delayed union", "correct": false}, {"text": "Malunion", "correct": false}, {"text": "Normal remodeling", "correct": false}, {"text": "Impacted fracture", "correct": false}], "explanation": "Nonunion is failure of the bone ends to grow together; the gap may fill with dense fibrous or cartilaginous tissue.", "thinking": false}, {"id": "M53", "area": "msk", "type": "mcq", "prompt": "A 68-year-old patient sustains a hip fracture after minimal trauma. Bone imaging shows reduced mineralized bone and structural integrity. Which disorder best explains the fragility?", "options": [{"text": "Osteoporosis", "correct": true}, {"text": "Osteomalacia", "correct": false}, {"text": "Paget disease", "correct": false}, {"text": "Osteomyelitis", "correct": false}, {"text": "Osteoarthritis", "correct": false}], "explanation": "Osteoporosis is a metabolic bone disease with reduced bone density and structural integrity, predisposing to fractures with minimal trauma.", "thinking": false}, {"id": "M54", "area": "msk", "type": "mcq", "prompt": "A patient with osteoporosis has increased activation of remodeling sites, increased bone resorption, and reduced bone formation. Which imbalance explains the loss of bone density?", "options": [{"text": "Resorption exceeds formation", "correct": true}, {"text": "Formation exceeds resorption", "correct": false}, {"text": "Mineralization is delayed but total bone mass rises", "correct": false}, {"text": "Cartilage is replaced by synovial fluid", "correct": false}, {"text": "Bone turnover stops completely", "correct": false}], "explanation": "The osteoporosis slides describe increased resorption and reduced formation, with more remodeling activation sites and slower remodeling.", "thinking": false}, {"id": "M55", "area": "msk", "type": "mcq", "prompt": "A postmenopausal patient has osteoporosis. Which explanation for the higher prevalence in women is consistent with the lecture?", "options": [{"text": "Declining estrogen after menopause, lower starting bone density, and often less weight-bearing exercise contribute", "correct": true}, {"text": "Women have more testosterone and therefore more bone resorption", "correct": false}, {"text": "Men lose all bone density after puberty", "correct": false}, {"text": "Osteoporosis is caused only by bacterial infection", "correct": false}, {"text": "The condition is caused by excess uric acid", "correct": false}], "explanation": "The lecture lists hormonal changes after menopause, lower starting bone density in women, and differences in weight-bearing activity as contributing reasons.", "thinking": false}, {"id": "M56", "area": "msk", "type": "mcq", "prompt": "A patient with long-standing osteoporosis presents with height loss, kyphosis, and pain after vertebral compression fractures. Which statement best matches the slide's description of when manifestations become apparent?", "options": [{"text": "Manifestations may only become evident late in the disease, often after fracture", "correct": true}, {"text": "Symptoms are always severe at the beginning of bone loss", "correct": false}, {"text": "Osteoporosis always causes fever before fractures", "correct": false}, {"text": "The first sign is a purulent discharge from bone", "correct": false}, {"text": "The disease is limited to the synovial membrane", "correct": false}], "explanation": "The slides note that osteoporosis is often observed late in its course, commonly after fractures, with deformity, kyphosis and height loss.", "thinking": false}, {"id": "M57", "area": "msk", "type": "mcq", "prompt": "A patient has diffuse skeletal tenderness, hip and back discomfort, muscle weakness, a waddling gait, and poorly mineralized osteoid. Which disorder is most likely?", "options": [{"text": "Osteomalacia", "correct": true}, {"text": "Osteoporosis", "correct": false}, {"text": "Paget disease", "correct": false}, {"text": "Osteomyelitis", "correct": false}, {"text": "Rheumatoid arthritis", "correct": false}], "explanation": "Osteomalacia is inadequate or delayed mineralization of osteoid, often linked to vitamin D deficiency and producing skeletal tenderness and muscle weakness.", "thinking": false}, {"id": "M58", "area": "msk", "type": "mcq", "prompt": "A child has defective mineralization of developing bone and cartilage, with skeletal deformity. Which term is used for the childhood form of osteomalacia in the lecture?", "options": [{"text": "Rickets", "correct": true}, {"text": "Paget disease", "correct": false}, {"text": "Osteoporosis", "correct": false}, {"text": "Osteomyelitis", "correct": false}, {"text": "Gout", "correct": false}], "explanation": "The slides identify rickets as the childhood form associated with inadequate and delayed mineralization.", "thinking": false}, {"id": "M59", "area": "msk", "type": "mcq", "prompt": "An adult with vitamin D deficiency develops hypocalcemia and poorly mineralized osteoid. Which treatment direction is identified in the lecture, alongside addressing any underlying malabsorption or renal problem?", "options": [{"text": "Calcium and vitamin D", "correct": true}, {"text": "Low-purine diet and urate-lowering drugs", "correct": false}, {"text": "Only immobilization and traction", "correct": false}, {"text": "Estrogen suppression and trastuzumab", "correct": false}, {"text": "Antibiotics for six weeks in every case", "correct": false}], "explanation": "The osteomalacia slides recommend dietary calcium and vitamin D and treating secondary causes such as malabsorption or renal tubular disorders.", "thinking": false}, {"id": "M60", "area": "msk", "type": "mcq", "prompt": "A patient has localized areas of excessive bone resorption followed by disorganized osteoid formation. The affected bone expands, becomes more vascular and fragile, and may bow. Which disorder is most likely?", "options": [{"text": "Paget disease of bone", "correct": true}, {"text": "Osteoporosis", "correct": false}, {"text": "Osteomalacia", "correct": false}, {"text": "Osteoarthritis", "correct": false}, {"text": "Osteomyelitis", "correct": false}], "explanation": "Paget disease involves focal excessive resorption and disorganized bone formation, producing enlarged, softer, more vascular and fragile bone.", "thinking": false}, {"id": "M61", "area": "msk", "type": "mcq", "prompt": "A patient with Paget disease has an abnormally prominent forehead, skull thickening, and an elevated blood marker used by osteoblasts. Which test finding is most consistent with the slides?", "options": [{"text": "Elevated alkaline phosphatase", "correct": true}, {"text": "Decreased rheumatoid factor", "correct": false}, {"text": "Elevated serum uric acid only", "correct": false}, {"text": "Low HER2 expression", "correct": false}, {"text": "Reduced tumour markers", "correct": false}], "explanation": "The Paget slides identify elevated alkaline phosphatase on blood testing and show skull thickening/bossing.", "thinking": false}, {"id": "M62", "area": "msk", "type": "mcq", "prompt": "A patient with Paget disease has enlarged bone that is softer and disorganized. Which complication is specifically noted as a possible long-term consequence?", "options": [{"text": "Increased likelihood of osteosarcoma", "correct": true}, {"text": "HPV-associated cervical cancer", "correct": false}, {"text": "Pancytopenia from chemotherapy", "correct": false}, {"text": "Systemic lupus erythematosus", "correct": false}, {"text": "Hematoma formation outside the circulation", "correct": false}], "explanation": "The lecture lists increased likelihood of osteosarcoma among the complications of Paget disease.", "thinking": false}, {"id": "M63", "area": "msk", "type": "mcq", "prompt": "A child develops fever, fatigue, anorexia, and localized bone tenderness after an infection elsewhere in the body. Bloodborne spread of bacteria seeds the bone. Which disorder is most likely?", "options": [{"text": "Osteomyelitis", "correct": true}, {"text": "Osteoporosis", "correct": false}, {"text": "Osteomalacia", "correct": false}, {"text": "Paget disease", "correct": false}, {"text": "Osteoarthritis", "correct": false}], "explanation": "Osteomyelitis is a severe bacterial infection of bone; endogenous infection can spread from another site through the blood.", "thinking": false}, {"id": "CS01", "area": "cancer", "type": "sata", "prompt": "A tumour specimen and family history are being reviewed. Which statements are consistent with the cancer genetics and classification material (SELECT ALL THAT APPLY)", "options": [{"text": "A proto-oncogene normally stimulates cell growth and can become an overactive oncogene", "correct": true}, {"text": "A gain-of-function oncogene mutation generally requires only one mutated copy", "correct": true}, {"text": "A tumour suppressor generally requires both copies to be lost before its STOP function fails", "correct": true}, {"text": "Inherited BRCA1 mutations can increase breast and ovarian cancer risk", "correct": true}, {"text": "A somatic mutation in an ordinary body cell is automatically passed to offspring", "correct": false}], "explanation": "Proto-oncogenes are normal GO genes; one gain-of-function mutation can activate them. Tumour suppressors require loss of both copies. Germinal, not somatic, mutations are inherited.", "thinking": true}, {"id": "CS02", "area": "cancer", "type": "sata", "prompt": "A patient is being counselled about exposures and infection-associated cancer risks. Which statements match the Lecture 7 study guide (SELECT ALL THAT APPLY)", "options": [{"text": "Procarcinogens require metabolic conversion before they become carcinogenic", "correct": true}, {"text": "Chemical carcinogenesis is commonly dose dependent and may be delayed for years", "correct": true}, {"text": "HBV is associated with primary liver cancer and spreads through blood and bodily fluids", "correct": true}, {"text": "HPV is typically spread through sexual contact and is strongly linked to cervical and anal cancers", "correct": true}, {"text": "H. pylori is a virus that is mainly transmitted through blood transfusion", "correct": false}], "explanation": "The guide distinguishes direct-reactive agents from procarcinogens, describes dose-dependent delayed effects, and links HBV, HPV and H. pylori with specific routes and cancers.", "thinking": true}, {"id": "CS03", "area": "cancer", "type": "sata", "prompt": "A patient with advanced cancer has systemic manifestations and abnormal blood counts. Which statements are accurate according to Lecture 7 (SELECT ALL THAT APPLY)", "options": [{"text": "Fatigue is the most common symptom and may not improve with sleep", "correct": true}, {"text": "Cachexia can involve muscle and fat loss even when food intake is unchanged or increased", "correct": true}, {"text": "Low red blood cells are described as anemia", "correct": true}, {"text": "Low white blood cells increase infection risk", "correct": true}, {"text": "Tumour-derived ADH is associated with Cushing syndrome", "correct": false}], "explanation": "The guide identifies fatigue, cachexia, anemia and leukopenia as important manifestations. ADH is associated with SIADH, whereas ACTH is associated with Cushing syndrome.", "thinking": true}, {"id": "MS01", "area": "msk", "type": "sata", "prompt": "A fracture is being classified from imaging and clinical history. Which statements correctly match the lecture's fracture terminology (SELECT ALL THAT APPLY)", "options": [{"text": "An open fracture has disrupted skin and communicates with the outside", "correct": true}, {"text": "A comminuted fracture contains several intermediate fragments", "correct": true}, {"text": "An impacted fracture has fragments driven into each other", "correct": true}, {"text": "A displaced fracture has fragments that are no longer anatomically aligned", "correct": true}, {"text": "A transverse fracture runs along the length of the bone", "correct": false}], "explanation": "Open/closed describes skin integrity; comminuted describes multiple fragments; impacted describes fragments driven together; displaced describes loss of anatomical alignment. Transverse is perpendicular to the long axis.", "thinking": true}, {"id": "MS02", "area": "msk", "type": "sata", "prompt": "A patient is assessed after a suspected fracture and later through healing. Which statements match the fracture-healing sequence in the slides (SELECT ALL THAT APPLY)", "options": [{"text": "Hematoma/procallus formation occurs during approximately the first week", "correct": true}, {"text": "Fibrocartilaginous callus bridges fragments during approximately weeks 1-3", "correct": true}, {"text": "The fibrocartilaginous callus is initially strong enough for unrestricted weight-bearing", "correct": false}, {"text": "Bony callus forms as the fibrocartilaginous tissue ossifies", "correct": true}, {"text": "Remodeling replaces spongy bone with compact bone and removes excess material", "correct": true}], "explanation": "The sequence is hematoma/procallus, fibrocartilaginous callus, bony callus, and remodeling. The fibrocartilaginous callus is not yet strong enough to bear weight.", "thinking": true}, {"id": "MS03", "area": "msk", "type": "sata", "prompt": "A patient with joint pain is being evaluated for osteoarthritis, rheumatoid arthritis, or gout. Which statements are supported by the MSK lecture (SELECT ALL THAT APPLY)", "options": [{"text": "Osteoarthritis is characterized primarily by loss and breakdown of articular cartilage", "correct": true}, {"text": "Rheumatoid arthritis begins with autoimmune inflammation of the synovial membrane", "correct": true}, {"text": "Pannus in rheumatoid arthritis can extend onto cartilage and underlying bone and destroy them", "correct": true}, {"text": "Gout involves urate crystals that attract white blood cells and can trigger inflammatory damage", "correct": true}, {"text": "Osteoarthritis is defined by systemic autoimmune inflammation and rheumatoid factor", "correct": false}], "explanation": "The lecture contrasts cartilage breakdown in osteoarthritis with autoimmune synovitis and pannus in rheumatoid arthritis, and urate-crystal-driven inflammation in gout.", "thinking": true}, {"id": "CS04", "area": "cancer", "type": "sata", "prompt": "A diagnostic work-up is underway for a suspected primary cancer. Which statements are accurate (SELECT ALL THAT APPLY)", "options": [{"text": "Screening aims to identify cancer in an otherwise asymptomatic person", "correct": true}, {"text": "Biopsy with microscopic identification is the definitive diagnostic approach described", "correct": true}, {"text": "Immunohistochemistry uses antibodies to help identify cellular origin or markers", "correct": true}, {"text": "TNM staging describes tumour extent, lymph nodes, and distant metastasis", "correct": true}, {"text": "A tumour marker is a universal test that definitively diagnoses every cancer", "correct": false}], "explanation": "Screening is secondary prevention; biopsy and microscopy provide definitive diagnosis; IHC helps identify origin; TNM records T, N and M. No universal tumour marker exists.", "thinking": true}, {"id": "CS05", "area": "cancer", "type": "sata", "prompt": "A multidisciplinary team plans treatment for a patient with a solid tumour. Which statements match Lecture 7 (SELECT ALL THAT APPLY)", "options": [{"text": "Surgery may be curative when the tumour is contained, has not metastasized, and a large margin can be removed", "correct": true}, {"text": "De-bulking removes as much tumour as possible to support other therapies", "correct": true}, {"text": "Palliative surgery is intended to relieve symptoms such as pain or obstruction rather than cure", "correct": true}, {"text": "Radiation damages molecules and DNA through ionization and free-radical formation", "correct": true}, {"text": "Radiation can distinguish malignant cells from all rapidly dividing healthy cells", "correct": false}], "explanation": "The guide distinguishes curative surgery, de-bulking and palliation. Radiation damages DNA via ionization/free radicals but also affects rapidly dividing healthy cells in the treated area.", "thinking": true}, {"id": "CS06", "area": "cancer", "type": "sata", "prompt": "A patient is receiving systemic cancer treatment. Which statements about chemotherapy, hormone therapy, and biotherapy are correct (SELECT ALL THAT APPLY)", "options": [{"text": "Chemotherapy is systemic and is used for widespread or high-risk microscopic disease", "correct": true}, {"text": "Combination chemotherapy can reduce resistance and allow smaller doses", "correct": true}, {"text": "Exponential killing means each course kills the same percentage rather than the same absolute number of cells", "correct": true}, {"text": "Hormone therapy may slow hormone-responsive breast or endometrial tumour growth by altering the hormonal environment", "correct": true}, {"text": "Interferons are described as anti-angiogenic and pro-apoptotic", "correct": true}], "explanation": "The guide describes systemic combination chemotherapy, percentage-based exponential killing, hormone manipulation in responsive tumours, and interferon properties including anti-angiogenic and pro-apoptotic effects.", "thinking": true}, {"id": "MS04", "area": "msk", "type": "sata", "prompt": "A patient with weakened bone is being assessed for metabolic or focal bone disease. Which statements match the MSK slides (SELECT ALL THAT APPLY)", "options": [{"text": "Osteoporosis involves reduced bone density and structural integrity and predisposes to fractures with minimal trauma", "correct": true}, {"text": "Osteomalacia involves inadequate or delayed mineralization of osteoid and is commonly linked to vitamin D deficiency", "correct": true}, {"text": "Paget disease involves focal excessive resorption followed by disorganized bone formation", "correct": true}, {"text": "Paget disease can produce softer, more vascular, fragile and enlarged bone", "correct": true}, {"text": "Osteoporosis is primarily a bacterial infection that fills bone canaliculi with purulent exudate", "correct": false}], "explanation": "The slides distinguish low-density fragile bone in osteoporosis, poor osteoid mineralization in osteomalacia, and focal disorganized remodeling in Paget disease.", "thinking": true}, {"id": "MS05", "area": "msk", "type": "sata", "prompt": "A patient is being assessed for suspected osteomyelitis. Which statements are consistent with the MSK slides (SELECT ALL THAT APPLY)", "options": [{"text": "Staphylococcus aureus is identified as a common cause", "correct": true}, {"text": "Endogenous infection can spread to bone through blood from another site", "correct": true}, {"text": "Exogenous infection can enter through an open wound, compound fracture, bite, or surgery", "correct": true}, {"text": "Purulent exudate can compromise blood supply and lead to bone necrosis", "correct": true}, {"text": "Because bone expands easily, the infection usually causes no pressure beneath the periosteum", "correct": false}], "explanation": "The slides describe S. aureus as common, distinguish endogenous bloodborne from exogenous entry, and explain that limited room for swelling can force exudate beneath the periosteum and compromise blood supply.", "thinking": true}, {"id"     let currentFilter = 'all';
    let shuffledQuestions = [];
    let activeQuestions = [];
    const userState = new Map();

    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function buildShuffledQuestionSet() {
      shuffledQuestions = shuffleArray(questionBank.map(q => ({
        ...q,
        options: shuffleArray(q.options.map(o => ({...o})))
      })));
    }

    function setActiveQuestions(filter) {
      currentFilter = filter;
      activeQuestions = filter === 'all'
        ? [...shuffledQuestions]
        : shuffledQuestions.filter(q => q.area === filter);
    }

    function updateScore() {
      let submittedCount = 0;
      let totalScore = 0;
      userState.forEach(state => {
        if (state.submitted) { submittedCount++; totalScore += state.score; }
      });
      const grade = submittedCount ? Math.round((totalScore / submittedCount) * 100) : 0;
      const scoreElem = document.getElementById('score-counter');
      scoreElem.textContent = `Grade: ${grade}%`;
      scoreElem.title = `Submitted ${submittedCount} / ${questionBank.length} questions`;
    }

    function filterQuestions(filter, button) {
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      button.classList.add('active');
      setActiveQuestions(filter);
      renderQuestions();
      updateScore();
    }

    function resetAttempt() {
      userState.clear();
      buildShuffledQuestionSet();
      setActiveQuestions(currentFilter);
      renderQuestions();
      updateScore();
    }

    function escapeHTML(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function renderQuestions() {
      const container = document.getElementById('questionsContainer');
      container.innerHTML = '';
      const letters = ['A', 'B', 'C', 'D', 'E'];

      activeQuestions.forEach((q, displayIndex) => {
        const state = userState.get(q.id) || { submitted: false, selected: [], score: 0 };
        const card = document.createElement('div');
        card.className = 'q-card';
        card.id = `qcard-${q.id}`;

        if (state.submitted) {
          card.classList.add('answered');
          if (state.score === 1) card.classList.add('is-correct');
          else if (state.score > 0) card.classList.add('is-partial');
          else card.classList.add('is-wrong');
        }

        let optionsHTML = '';
        q.options.forEach((option, index) => {
          let extraClass = '';
          if (state.submitted) {
            if (option.correct && state.score === 1) extraClass = 'user-correct';
            else if (option.correct) extraClass = 'reveal-correct';
            else if (state.selected.includes(index)) extraClass = 'user-wrong';
          } else if (state.selected.includes(index)) {
            extraClass = 'selected';
          }

          optionsHTML += `
            <button type="button" class="opt-btn ${extraClass}" ${state.submitted ? 'disabled' : ''}
                    onclick="handleOptionClick('${q.id}', ${index})">
              <span class="opt-prefix">${letters[index]}.</span>
              <span>${escapeHTML(option.text)}</span>
            </button>
          `;
        });

        const badge = q.type === 'sata' ? 'SATA' : 'MCQ';
        const submitDisabled = state.submitted || state.selected.length === 0 ? 'disabled' : '';
        const buttonText = state.submitted ? 'Submitted' : 'Submit Answer';

        card.innerHTML = `
          <div class="q-header">
            <span class="q-num">Question ${displayIndex + 1}</span>
            <span class="q-cat">${badge}</span>
          </div>
          <div class="q-text">${escapeHTML(q.prompt)}</div>
          <div class="opt-list">${optionsHTML}</div>
          <button class="submit-q-btn" id="btn_${q.id}" ${submitDisabled}
                  onclick="submitAnswer('${q.id}')">${buttonText}</button>
          <div class="feedback-box" id="feedback_${q.id}"></div>
        `;

        container.appendChild(card);
        if (state.submitted) showFeedback(q.id);
      });
    }

    function handleOptionClick(qid, optionIndex) {
      const q = shuffledQuestions.find(item => item.id === qid);
      if (!q) return;
      const previous = userState.get(qid) || { submitted: false, selected: [], score: 0 };
      if (previous.submitted) return;

      let selected;
      if (q.type === 'mcq') {
        selected = [optionIndex];
      } else {
        selected = [...previous.selected];
        const at = selected.indexOf(optionIndex);
        if (at >= 0) selected.splice(at, 1);
        else selected.push(optionIndex);
      }
      userState.set(qid, { submitted: false, selected, score: 0 });
      renderQuestions();
    }

    function submitAnswer(qid) {
      const q = shuffledQuestions.find(item => item.id === qid);
      const state = userState.get(qid);
      if (!q || !state || state.submitted || state.selected.length === 0) return;

      state.submitted = true;
      if (q.type === 'mcq') {
        state.score = q.options[state.selected[0]]?.correct ? 1 : 0;
      } else {
        const totalCorrect = q.options.filter(option => option.correct).length;
        let correctSelected = 0;
        let incorrectSelected = 0;
        state.selected.forEach(index => {
          if (q.options[index]?.correct) correctSelected++;
          else incorrectSelected++;
        });
        // SATA credit: +1/N for each correct selection, -1/N for each incorrect selection, min 0, max 1.
        state.score = Math.min(1, Math.max(0, (correctSelected - incorrectSelected) / totalCorrect));
      }

      userState.set(qid, state);
      updateScore();
      renderQuestions();
    }

    function showFeedback(qid) {
      const q = shuffledQuestions.find(item => item.id === qid);
      const state = userState.get(qid);
      const box = document.getElementById(`feedback_${qid}`);
      if (!q || !state || !box) return;

      let klass = 'incorrect';
      let title = '✗ Incorrect';
      if (state.score === 1) { klass = 'correct'; title = '✓ Correct!'; }
      else if (state.score > 0) { klass = 'partial'; title = `Partial Credit (+${state.score.toFixed(2)})`; }
      box.className = `feedback-box ${klass}`;
      box.style.display = 'block';
      box.innerHTML = `<div class="feedback-title">${title}</div><div class="explanation">${escapeHTML(q.explanation)}</div>`;
    }

    document.getElementById('navTabs').addEventListener('click', event => {
      const button = event.target.closest('.filter-btn');
      if (!button) return;
      filterQuestions(button.dataset.filter, button);
    });
    document.getElementById('resetBtn').addEventListener('click', resetAttempt);

    // The All filter is the default; question order and every option list are shuffled at launch.
    buildShuffledQuestionSet();
    setActiveQuestions('all');
    renderQuestions();
    updateScore();
  </script>
